    return player.y + 12 < this.stormY;
  }

  stormWarning(player) {
    return clamp(1 - (player.y - this.stormY) / STORM.warnRange, 0, 1);
  }

  nearestHazard(player, radius = 30) {
    const cx = player.x + player.w / 2;
    const cy = player.y + player.h / 2;
    for (const h of this.hazards) {
      if (h.type === 'wall') continue;
      const key = h;
      if ((this._nearCooldown.get(key) || 0) > this.time) continue;
      const r = hazardRect(h);
      if (!r) continue;
      const nx = clamp(cx, r.x, r.x + r.w);
      const ny = clamp(cy, r.y, r.y + r.h);
      const d = Math.hypot(cx - nx, cy - ny);
      if (d < radius && d > 1) {
        this._nearCooldown.set(key, this.time + 1.2);
        return h;
      }
    }
    return null;
  }

  clearNearMissCooldowns() {
    this._nearCooldown.clear();
  }
}

/* ---- js/game/player.js ---- */
const INSET = PHYS.hitInset;

class Player {
  constructor() {
    this.def = null;
    this.trailDef = null;
    this.costume = null;
    this.reset(VIEW.w / 2, 200);
  }

  reset(x, y) {
    this.x = x - PHYS.w / 2;
    this.y = y;
    this.w = PHYS.w;
    this.h = PHYS.h;
    this.vx = 0;
    this.vy = 0;
    this.onGround = false;
    this.groundRef = null;
    this.coyote = 0;
    this.buffer = 0;
    this.airJumps = this.maxAirJumps();
    this.jumpsUsed = 0;
    this.dashTimer = 0;
    this.dashCd = 0;
    this.dashDir = 1;
    this.invuln = 0;
    this.shield = false;
    this.powerups = { magnet: 0, slow: 0, glide: 0 };
    this.facing = 1;
    this.squashX = 1;
    this.squashY = 1;
    this.trail = [];
    this.trailTimer = 0;
    this.anim = 0;
    this.blink = 0;
    this.dropTimer = 0;
    this.jumpHeldLast = false;
    this.airTime = 0;
    this.fallTime = 0;
    this.wingsActive = false;
    this.landImpact = 0;
    this.events = [];
    this.alive = true;
  }

  maxAirJumps() {
    return this.def?.stats?.air ?? PHYS.airJumps;
  }

  setLoadout(charDef, trailDef) {
    this.def = charDef;
    this.trailDef = trailDef;
    this.airJumps = Math.min(this.airJumps, this.maxAirJumps());
  }

  hitbox() {
    return { x: this.x + INSET, y: this.y + INSET, w: this.w - INSET * 2, h: this.h - INSET * 2 };
  }

  glideActive() {
    return this.powerups.glide > 0 || !!this.def?.stats?.glide;
  }

  addPower(kind) {
    if (kind === 'shield') {
      this.shield = true;
      return;
    }
    this.powerups[kind] = Math.max(this.powerups[kind] || 0, 0) + (kind === 'magnet' ? 7 : kind === 'slow' ? 5 : 7);
  }

  hurt(dir = 0) {
    if (this.invuln > 0) return 'none';
    if (this.shield) {
      this.shield = false;
      this.invuln = 0.9;
      this.vx = dir * 260;
      this.vy = -180;
      return 'shield';
    }
    this.invuln = 1.4;
    this.vx = dir * 300;
    this.vy = -260;
    this.squashX = 0.7;
    this.squashY = 1.3;
    return 'hit';
  }

  update(dt, input, world) {
    this.events.length = 0;
    this.wingsActive = false;
    const stats = this.def?.stats || { speed: PHYS.speed, jump: PHYS.jump, gravity: PHYS.gravity, air: 1 };

    this.invuln = Math.max(0, this.invuln - dt);
    this.dashCd = Math.max(0, this.dashCd - dt);
    this.dropTimer = Math.max(0, this.dropTimer - dt);
    this.anim += dt * (this.onGround ? Math.min(1.4, 0.3 + Math.abs(this.vx) / 320) : 0.6);
    this.blink -= dt;
    if (this.blink < -0.2 - Math.random() * 2.6) this.blink = 0.12;
    for (const k of Object.keys(this.powerups)) this.powerups[k] = Math.max(0, this.powerups[k] - dt);

    const axis = input.axis;
    if (input.jumpQueued) {
      this.buffer = PHYS.buffer;
      input.consumeJump();
    }
    if (input.dashQueued) {
      input.consumeDash();
      if (this.dashCd <= 0 && this.dashTimer <= 0) {
        this.dashTimer = PHYS.dashTime;
        this.dashCd = PHYS.dashCooldown;
        this.dashDir = axis !== 0 ? axis : this.facing;
        this.facing = this.dashDir;
        this.onGround = false;
        this.vy = 0;
        this.events.push({ type: 'dash' });
      }
    }

    if (this.dashTimer > 0) {
      this.dashTimer -= dt;
      this.vx = this.dashDir * PHYS.dashSpeed;
      this.vy = 0;
    } else {
      const accel = this.onGround ? PHYS.accelGround : PHYS.accelAir;
      if (axis !== 0) {
        this.vx = approach(this.vx, axis * stats.speed, accel * dt);
        this.facing = axis;
      } else {
        const fr = this.onGround ? PHYS.frictionGround : PHYS.frictionAir;
        this.vx = approach(this.vx, 0, fr * dt);
      }
      const wings = !this.onGround && input.wantsJump && this.vy > 0;
      this.wingsActive = wings;
      if (wings) {
        const cap = this.glideActive() ? PHYS.glideFall : PHYS.wingFall;
        this.vy = approach(this.vy, cap, PHYS.wingDrag * dt);
        this.fallTime = 0;
      } else {
        const gMul = this.vy > 0 ? 1.1 : PHYS.riseGravity;
        this.vy += stats.gravity * gMul * dt;
        if (this.vy > 0) this.fallTime += dt;
        else this.fallTime = 0;
        const boost = Math.min(PHYS.fallBoost, this.fallTime * PHYS.fallBoostRate);
        const cap = world.maxFall + boost;
        if (this.vy > cap) this.vy = cap;
      }
      if (this.jumpHeldLast && !input.wantsJump && this.vy < -160) this.vy *= PHYS.jumpCut;
    }
    this.jumpHeldLast = input.wantsJump;

    this.buffer = Math.max(0, this.buffer - dt);
    this.coyote = Math.max(0, this.coyote - dt);

    if (this.buffer > 0 && this.dashTimer <= 0) {
      if (this.onGround || this.coyote > 0) {
        this.vy = -stats.jump;
        this.onGround = false;
        this.groundRef = null;
        this.buffer = 0;
        this.coyote = 0;
        this.fallTime = 0;
        this.jumpsUsed = 1;
        this.squashX = 0.78;
        this.squashY = 1.24;
        this.events.push({ type: 'jump' });
      } else if (this.airJumps > 0) {
        this.airJumps -= 1;
        this.jumpsUsed += 1;
        this.fallTime = 0;
        this.vy = -stats.jump * 0.92;
        this.buffer = 0;
        this.squashX = 0.8;
        this.squashY = 1.22;
        this.events.push({ type: 'double' });
        for (let i = 0; i < 8; i++) this.events.push({ type: 'airburst' });
      }
    }

    if (input.downQueued && this.onGround && this.groundRef && this.groundRef.type === 'cloud') {
      this.onGround = false;
      this.groundRef = null;
      this.y += 8;
      this.dropTimer = 0.26;
      input.consumeDown?.();
    }

    this.x += this.vx * dt;
    const minX = 14;
    const maxX = VIEW.w - 14 - this.w;
    if (this.x < minX) {
      this.x = minX;
      if (this.vx < 0) this.vx = 0;
    } else if (this.x > maxX) {
      this.x = maxX;
      if (this.vx > 0) this.vx = 0;
    }

    const prevBottom = this.y + this.h;
    this.y += this.vy * dt;

    if (this.vy >= 0) {
      const candidates = world.platformsNear(this.y + this.h);
      for (const p of candidates) {
        if (this.x + this.w <= p.x + 3 || this.x >= p.x + p.w - 3) continue;
        if (this.dropTimer > 0 && p.type === 'cloud') continue;
        if (prevBottom <= p.y + 2 && this.y + this.h >= p.y) {
          const impact = this.vy;
          this.y = p.y - this.h;
          this.vy = 0;
          this.onGround = true;
          this.groundRef = p;
          this.coyote = PHYS.coyote;
          this.airJumps = this.maxAirJumps();
          this.fallTime = 0;
          p.squash = Math.min(1, impact / 700);
          if (p.type === 'bounce') {
            this.vy = -640;
            this.onGround = false;
            this.groundRef = null;
            this.events.push({ type: 'bounce' });
          } else {
            const wasAir = this.airTime > 0.12;
            if (wasAir) {
              const perfect = this.jumpsUsed === 0 && Math.abs(this.vx) < 150 && impact > 420;
              this.events.push({ type: 'land', impact, perfect, platform: p });
            }
            if (p.type === 'crumble' && p.timer <= 0) {
              p.timer = 0.55;
              this.events.push({ type: 'crumble' });
            }
            this.airTime = 0;
            this.jumpsUsed = 0;
          }
          break;
        }
      }
    }

    if (this.onGround) {
      const p = this.groundRef;
      if (!p || p.broken || this.x + this.w < p.x + 4 || this.x > p.x + p.w - 4) {
        this.onGround = false;
        this.groundRef = null;
        this.coyote = PHYS.coyote;
      } else {
        this.y = p.y - this.h;
        if (p.range) this.x = clamp(this.x + (p.x - (p.lastX ?? p.x)), 14, VIEW.w - 14 - this.w);
        p.lastX = p.x;
      }
    }

    if (!this.onGround) this.airTime += dt;

    this.squashX = damp(this.squashX, 1, 12, dt);
    this.squashY = damp(this.squashY, 1, 12, dt);

    this.trailTimer -= dt;
    const speed = Math.hypot(this.vx, this.vy);
    if (this.trailTimer <= 0 && speed > 40) {
      this.trailTimer = 0.024;
      this.trail.push({ x: this.x + this.w / 2, y: this.y + this.h / 2, life: 0.4, max: 0.4 });
      if (this.trail.length > 26) this.trail.shift();
    }
    for (const t of this.trail) t.life -= dt;
    this.trail = this.trail.filter((t) => t.life > 0);
  }

  render(ctx, cam) {
    const def = this.def || { color: '#ff7a6b', accent: '#ffd166', hat: 'tuft' };
    const trailDef = this.trailDef || { color: '#ffd166', style: 'dot' };
    const cx = this.x + this.w / 2;
    const sy = this.y - cam;
    const cy = sy + this.h / 2;

    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const a = (t.life / t.max) * 0.5 * (i / this.trail.length + 0.25);
      const ty = t.y - cam;
      if (ty < -30 || ty > 640) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = trailDef.color;
      if (trailDef.style === 'streak') {
        ctx.fillRect(t.x - 3, ty - 8, 6, 16);
      } else if (trailDef.style === 'petal') {
        ctx.beginPath();
        ctx.ellipse(t.x, ty, 5, 3, i * 0.6, 0, TAU);
        ctx.fill();
      } else if (trailDef.style === 'ribbon') {
        ctx.fillRect(t.x - 2, ty - 4, 4, 8);
      } else {
        ctx.beginPath();
        ctx.arc(t.x, ty, 3.4, 0, TAU);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    if (this.onGround && this.groundRef) {
      ctx.fillStyle = alpha('#000000', 0.28);
      ctx.beginPath();
      ctx.ellipse(cx, this.groundRef.y + 2, 18, 5, 0, 0, TAU);
      ctx.fill();
    }

    if (this.invuln > 0 && Math.floor(this.invuln * 14) % 2 === 0) return;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(this.squashX, this.squashY);
    const tilt = clamp(this.vx / 1400, -0.22, 0.22);
    ctx.rotate(tilt);

    const bob = this.onGround ? Math.sin(this.anim * 8) * 1.6 : Math.sin(this.anim * 3) * 1.2;
    const legSwing = this.onGround ? Math.sin(this.anim * 12) * 7 : 4;

    if (this.wingsActive) {
      const flap = 0.5 + 0.5 * Math.sin(this.anim * 26);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle =
        this.costume === 'green' ? '#4fbf4a' : this.costume === 'red' ? '#e23b2e' : this.costume === 'dino' ? '#5cc84a' : def.accent;
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(
          side * 15,
          -2 + bob,
          10,
          4 + flap * 6,
          side * (0.55 - flap * 0.45),
          0,
          TAU
        );
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    const look = {
      bob,
      legSwing,
      facing: this.facing > 0 ? 1 : -1,
      blink: this.blink > 0,
      t: this.anim,
    };
    if (this.costume === 'dino') drawDino(ctx, this.costume, look);
    else if (this.costume) drawPlumber(ctx, this.costume, look);
    else if (def.look) drawFriend(ctx, def, look);
    else drawFaller(ctx, def, look);

    if (this.shield) {
      ctx.strokeStyle = alpha('#6ee7ff', 0.75 + Math.sin(this.anim * 6) * 0.2);
      ctx.lineWidth = 2.4;
      ctx.shadowColor = '#6ee7ff';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(0, -4, 26, 0, TAU);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

}

/* ---- js/game/ui.js ---- */
const COLORS = {
  ink: '#070a14',
  panel: '#101725',
  panelLight: '#1a2334',
  stroke: 'rgba(255,255,255,0.14)',
  text: '#eef4ff',
  muted: 'rgba(238,244,255,0.6)',
  good: '#6ee7b7',
  bad: '#ff8a7a',
};

function font(size, weight = 700) {
  return `${weight} ${size}px "Segoe UI", system-ui, -apple-system, sans-serif`;
}

class UI {
  constructor(game) {
    this.game = game;
    this.dragging = null;
    this._hoverId = null;
    this._hoverNow = null;
  }

  begin() {
    this._hoverNow = null;
  }

  end() {
    if (this._hoverNow !== this._hoverId) {
      if (this._hoverNow) this.game.audio.sfx('ui', { hover: true });
      this._hoverId = this._hoverNow;
    }
  }

  get accent() {
    return this.game.palette.accent;
  }

  clicked(x, y, w, h) {
    const p = this.game.input.pointer;
    return p.clicked && p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;
  }

  button(ctx, x, y, w, h, label, opts = {}) {
    const { input } = this.game;
    const p = input.pointer;
    const id = opts.id || label;
    const disabled = !!opts.disabled;
    const over = p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;
    let clicked = false;
    if (over && p.clicked) {
      p.clicked = false;
      if (disabled) this.game.audio.sfx('deny');
      else clicked = true;
    }
    if (over && !disabled) this._hoverNow = id;

    const variant = opts.variant || 'secondary';
    const press = over && p.down ? 1 : 0;
    const scale = 1 + (over && !disabled ? 0.012 : 0);
    const accent = opts.color || this.accent;
    const offsetY = press * 1.5;

    ctx.save();
    ctx.translate(x + w / 2, y + h / 2 + offsetY);
    ctx.scale(scale, scale);
    const bx = -w / 2;
    const by = -h / 2;

    if (variant === 'primary') {
      const g = ctx.createLinearGradient(0, by, 0, by + h);
      g.addColorStop(0, shade(accent, 0.28));
      g.addColorStop(1, accent);
      ctx.fillStyle = disabled ? alpha(accent, 0.3) : g;
      rr(ctx, bx, by, w, h, Math.min(16, h / 2));
      ctx.fill();
      ctx.fillStyle = alpha('#ffffff', 0.32);
      rr(ctx, bx + 4, by + 3, w - 8, Math.min(10, h * 0.22), 6);
      ctx.fill();
      ctx.strokeStyle = alpha('#ffffff', 0.28);
      ctx.lineWidth = 1.2;
      rr(ctx, bx, by, w, h, Math.min(16, h / 2));
      ctx.stroke();
    } else if (variant === 'ghost') {
      if (over) {
        ctx.fillStyle = alpha('#ffffff', 0.07);
        rr(ctx, bx, by, w, h, 12);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = disabled ? 'rgba(20,26,40,0.4)' : over ? 'rgba(30,40,62,0.92)' : 'rgba(16,23,37,0.82)';
      rr(ctx, bx, by, w, h, 12);
      ctx.fill();
      ctx.strokeStyle = over && !disabled ? alpha(accent, 0.65) : COLORS.stroke;
      ctx.lineWidth = 1.4;
      rr(ctx, bx, by, w, h, 12);
      ctx.stroke();
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const sub = opts.sub;
    const labelSize = opts.size || 18;
    ctx.fillStyle = variant === 'primary' ? '#0a1020' : disabled ? 'rgba(238,244,255,0.32)' : COLORS.text;
    ctx.font = font(labelSize, 800);
    const labelY = sub ? -h * 0.12 : 0;
    ctx.fillText(label, 0, labelY);
    if (sub) {
      ctx.font = font(11, 700);
      ctx.fillStyle = variant === 'primary' ? 'rgba(10,16,32,0.62)' : COLORS.muted;
      ctx.fillText(sub, 0, h * 0.24);
    }
    ctx.restore();
    return clicked;
  }

  panel(ctx, x, y, w, h, opts = {}) {
    const { radius = 18, fill = 'rgba(12,18,30,0.9)', stroke = COLORS.stroke, shadow = true } = opts;
    if (shadow) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = 40;
      ctx.shadowOffsetY = 14;
      ctx.fillStyle = fill;
      rr(ctx, x, y, w, h, radius);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = fill;
      rr(ctx, x, y, w, h, radius);
      ctx.fill();
    }
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.2;
    rr(ctx, x, y, w, h, radius);
    ctx.stroke();
  }

  text(ctx, str, x, y, opts = {}) {
    const { size = 16, weight = 600, color = COLORS.text, align = 'left', baseline = 'alphabetic', glow = null } = opts;
    ctx.font = font(size, weight);
    ctx.textAlign = align;
    ctx.textBaseline = baseline;
    if (glow) {
      ctx.shadowColor = glow;
      ctx.shadowBlur = 16;
    }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
    if (glow) ctx.shadowBlur = 0;
  }

  bar(ctx, x, y, w, h, value, opts = {}) {
    const color = opts.color || this.accent;
    ctx.fillStyle = opts.bg || 'rgba(255,255,255,0.12)';
    rr(ctx, x, y, w, h, h / 2);
    ctx.fill();
    const v = clamp(value, 0, 1);
    if (v > 0) {
      ctx.fillStyle = color;
      rr(ctx, x, y, Math.max(h, w * v), h, h / 2);
      ctx.fill();
    }
  }

  slider(ctx, x, y, w, value, id) {
    const { input } = this.game;
    const p = input.pointer;
    const over = p.x > x - 12 && p.x < x + w + 12 && p.y > y - 18 && p.y < y + 18;
    if (over && p.clicked) {
      this.dragging = id;
      p.clicked = false;
    }
    if (!p.down && this.dragging === id) this.dragging = null;
    let out = null;
    if (this.dragging === id) {
      out = clamp((p.x - x) / w, 0, 1);
      value = out;
      p.clicked = false;
    }
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    rr(ctx, x, y - 3, w, 6, 3);
    ctx.fill();
    ctx.fillStyle = this.accent;
    rr(ctx, x, y - 3, Math.max(6, w * value), 6, 3);
    ctx.fill();
    const kx = x + w * value;
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = alpha(this.accent, 0.8);
    ctx.shadowBlur = over || this.dragging === id ? 16 : 8;
    ctx.beginPath();
    ctx.arc(kx, y, over || this.dragging === id ? 9 : 7.5, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
    return out;
  }

  toggle(ctx, x, y, value, id) {
    const { input } = this.game;
    const p = input.pointer;
    const w = 52;
    const h = 26;
    const over = p.x > x - 6 && p.x < x + w + 6 && p.y > y - 10 && p.y < y + h + 10;
    let out = null;
    if (over && p.clicked) {
      p.clicked = false;
      out = !value;
      this.game.audio.sfx('ui');
    }
    ctx.fillStyle = value ? alpha(this.accent, 0.85) : 'rgba(255,255,255,0.16)';
    rr(ctx, x, y, w, h, h / 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x + (value ? w - h / 2 : h / 2), y + h / 2, h / 2 - 4, 0, TAU);
    ctx.fill();
    return out;
  }

  heart(ctx, x, y, s, filled, color = '#ff6b8b') {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, s * 0.75);
    ctx.bezierCurveTo(-s * 1.2, -s * 0.1, -s * 0.45, -s * 0.95, 0, -s * 0.3);
    ctx.bezierCurveTo(s * 0.45, -s * 0.95, s * 1.2, -s * 0.1, 0, s * 0.75);
    if (filled) {
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.fill();
    } else {
      ctx.strokeStyle = alpha(color, 0.35);
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  gem(ctx, x, y, r, color, t = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(t * 1.5) * 0.16);
    const w = r * 0.78;
    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.4, color);
    g.addColorStop(1, alpha(color, 0.6));
    ctx.fillStyle = g;
    ctx.shadowColor = color;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.lineTo(w, 0);
    ctx.lineTo(0, r);
    ctx.lineTo(-w, 0);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = alpha('#ffffff', 0.55);
    ctx.lineWidth = Math.max(0.8, r * 0.09);
    ctx.beginPath();
    ctx.moveTo(-w, 0);
    ctx.lineTo(0, -r);
    ctx.lineTo(w, 0);
    ctx.lineTo(0, r);
    ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = alpha('#ffffff', 0.7);
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.72);
    ctx.lineTo(w * 0.36, 0);
    ctx.lineTo(0, r * 0.18);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  icon(ctx, kind, x, y, s, color = '#101322') {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.6, s * 0.18);
    if (kind === 'shield') {
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(s * 0.8, -s * 0.55);
      ctx.quadraticCurveTo(s * 0.8, s * 0.6, 0, s);
      ctx.quadraticCurveTo(-s * 0.8, s * 0.6, -s * 0.8, -s * 0.55);
      ctx.closePath();
      ctx.fill();
    } else if (kind === 'magnet') {
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.7, Math.PI, 0);
      ctx.lineWidth = s * 0.4;
      ctx.stroke();
      ctx.fillRect(-s * 0.9, 0, s * 0.4, s * 0.6);
      ctx.fillRect(s * 0.5, 0, s * 0.4, s * 0.6);
    } else if (kind === 'clock') {
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.8, 0, TAU);
      ctx.lineWidth = s * 0.22;
      ctx.stroke();
      ctx.lineWidth = s * 0.16;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -s * 0.45);
      ctx.moveTo(0, 0);
      ctx.lineTo(s * 0.35, s * 0.2);
      ctx.stroke();
    } else if (kind === 'feather') {
      ctx.beginPath();
      ctx.moveTo(-s * 0.85, s * 0.2);
      ctx.quadraticCurveTo(0, -s * 1.05, s * 0.85, s * 0.2);
      ctx.quadraticCurveTo(0, s * 0.5, -s * 0.85, s * 0.2);
      ctx.fill();
    } else if (kind === 'gem') {
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(s * 0.75, 0);
      ctx.lineTo(0, s);
      ctx.lineTo(-s * 0.75, 0);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  character(ctx, def, x, y, scale = 1, t = 0, facing = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale * facing, scale);
    const opts = { bob: Math.sin(t * 2.4) * 2, t, facing: 1, shadow: true };
    if (def.look) drawFriend(ctx, def, opts);
    else drawFaller(ctx, def, opts);
    ctx.restore();
  }

  sparkle(ctx, x, y, r, color, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t * 0.6);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.7;
    const s = r * (0.75 + Math.sin(t * 4) * 0.25);
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(s * 0.46, 0);
    ctx.lineTo(0, s);
    ctx.lineTo(-s * 0.46, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  bannerText(ctx, str, size = 44) {
    ctx.save();
    ctx.font = font(size, 900);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(1, this.accent);
    ctx.fillStyle = g;
    ctx.fillText(str, 0, 0);
    ctx.restore();
  }

  shakeForButton(t) {
    return easeOutCubic(t) * 20;
  }
}

function drawHat(ctx, def, top, bob = 0) {
  const accent = def.accent || '#ffd166';
  ctx.fillStyle = accent;
  ctx.strokeStyle = 'rgba(8,11,20,0.35)';
  ctx.lineWidth = 1;
  switch (def.hat) {
    case 'spike':
      ctx.beginPath();
      ctx.moveTo(-6, top + 2 + bob);
      ctx.quadraticCurveTo(-1, top - 12 + bob, 6, top - 13 + bob);
      ctx.quadraticCurveTo(3, top - 3 + bob, 6, top + 2 + bob);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      break;
    case 'horns':
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * 7, top + 2 + bob);
        ctx.quadraticCurveTo(s * 10, top - 7 + bob, s * 15, top - 9 + bob);
        ctx.quadraticCurveTo(s * 12, top - 1 + bob, s * 10, top + 2 + bob);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      break;
    case 'antenna':
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, top + 2 + bob);
      ctx.quadraticCurveTo(3, top - 8 + bob, 9, top - 12 + bob);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(9, top - 12 + bob, 3.4, 0, TAU);
      ctx.fill();
      break;
    case 'crown':
      ctx.beginPath();
      ctx.moveTo(-9, top + 2 + bob);
      ctx.lineTo(-9, top - 6 + bob);
      ctx.lineTo(-4.5, top - 1.5 + bob);
      ctx.lineTo(0, top - 9 + bob);
      ctx.lineTo(4.5, top - 1.5 + bob);
      ctx.lineTo(9, top - 6 + bob);
      ctx.lineTo(9, top + 2 + bob);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = alpha('#ffffff', 0.85);
      ctx.beginPath();
      ctx.arc(-4.5, top - 1 + bob, 1.2, 0, TAU);
      ctx.arc(0, top - 4.5 + bob, 1.4, 0, TAU);
      ctx.arc(4.5, top - 1 + bob, 1.2, 0, TAU);
      ctx.fill();
      break;
    case 'hood':
      ctx.beginPath();
      ctx.arc(0, top + 5 + bob, 13, Math.PI * 1.02, Math.PI * 1.98);
      ctx.quadraticCurveTo(15, top + 10 + bob, 0, top + 7 + bob);
      ctx.quadraticCurveTo(-15, top + 10 + bob, -13, top + 5 + bob);
      ctx.fill();
      ctx.strokeStyle = alpha('#ffffff', 0.25);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(0, top + 5 + bob, 11.6, Math.PI * 1.08, Math.PI * 1.92);
      ctx.stroke();
      break;
    default:
      ctx.beginPath();
      ctx.moveTo(-5, top + 2 + bob);
      ctx.quadraticCurveTo(-3, top - 7 + bob, 1, top - 4 + bob);
      ctx.quadraticCurveTo(3, top - 9 + bob, 6, top - 1 + bob);
      ctx.quadraticCurveTo(4, top + 2 + bob, -5, top + 2 + bob);
      ctx.closePath();
      ctx.fill();
      break;
  }
}

function drawFaller(ctx, def, opts = {}) {
  const { bob = 0, legSwing = 0, facing = 1, blink = false, shadow = false, t = 0 } = opts;
  const body = def.color || '#ff7a6b';
  const accent = def.accent || '#ffd166';
  const ink = 'rgba(7,11,20,0.5)';

  ctx.save();
  if (shadow) {
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(0, 26, 17, 4.6, 0, 0, TAU);
    ctx.fill();
  }

  ctx.fillStyle = '#2a3149';
  rr(ctx, -8.2, 8 + bob + legSwing * 0.3, 7.6, 11.5, 3.4);
  ctx.fill();
  rr(ctx, 0.8, 8 + bob - legSwing * 0.3, 7.6, 11.5, 3.4);
  ctx.fill();
  ctx.fillStyle = '#171d2e';
  rr(ctx, -9.2, 16.6 + bob + legSwing * 0.3, 9.4, 4.2, 2.1);
  ctx.fill();
  rr(ctx, 0, 16.6 + bob - legSwing * 0.3, 9.4, 4.2, 2.1);
  ctx.fill();

  const dir = facing >= 0 ? -1 : 1;
  const wave = Math.sin(t * 5) * 2.4;
  ctx.fillStyle = alpha(accent, 0.92);
  ctx.beginPath();
  ctx.moveTo(dir * 7, -8 + bob);

  ctx.strokeStyle = ink;

  ctx.beginPath();

function drawPlumber(ctx, outfit, opts = {}) {

  rr(ctx, -0.5, 14.8 + bob - swing, 10.4, 5.3, 2.6);

  rr(ctx, 0.8, 15.7 + bob - swing, 4.6, 1.2, 0.6);

  rr(ctx, -15.2, -6.6 + bob + armSwing, 5.4, 12.4, 2.7);

  rr(ctx, 9.8, -6.6 + bob - armSwing, 5.4, 12.4, 2.7);

  ctx.strokeStyle = ink;

  ctx.stroke();

    ctx.ellipse(3.7 + look, eyeY, 2.6, 3.0, 0, 0, TAU);

    ctx.fillStyle = '#2b4c8c';

  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.1;

  ctx.fillStyle = shirt;

  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.3;

    ctx.lineTo(ex + 1.3, ey + 1.2);
  } else {
    ctx.moveTo(ex - 1.4, ey + 1.2);
    ctx.lineTo(ex - 0.8, ey - 1.2);

    ctx.lineTo(ex + 0.8, ey - 1.2);
    ctx.lineTo(ex + 1.4, ey + 1.2);

  ctx.restore();
}

function drawDino(ctx, outfit, opts = {}) {
  const { bob = 0, legSwing = 0, facing = 1, blink = false, shadow = false } = opts;

  const saddleDark = '#a82c1c';

    ctx.ellipse(0, 26, 18, 4.8, 0, 0, TAU);

  ctx.ellipse(-dir * 14, 5 + bob, 6.2, 2.2, dir * 0.22, 0, TAU);

  ctx.fillStyle = hide;
  rr(ctx, -8.2, 4.6 + bob + swing, 7.6, 9.8, 3.4);
  ctx.fill();
  rr(ctx, 0.6, 4.6 + bob - swing, 7.6, 9.8, 3.4);

  ctx.fillStyle = boot;
  rr(ctx, -9.6, 12.6 + bob + swing, 10.2, 6.0, 2.8);

  ctx.stroke();

  ctx.fill();
  rr(ctx, -0.6 + (dir > 0 ? 3.2 : 0), 15.0 + bob - swing, 7.0, 3.2, 1.6);
  ctx.fill();

  ctx.fillStyle = hide;
  rr(ctx, -14.0, -5.2 + bob + armSwing, 5.0, 9.6, 2.4);
  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.1;
  ctx.stroke();
  rr(ctx, 9.0, -5.2 + bob - armSwing, 5.0, 9.6, 2.4);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = hideLight;
  ctx.beginPath();
  ctx.arc(-11.5, 4.4 + bob + armSwing, 2.6, 0, TAU);
  ctx.arc(11.5, 4.4 + bob - armSwing, 2.6, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 0.9;
  ctx.stroke();

  const bodyGrad = ctx.createLinearGradient(-11, -8, 11, 14);

  bodyGrad.addColorStop(0.6, hide);

  rr(ctx, -10.5, -8.0 + bob, 21, 18.8, 8.6);
  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.4;

  ctx.ellipse(dir * 3.2, 2.6 + bob, 6.6, 8.2, dir * 0.08, 0, TAU);

  ctx.ellipse(sx, -1.6 + bob, 7.0, 8.4, -dir * 0.22, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.fillStyle = alpha(saddleDark, 0.55);
  ctx.beginPath();
  ctx.ellipse(sx - dir * 1.4, -1.0 + bob, 4.0, 6.0, -dir * 0.22, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = alpha('#ffffff', 0.55);
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.ellipse(sx, -1.6 + bob, 5.4, 6.6, -dir * 0.22, 0, TAU);
  ctx.stroke();

  const hy = -17 + bob;
  ctx.fillStyle = hide;
  ctx.beginPath();
  ctx.arc(0, hy, 10.2, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.4;

  ctx.fillStyle = hideLight;

  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.3;
  ctx.stroke();

  ctx.fillStyle = hideDark;
  ctx.beginPath();

  ctx.ellipse(dir * 9.0, hy + 0.0, 1.3, 1.0, 0, 0, TAU);
  ctx.fill();

  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.2;

  ctx.moveTo(dir * 1.6, hy + 6.4);
  ctx.quadraticCurveTo(dir * 7.4, hy + 9.2, dir * 13.2, hy + 4.4);
  ctx.stroke();

  const eyeY = hy - 3.4;
  const look = dir * 1.1;
  if (blink) {
    ctx.fillStyle = '#1d2940';
    rr(ctx, -5.6 + look, eyeY - 0.9, 4.0, 1.8, 0.9);
    ctx.fill();
    rr(ctx, 1.6 + look, eyeY - 0.9, 4.0, 1.8, 0.9);
    ctx.fill();
  } else {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(-3.4 + look, eyeY, 3.0, 3.6, 0, 0, TAU);
    ctx.ellipse(3.8 + look, eyeY, 3.0, 3.6, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = alpha(ink, 0.6);
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.fillStyle = '#1d2940';
    ctx.beginPath();
    ctx.arc(-3.2 + look * 1.3, eyeY + 0.2, 1.5, 0, TAU);
    ctx.arc(4.0 + look * 1.3, eyeY + 0.2, 1.5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-3.6 + look * 1.3, eyeY - 0.3, 0.5, 0, TAU);
    ctx.arc(3.6 + look * 1.3, eyeY - 0.3, 0.5, 0, TAU);
    ctx.fill();
  }

  ctx.fillStyle = alpha('#ff9d8a', 0.35);
  ctx.beginPath();
  ctx.ellipse(dir * 1.8, hy + 4.4, 3.0, 2.0, 0, 0, TAU);
  ctx.fill();

  ctx.restore();
}

// ── Hangar roster art ──────────────────────────────────────────────────────

// the new hangar cards line up with the originals.

const FRIEND_INK = 'rgba(7,11,20,0.5)';
const FRIEND_SKIN = '#f7c8a0';
const FRIEND_SKIN_DARK = '#e0a878';
const FRIEND_HAIR = '#4a2c17';

function friendShadow(ctx) {
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(0, 24, 16, 4.4, 0, 0, TAU);
  ctx.fill();
}

function friendEyes(ctx, y, opts = {}) {
  const { gap = 3.4, r = 2.1, blink = false, look = 0, white = 0, pupil = '#20263a' } = opts;
  if (blink) {
    ctx.fillStyle = pupil;
    rr(ctx, -gap - r, y - 0.95, r * 2, 1.9, 0.95);
    ctx.fill();
    rr(ctx, gap - r, y - 0.95, r * 2, 1.9, 0.95);
    ctx.fill();
    return;
  }
  if (white > 0) {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(-gap, y, r + white, r + white, 0, 0, TAU);
    ctx.ellipse(gap, y, r + white, r + white, 0, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = pupil;
  ctx.beginPath();
  ctx.arc(-gap + look, y, r, 0, TAU);
  ctx.arc(gap + look, y, r, 0, TAU);
  ctx.fill();
  ctx.fillStyle = alpha('#ffffff', 0.9);
  ctx.beginPath();
  ctx.arc(-gap + look - r * 0.35, y - r * 0.42, r * 0.34, 0, TAU);
  ctx.arc(gap + look - r * 0.35, y - r * 0.42, r * 0.34, 0, TAU);
  ctx.fill();
}

  ctx.beginPath();
  ctx.arc(-5.6, 1.2 + bob, 1.6, 0, TAU);
  ctx.arc(5.6, 1.2 + bob, 1.6, 0, TAU);

  ctx.fillStyle = shirt;
  rr(ctx, -14.4, -4.8 + bob, 4.8, 10, 2.3);
  ctx.fill();
  rr(ctx, 9.6, -4.8 + bob, 4.8, 10, 2.3);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-12 + dir * 0.6, 6 + bob, 2.6, 0, TAU);
  ctx.arc(12 + dir * 0.6, 6 + bob, 2.6, 0, TAU);

  ctx.strokeStyle = FRIEND_INK;
  ctx.lineWidth = 0.9;
  ctx.stroke();

  ctx.fillStyle = FRIEND_SKIN;
  ctx.beginPath();
  ctx.arc(0, -16 + bob, 10.4, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = FRIEND_INK;

  ctx.beginPath();
  ctx.arc(dir * 9.2, -14.4 + bob, 2.7, 0, TAU);

  ctx.fillStyle = FRIEND_SKIN_DARK;

  ctx.ellipse(dir * 3.4, -12 + bob, 3.5, 2.9, 0, 0, TAU);

  ctx.fillStyle = skin;

  ctx.strokeStyle = FRIEND_INK;
  ctx.lineWidth = 1.3;
  ctx.stroke();

  ctx.fillStyle = shade(skin, 0.2);
  ctx.beginPath();
  ctx.ellipse(dir * 4.4, -13.6 + bob, 2.4, 2, 0, 0, TAU);

  ctx.fillStyle = hair;
  ctx.beginPath();
  ctx.ellipse(-8, -14 + bob, 3, 6, 0.2, 0, TAU);
  ctx.ellipse(8, -14 + bob, 3, 6, -0.2, 0, TAU);
  ctx.fill();

  friendEyes(ctx, -16.4 + bob, { gap: 3.4, r: 2, blink, look: dir * 0.8, white: 0.9, pupil: '#2a1b10' });

  ctx.strokeStyle = '#2a1b10';

function friendVampire(ctx, def, o) {
  const { bob = 0, legSwing = 0, facing = 1, blink = false } = o;
  const dir = facing >= 0 ? 1 : -1;
  const cape = def.color || '#2f3350';
  const lining = def.accent || '#e2452f';
  const suit = '#1b1e30';
  const skin = '#f0e2d2';

  ctx.fillStyle = lining;
  ctx.beginPath();
  ctx.moveTo(-9, -10 + bob);
  ctx.quadraticCurveTo(-20, 4 + bob, -16, 20 + bob + legSwing * 0.2);
  ctx.quadraticCurveTo(0, 14 + bob, 16, 20 + bob - legSwing * 0.2);
  ctx.quadraticCurveTo(20, 4 + bob, 9, -10 + bob);
  ctx.closePath();
  ctx.fill();

  for (const side of [-1, 1]) {
    ctx.fillStyle = cape;
    ctx.beginPath();
    ctx.moveTo(side * 7, -10 + bob);
    ctx.quadraticCurveTo(side * 17, 2 + bob, side * 14, 19 + bob);
    ctx.quadraticCurveTo(side * 9, 12 + bob, side * 6, 4 + bob);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = alpha(lining, 0.9);
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }

  ctx.fillStyle = '#12141f';
  rr(ctx, -8.8, 17.6 + bob + legSwing * 0.2, 8, 5, 2.4);
  ctx.fill();
  rr(ctx, 0.8, 17.6 + bob - legSwing * 0.2, 8, 5, 2.4);
  ctx.fill();

  ctx.fillStyle = suit;
  rr(ctx, -7.8, 8 + bob + legSwing * 0.2, 6.8, 10, 3);
  ctx.fill();
  rr(ctx, 1, 8 + bob - legSwing * 0.2, 6.8, 10, 3);
  ctx.fill();

  ctx.fillStyle = suit;
  rr(ctx, -9.8, -8 + bob, 19.6, 17, 7.4);
  ctx.fill();
  ctx.strokeStyle = FRIEND_INK;
  ctx.lineWidth = 1.4;
  ctx.stroke();

  ctx.fillStyle = alpha(lining, 0.9);
  ctx.beginPath();
  ctx.moveTo(-3.4, -8 + bob);
  ctx.lineTo(3.4, -8 + bob);
  ctx.lineTo(0, 2.4 + bob);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#f0e2d2';
  ctx.beginPath();
  ctx.arc(0, -7.4 + bob, 2.2, 0, TAU);
  ctx.fill();

  ctx.fillStyle = suit;
  rr(ctx, -13.4, -6 + bob, 4.2, 10, 2.1);
  ctx.fill();
  rr(ctx, 9.2, -6 + bob, 4.2, 10, 2.1);
  ctx.fill();
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(-11.4, 5 + bob, 2.1, 0, TAU);
  ctx.arc(11.4, 5 + bob, 2.1, 0, TAU);
  ctx.fill();

  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(0, -17 + bob, 9.6, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = FRIEND_INK;
  ctx.lineWidth = 1.3;
  ctx.stroke();

  ctx.fillStyle = '#141024';
  ctx.beginPath();
  ctx.arc(0, -19.4 + bob, 9.9, Math.PI, TAU);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-5.4, -19.6 + bob);
  ctx.lineTo(5.4, -19.6 + bob);
  ctx.lineTo(0, -13.4 + bob);
  ctx.closePath();
  ctx.fill();

  friendEyes(ctx, -17.2 + bob, { gap: 3.4, r: 2, blink, look: dir * 0.8, white: 1, pupil: '#c2172a' });

  ctx.strokeStyle = '#141024';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(-6.4, -22.6 + bob);
  ctx.lineTo(-1.6, -21.2 + bob);
  ctx.moveTo(6.4, -22.6 + bob);
  ctx.lineTo(1.6, -21.2 + bob);
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(-3.2, -9.6 + bob);
  ctx.lineTo(-1.2, -9.6 + bob);
  ctx.lineTo(-2.2, -6.4 + bob);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(1.2, -9.6 + bob);
  ctx.lineTo(3.2, -9.6 + bob);
  ctx.lineTo(2.2, -6.4 + bob);
  ctx.closePath();
  ctx.fill();
}

function friendMummy(ctx, def, o) {
  const { bob = 0, legSwing = 0, facing = 1 } = o;
  const dir = facing >= 0 ? 1 : -1;
  const wrap = def.color || '#e8e0c8';
  const wrapDark = '#b3aa92';
  const glow = '#8fe08a';

  ctx.strokeStyle = alpha(wrap, 0.9);
  ctx.lineWidth = 3.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-dir * 8, 6 + bob);
  ctx.bezierCurveTo(-dir * 18, 10 + bob, -dir * 22, 4 + bob, -dir * 26, 14 + bob);
  ctx.stroke();

  ctx.fillStyle = wrap;
  rr(ctx, -8, 8 + bob + legSwing * 0.2, 6.8, 10.4, 3);
  ctx.fill();
  rr(ctx, 1.2, 8 + bob - legSwing * 0.2, 6.8, 10.4, 3);
  ctx.fill();
  ctx.strokeStyle = FRIEND_INK;
  ctx.lineWidth = 1.1;
  ctx.stroke();

  ctx.fillStyle = wrap;
  rr(ctx, -9.8, -8 + bob, 19.6, 17.4, 7.6);
  ctx.fill();
  ctx.strokeStyle = FRIEND_INK;
  ctx.lineWidth = 1.3;
  ctx.stroke();

  ctx.strokeStyle = alpha(wrapDark, 0.9);
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(-9.4, -5 + i * 3.6 + bob);
    ctx.lineTo(9.4, -6.6 + i * 3.6 + bob);
    ctx.stroke();
  }

  ctx.fillStyle = wrap;
  rr(ctx, -13.4, -6 + bob, 4.4, 10, 2.2);
  ctx.fill();
  ctx.strokeStyle = FRIEND_INK;
  ctx.lineWidth = 1.1;
  ctx.stroke();
  rr(ctx, 9, -6 + bob, 4.4, 10, 2.2);
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = alpha(wrapDark, 0.85);
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-11.2, 3 + bob);
  ctx.lineTo(-11.8, 10 + bob);
  ctx.moveTo(11.2, 3 + bob);
  ctx.lineTo(11.8, 10 + bob);
  ctx.stroke();

  ctx.fillStyle = wrap;
  ctx.beginPath();
  ctx.arc(0, -17 + bob, 9.8, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = FRIEND_INK;
  ctx.lineWidth = 1.3;
  ctx.stroke();

  ctx.strokeStyle = alpha(wrapDark, 0.9);
  ctx.lineWidth = 1.3;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-9, -21 + i * 4 + bob);
    ctx.lineTo(9, -22.4 + i * 4 + bob);
    ctx.stroke();
  }

  ctx.fillStyle = '#2a2434';
  rr(ctx, -6.6, -21.6 + bob, 13.2, 3.6, 1.6);
  ctx.fill();
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(-3.4, -19.8 + bob, 1.4, 0, TAU);
  ctx.arc(3.4, -19.8 + bob, 1.4, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawFriend(ctx, def, opts = {}) {
  ctx.save();
  if (opts.shadow) friendShadow(ctx);
  if (def.look === 'dino') {
    drawDino(ctx, def.id, { ...opts, shadow: false });
    ctx.restore();
    return;
  }
  switch (def.look) {
    case 'plumber':
      friendPlumber(ctx, def, opts);
      break;
    case 'peach':
      friendPeach(ctx, def, opts);
      break;
    case 'toad':
      friendToad(ctx, def, opts);
      break;
    case 'turtle':
      friendBowser(ctx, def, opts);
      break;
    case 'ape':
      friendApe(ctx, def, opts);
      break;
    case 'bones':
      friendBones(ctx, def, opts);
      break;
    case 'rock':
      friendThwomp(ctx, def, opts);
      break;
    case 'plant':
      friendPlant(ctx, def, opts);
      break;
    case 'goomba':
      friendGoomba(ctx, def, opts);
      break;
    case 'fish':
      friendFish(ctx, def, opts);
      break;
    case 'jelly':
      friendJelly(ctx, def, opts);
      break;
    case 'crab':
      friendCrab(ctx, def, opts);
      break;
    case 'squid':
      friendSquid(ctx, def, opts);
      break;
    case 'seahorse':
      friendSeahorse(ctx, def, opts);
      break;
    case 'coral':
      friendCoral(ctx, def, opts);
      break;
    case 'star':
      friendStar(ctx, def, opts);
      break;
    case 'eye':
      friendEye(ctx, def, opts);
      break;
    case 'wraith':
      friendWraith(ctx, def, opts);
      break;
    case 'moon':
      friendMoon(ctx, def, opts);
      break;
    case 'meteor':
      friendMeteor(ctx, def, opts);
      break;
    case 'glitch':
      friendGlitch(ctx, def, opts);
      break;
    case 'pumpkin':
      friendPumpkin(ctx, def, opts);
      break;
    case 'ghost':
      friendGhost(ctx, def, opts);
      break;
    case 'bat':
      friendBat(ctx, def, opts);
      break;
    case 'witch':
      friendWitch(ctx, def, opts);
      break;
    case 'vampire':
      friendVampire(ctx, def, opts);
      break;
    case 'mummy':
      friendMummy(ctx, def, opts);
      break;
    default:
      drawFaller(ctx, def, { ...opts, shadow: false });
      break;
  }
  ctx.restore();
}

/* ---- js/game/hud.js ---- */
class HUD {
  constructor(game) {
    this.game = game;
  }

  render(ctx) {
    const g = this.game;
    const run = g.run;
    if (!run) return;
    const pal = g.palette;
    const t = g.time;

    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    ctx.fillStyle = 'rgba(6,10,18,0.42)';
    rr(ctx, 18, 18, 190, 118, 16);
    ctx.fill();
    ctx.strokeStyle = alpha(pal.accent, 0.22);
    ctx.lineWidth = 1;
    rr(ctx, 18, 18, 190, 118, 16);
    ctx.stroke();

    for (let i = 0; i < run.maxHearts; i++) {
      g.ui.heart(ctx, 38 + i * 26, 44, 10, i < run.hearts, g._lucky ? '#ffd166' : undefined);
    }

    g.ui.text(ctx, 'DEPTH', 34, 74, { size: 10, weight: 800, color: COLORS.muted });
    g.ui.text(ctx, `${Math.floor(run.depth)}`, 34, 104, { size: 32, weight: 900, color: '#ffffff' });
    const dw = ctx.measureText(`${Math.floor(run.depth)}`).width;
    g.ui.text(ctx, 'm', 40 + dw, 104, { size: 14, weight: 700, color: alpha(pal.accent, 0.9) });

    g.ui.text(ctx, `SCORE ${fmt(run.score)}`, 34, 126, { size: 12, weight: 700, color: COLORS.muted });

    ctx.textAlign = 'right';
    const gemX = VIEW.w - 32;
    g.ui.text(ctx, `${run.gems}`, gemX, 46, { size: 24, weight: 900, color: '#ffffff', align: 'right' });
    g.ui.gem(ctx, gemX - ctx.measureText(`${run.gems}`).width - 22, 38, 9, pal.gem, t);
    g.ui.text(ctx, `DESCENT ${g.world.cycle + 1}`, gemX, 66, {
      size: 9.5, weight: 800, color: COLORS.muted, align: 'right',
    });

    let py = 82;
    for (const key of Object.keys(POWERUPS)) {
      const timer = g.player.powerups[key];
      const active = key === 'shield' ? g.player.shield : timer > 0;
      if (!active) continue;
      const def = POWERUPS[key];
      ctx.fillStyle = 'rgba(8,12,22,0.6)';
      rr(ctx, VIEW.w - 74, py - 16, 42, 32, 10);
      ctx.fill();
      ctx.strokeStyle = alpha(def.color, 0.6);
      ctx.lineWidth = 1.4;
      rr(ctx, VIEW.w - 74, py - 16, 42, 32, 10);
      ctx.stroke();
      g.ui.icon(ctx, key, VIEW.w - 53, py, 9, def.color);
      if (key !== 'shield' && def.duration > 0) {
        ctx.strokeStyle = def.color;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(VIEW.w - 53, py, 13, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(timer / def.duration, 0, 1));
        ctx.stroke();
      }
      py += 38;
    }

    if (run.mult > 1) {
      const cx = VIEW.w / 2;
      const w = 132;
      ctx.fillStyle = 'rgba(8,12,22,0.6)';
      rr(ctx, cx - w / 2, 18, w, 46, 14);
      ctx.fill();
      ctx.strokeStyle = alpha(pal.accent, 0.5);
      ctx.lineWidth = 1.4;
      rr(ctx, cx - w / 2, 18, w, 46, 14);
      ctx.stroke();
      ctx.textAlign = 'center';
      g.ui.text(ctx, `x${run.mult}`, cx, 44, { size: 24, weight: 900, color: pal.accent2, align: 'center', glow: alpha(pal.accent2, 0.7) });
      ctx.textAlign = 'left';
      g.ui.bar(ctx, cx - w / 2 + 16, 54, w - 32, 4, clamp(run.comboTimer / 2.6, 0, 1), { color: pal.accent2 });
    }

    if (run.combo > 0) {
      g.ui.text(ctx, `${run.combo} chain`, VIEW.w / 2, 82, { size: 11, weight: 700, color: COLORS.muted, align: 'center' });
    }

    const dashReady = clamp(1 - g.player.dashCd / 0.85, 0, 1);
    ctx.fillStyle = 'rgba(6,10,18,0.4)';
    rr(ctx, 18, VIEW.h - 40, 120, 20, 10);
    ctx.fill();
    ctx.fillStyle = alpha(pal.accent, dashReady >= 1 ? 0.9 : 0.45);
    rr(ctx, 21, VIEW.h - 37, 114 * dashReady, 14, 7);
    ctx.fill();
    g.ui.text(ctx, dashReady >= 1 ? 'DASH READY' : 'DASH', 24, VIEW.h - 26, {
      size: 9, weight: 800, color: dashReady >= 1 ? '#08101c' : COLORS.muted,
    });

    // The band rises with the storm instead of snapping on, and the words wait
    // until it is genuinely closing, so the warning cannot strobe.
    const warn = g.world.stormWarning(g.player);
    if (warn > 0.01) {
      const bandH = 22 + warn * 46;
      const grad = ctx.createLinearGradient(0, 0, 0, bandH);
      grad.addColorStop(0, `rgba(40,4,30,${warn * (0.4 + warn * 0.5)})`);
      grad.addColorStop(1, 'rgba(40,4,30,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, VIEW.w, bandH);
      if (warn > 0.35) {
        const pulse = 0.7 + 0.3 * Math.sin(t * 4);
        ctx.textAlign = 'center';
        g.ui.text(ctx, warn > 0.7 ? 'THE STORM IS ON YOU' : 'THE STORM IS CLOSING IN', VIEW.w / 2, 32, {
          size: 13, weight: 900, color: `rgba(255,120,150,${pulse})`, align: 'center',
        });
        ctx.textAlign = 'left';
      }
    }

    if (g.biomeBanner && g.biomeBanner.t > 0) {
      const b = g.biomeBanner;
      const k = 1 - b.t / b.max;
      const a = b.t > b.max - 0.5 ? (b.max - b.t) / 0.5 : Math.min(1, b.t / 0.7);
      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.textAlign = 'center';
      g.ui.text(ctx, b.name.toUpperCase(), VIEW.w / 2, 168 - k * 10, { size: 30, weight: 900, color: '#ffffff', align: 'center', glow: alpha(pal.accent, 0.8) });
      g.ui.text(ctx, b.tagline, VIEW.w / 2, 194 - k * 10, { size: 13, weight: 600, color: alpha('#ffffff', 0.75), align: 'center' });
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }

    if (g.toasts.length) {
      let ty = 226;
      for (const toast of g.toasts) {
        const a = clamp(toast.t / 0.4, 0, 1);
        ctx.globalAlpha = a;
        ctx.textAlign = 'center';
        ctx.font = font(14, 800);
        const w = ctx.measureText(toast.text).width + 34;
        ctx.fillStyle = 'rgba(8,12,22,0.78)';
        rr(ctx, VIEW.w / 2 - w / 2, ty - 16, w, 30, 15);
        ctx.fill();
        ctx.strokeStyle = alpha(toast.color || pal.accent, 0.6);
        ctx.lineWidth = 1.2;
        rr(ctx, VIEW.w / 2 - w / 2, ty - 16, w, 30, 15);
        ctx.stroke();
        g.ui.text(ctx, toast.text, VIEW.w / 2, ty + 5, { size: 14, weight: 800, color: '#ffffff', align: 'center' });
        ctx.globalAlpha = 1;
        ty += 38;
      }
      ctx.textAlign = 'left';
    }

    if (g.showTouch) this.renderTouch(ctx, pal);
    ctx.restore();
  }

  renderTouch(ctx, pal) {
    const g = this.game;
    const size = g.progress.settings.pad;
    const s = padScale(size);
    const boxes = touchLayout(g.progress.settings.hand, size);
    const touch = g.input.touch;
    const pad = (b, active, radius = 26 * s) => {
      ctx.fillStyle = active ? alpha(pal.accent, 0.26) : 'rgba(255,255,255,0.07)';
      rr(ctx, b.x, b.y, b.w, b.h, radius);
      ctx.fill();
      ctx.strokeStyle = active ? alpha(pal.accent, 0.8) : 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 1.8;
      rr(ctx, b.x, b.y, b.w, b.h, radius);
      ctx.stroke();
    };

    // one thumb steers on its own pads, the other jumps and dashes
    for (const name of ['left', 'right']) {
      const b = boxes[name];
      const held = touch[name];
      pad(b, held, 24 * s);
      const dir = name === 'left' ? -1 : 1;
      const cx = b.x + b.w / 2;
      const cy = b.y + b.h / 2;
      ctx.strokeStyle = alpha('#ffffff', held ? 0.95 : 0.6);
      ctx.lineWidth = 4.5 * s;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(cx + dir * -8 * s, cy - 16 * s);
      ctx.lineTo(cx + dir * 12 * s, cy);
      ctx.lineTo(cx + dir * -8 * s, cy + 16 * s);
      ctx.stroke();
      ctx.lineCap = 'butt';
      ctx.lineJoin = 'miter';
    }

    const labelled = (b, text, size, active) => {
      pad(b, active);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      g.ui.text(ctx, text, b.x + b.w / 2, b.y + b.h / 2, {
        size, weight: 900, color: active ? '#ffffff' : 'rgba(255,255,255,0.85)', align: 'center',
      });
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';
    };
    labelled(boxes.dash, 'DASH', 13 * s, touch.dash);
    labelled(boxes.jump, 'JUMP', 18 * s, touch.jump);
  }
}

const BTN = { primary: { variant: 'primary' }, secondary: { variant: 'secondary' } };

class Screens {
  constructor(game) {
    this.game = game;
    this.deleteArm = { id: null, until: 0 };
  }

  render(ctx) {
    const g = this.game;
    switch (g.state) {
      case 'MENU':
        this.menu(ctx);
        break;
      case 'HOWTO':
        this.howTo(ctx);
        break;
      case 'HANGAR':
        this.hangar(ctx);
        break;
      case 'MISSIONS':
        this.missions(ctx);
        break;
      case 'PROFILES':
        this.profiles(ctx);
        break;
      case 'SETTINGS':
        this.settings(ctx);
        break;
      case 'PAUSED':
        this.pause(ctx);
        break;
      case 'GAMEOVER':
        this.results(ctx);
        break;
      default:
        break;
    }
  }

  // The wordmark occasionally loses its grip: the letters pop, tumble off the
  // bottom of the screen and drop back into their slots.
  titleWord(ctx, g, pal, t) {
    const reduce = !!g.progress.settings.reduce;
    if (!reduce && this._titleNext === undefined) this._titleNext = t + 6;
    if (!reduce && t >= this._titleNext) {
      this._titleAt = t;
      this._titleNext = t + 9 + Math.random() * 6;
      this._titleSeeds = [];
      for (let i = 0; i < 12; i++) {
        this._titleSeeds.push({
          vx: (Math.random() - 0.5) * 300,
          vy: -70 - Math.random() * 150,
          spin: (Math.random() - 0.5) * 10,
          lag: Math.random() * 0.14,
        });
      }
    }
    ctx.save();
    ctx.translate(88, 0);
    ctx.textAlign = 'left';
    ctx.font = font(52, 900);
    const word = 'DOWN';
    for (let row = 0; row < 3; row++) {
      const baseY = 128 + row * 50 + Math.sin(t * 1.3 + row * 0.7) * 3;
      const sway = Math.sin(t * 0.9 + row) * 5;
      let x = 0;
      for (let i = 0; i < word.length; i++) {
        const ch = word[i];
        const w = ctx.measureText(ch).width;
        const o = this.titleOffset(row, i, t);
        const grad = ctx.createLinearGradient(0, -38, 0, 8);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(1, pal.accent);
        ctx.save();
        ctx.globalAlpha = o.alpha;
        ctx.translate(sway + x + o.dx, baseY + o.dy);
        ctx.rotate(o.rot);
        ctx.fillStyle = grad;
        ctx.shadowColor = alpha(pal.accent, 0.55);
        ctx.shadowBlur = 26;
        ctx.fillText(ch, 0, 0);
        ctx.restore();
        x += w;
      }
    }
    ctx.restore();
  }

  // Pure function of time so the fall is testable and never drifts.
  titleOffset(row, i, t) {
    const seed = this._titleSeeds && this._titleSeeds[row * 4 + i];
    if (!seed || this._titleAt === undefined) return { dx: 0, dy: 0, rot: 0, alpha: 1 };
    const FALL = 1.35;
    const BACK = 0.9;
    const k = t - this._titleAt - seed.lag;
    if (k <= 0) return { dx: 0, dy: 0, rot: 0, alpha: 1 };
    if (k < FALL) {
      return {
        dx: seed.vx * k,
        dy: seed.vy * k + 600 * k * k,
        rot: seed.spin * k,
        alpha: 1 - Math.pow(k / FALL, 3),
      };
    }
    if (k < FALL + BACK) {
      const r = (k - FALL) / BACK;
      const e = 1 - Math.pow(1 - r, 3);
      return {
        dx: 0,
        dy: -(1 - e) * 620,
        rot: seed.spin * 0.35 * (1 - e),
        alpha: Math.min(1, r * 3),
      };
    }
    return { dx: 0, dy: 0, rot: 0, alpha: 1 };
  }

  _scrim(ctx, strength = 0.72) {
    const grad = ctx.createLinearGradient(0, 0, VIEW.w, 0);
    grad.addColorStop(0, `rgba(4,7,14,${strength})`);
    grad.addColorStop(0.62, `rgba(4,7,14,${strength * 0.75})`);
    grad.addColorStop(1, `rgba(4,7,14,${strength * 0.25})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, VIEW.w, VIEW.h);
  }

  _wrapText(ctx, text, x, y, maxW, lineH, opts = {}) {
    const { size = 11, weight = 500, color = 'rgba(238,244,255,0.75)' } = opts;
    ctx.font = font(size, weight);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = color;
    const words = String(text).split(' ');
    let line = '';
    let yy = y;
    for (const word of words) {
      const test = line ? `${line} ${word}` : word;
      if (line && ctx.measureText(test).width > maxW) {
        ctx.fillText(line, x, yy);
        line = word;
        yy += lineH;
      } else {
        line = test;
      }
    }
    if (line) {
      ctx.fillText(line, x, yy);
      yy += lineH;
    }
    return yy;
  }
