    const { radius = 18, fill = 'rgba(12,18,30,0.9)', stroke = COLORS.stroke, shadow = true } = opts;
    if (shadow) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = 40;
      ctx.shadowOffsetY = 14;
      ctx.fillStyle = fill;
      rr(ctx, x, y, w, h, radius);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = fill;
      rr(ctx, x, y, w, h, radius);
      ctx.fill();
    }
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.2;
    rr(ctx, x, y, w, h, radius);
    ctx.stroke();
  }

  text(ctx, str, x, y, opts = {}) {
    const { size = 16, weight = 600, color = COLORS.text, align = 'left', baseline = 'alphabetic', glow = null } = opts;
    ctx.font = font(size, weight);
    ctx.textAlign = align;
    ctx.textBaseline = baseline;
    if (glow) {
      ctx.shadowColor = glow;
      ctx.shadowBlur = 16;
    }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
    if (glow) ctx.shadowBlur = 0;
  }

  bar(ctx, x, y, w, h, value, opts = {}) {
    const color = opts.color || this.accent;
    ctx.fillStyle = opts.bg || 'rgba(255,255,255,0.12)';
    rr(ctx, x, y, w, h, h / 2);
    ctx.fill();
    const v = clamp(value, 0, 1);
    if (v > 0) {
      ctx.fillStyle = color;
      rr(ctx, x, y, Math.max(h, w * v), h, h / 2);
      ctx.fill();
    }
  }

  slider(ctx, x, y, w, value, id) {
    const { input } = this.game;
    const p = input.pointer;
    const over = p.x > x - 12 && p.x < x + w + 12 && p.y > y - 18 && p.y < y + 18;
    if (over && p.clicked) {
      this.dragging = id;
      p.clicked = false;
    }
    if (!p.down && this.dragging === id) this.dragging = null;
    let out = null;
    if (this.dragging === id) {
      out = clamp((p.x - x) / w, 0, 1);
      value = out;
      p.clicked = false;
    }
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    rr(ctx, x, y - 3, w, 6, 3);
    ctx.fill();
    ctx.fillStyle = this.accent;
    rr(ctx, x, y - 3, Math.max(6, w * value), 6, 3);
    ctx.fill();
    const kx = x + w * value;
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = alpha(this.accent, 0.8);
    ctx.shadowBlur = over || this.dragging === id ? 16 : 8;
    ctx.beginPath();
    ctx.arc(kx, y, over || this.dragging === id ? 9 : 7.5, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
    return out;
  }

  toggle(ctx, x, y, value, id) {
    const { input } = this.game;
    const p = input.pointer;
    const w = 52;
    const h = 26;
    const over = p.x > x - 6 && p.x < x + w + 6 && p.y > y - 10 && p.y < y + h + 10;
    let out = null;
    if (over && p.clicked) {
      p.clicked = false;
      out = !value;
      this.game.audio.sfx('ui');
    }
    ctx.fillStyle = value ? alpha(this.accent, 0.85) : 'rgba(255,255,255,0.16)';
    rr(ctx, x, y, w, h, h / 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x + (value ? w - h / 2 : h / 2), y + h / 2, h / 2 - 4, 0, TAU);
    ctx.fill();
    return out;
  }

  heart(ctx, x, y, s, filled, color = '#ff6b8b') {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, s * 0.75);
    ctx.bezierCurveTo(-s * 1.2, -s * 0.1, -s * 0.45, -s * 0.95, 0, -s * 0.3);
    ctx.bezierCurveTo(s * 0.45, -s * 0.95, s * 1.2, -s * 0.1, 0, s * 0.75);
    if (filled) {
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.fill();
    } else {
      ctx.strokeStyle = alpha(color, 0.35);
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  gem(ctx, x, y, r, color, t = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(t * 1.5) * 0.16);
    const w = r * 0.78;
    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.4, color);
    g.addColorStop(1, alpha(color, 0.6));
    ctx.fillStyle = g;
    ctx.shadowColor = color;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.lineTo(w, 0);
    ctx.lineTo(0, r);
    ctx.lineTo(-w, 0);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = alpha('#ffffff', 0.55);
    ctx.lineWidth = Math.max(0.8, r * 0.09);
    ctx.beginPath();
    ctx.moveTo(-w, 0);
    ctx.lineTo(0, -r);
    ctx.lineTo(w, 0);
    ctx.lineTo(0, r);
    ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = alpha('#ffffff', 0.7);
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.72);
    ctx.lineTo(w * 0.36, 0);
    ctx.lineTo(0, r * 0.18);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  icon(ctx, kind, x, y, s, color = '#101322') {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.6, s * 0.18);
    if (kind === 'shield') {
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(s * 0.8, -s * 0.55);
      ctx.quadraticCurveTo(s * 0.8, s * 0.6, 0, s);
      ctx.quadraticCurveTo(-s * 0.8, s * 0.6, -s * 0.8, -s * 0.55);
      ctx.closePath();
      ctx.fill();
    } else if (kind === 'magnet') {
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.7, Math.PI, 0);
      ctx.lineWidth = s * 0.4;
      ctx.stroke();
      ctx.fillRect(-s * 0.9, 0, s * 0.4, s * 0.6);
      ctx.fillRect(s * 0.5, 0, s * 0.4, s * 0.6);
    } else if (kind === 'clock') {
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.8, 0, TAU);
      ctx.lineWidth = s * 0.22;
      ctx.stroke();
      ctx.lineWidth = s * 0.16;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -s * 0.45);
      ctx.moveTo(0, 0);
      ctx.lineTo(s * 0.35, s * 0.2);
      ctx.stroke();
    } else if (kind === 'feather') {
      ctx.beginPath();
      ctx.moveTo(-s * 0.85, s * 0.2);
      ctx.quadraticCurveTo(0, -s * 1.05, s * 0.85, s * 0.2);
      ctx.quadraticCurveTo(0, s * 0.5, -s * 0.85, s * 0.2);
      ctx.fill();
    } else if (kind === 'gem') {
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(s * 0.75, 0);
      ctx.lineTo(0, s);
      ctx.lineTo(-s * 0.75, 0);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  character(ctx, def, x, y, scale = 1, t = 0, facing = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale * facing, scale);
    drawFaller(ctx, def, { bob: Math.sin(t * 2.4) * 2, t, facing: 1, shadow: true });
    ctx.restore();
  }

  sparkle(ctx, x, y, r, color, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t * 0.6);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.7;
    const s = r * (0.75 + Math.sin(t * 4) * 0.25);
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(s * 0.46, 0);
    ctx.lineTo(0, s);
    ctx.lineTo(-s * 0.46, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  bannerText(ctx, str, size = 44) {
    ctx.save();
    ctx.font = font(size, 900);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(1, this.accent);
    ctx.fillStyle = g;
    ctx.fillText(str, 0, 0);
    ctx.restore();
  }

  shakeForButton(t) {
    return easeOutCubic(t) * 20;
  }
}

function drawHat(ctx, def, top, bob = 0) {
  const accent = def.accent || '#ffd166';
  ctx.fillStyle = accent;
  ctx.strokeStyle = 'rgba(8,11,20,0.35)';
  ctx.lineWidth = 1;
  switch (def.hat) {
    case 'spike':
      ctx.beginPath();
      ctx.moveTo(-6, top + 2 + bob);
      ctx.quadraticCurveTo(-1, top - 12 + bob, 6, top - 13 + bob);
      ctx.quadraticCurveTo(3, top - 3 + bob, 6, top + 2 + bob);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      break;
    case 'horns':
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * 7, top + 2 + bob);
        ctx.quadraticCurveTo(s * 10, top - 7 + bob, s * 15, top - 9 + bob);
        ctx.quadraticCurveTo(s * 12, top - 1 + bob, s * 10, top + 2 + bob);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      break;
    case 'antenna':
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, top + 2 + bob);
      ctx.quadraticCurveTo(3, top - 8 + bob, 9, top - 12 + bob);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(9, top - 12 + bob, 3.4, 0, TAU);
      ctx.fill();
      break;
    case 'crown':
      ctx.beginPath();
      ctx.moveTo(-9, top + 2 + bob);
      ctx.lineTo(-9, top - 6 + bob);
      ctx.lineTo(-4.5, top - 1.5 + bob);
      ctx.lineTo(0, top - 9 + bob);
      ctx.lineTo(4.5, top - 1.5 + bob);
      ctx.lineTo(9, top - 6 + bob);
      ctx.lineTo(9, top + 2 + bob);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = alpha('#ffffff', 0.85);
      ctx.beginPath();
      ctx.arc(-4.5, top - 1 + bob, 1.2, 0, TAU);
      ctx.arc(0, top - 4.5 + bob, 1.4, 0, TAU);
      ctx.arc(4.5, top - 1 + bob, 1.2, 0, TAU);
      ctx.fill();
      break;
    case 'hood':
      ctx.beginPath();
      ctx.arc(0, top + 5 + bob, 13, Math.PI * 1.02, Math.PI * 1.98);
      ctx.quadraticCurveTo(15, top + 10 + bob, 0, top + 7 + bob);
      ctx.quadraticCurveTo(-15, top + 10 + bob, -13, top + 5 + bob);
      ctx.fill();
      ctx.strokeStyle = alpha('#ffffff', 0.25);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(0, top + 5 + bob, 11.6, Math.PI * 1.08, Math.PI * 1.92);
      ctx.stroke();
      break;
    default:
      ctx.beginPath();
      ctx.moveTo(-5, top + 2 + bob);
      ctx.quadraticCurveTo(-3, top - 7 + bob, 1, top - 4 + bob);
      ctx.quadraticCurveTo(3, top - 9 + bob, 6, top - 1 + bob);
      ctx.quadraticCurveTo(4, top + 2 + bob, -5, top + 2 + bob);
      ctx.closePath();
      ctx.fill();
      break;
  }
}

function drawFaller(ctx, def, opts = {}) {
  const { bob = 0, legSwing = 0, facing = 1, blink = false, shadow = false, t = 0 } = opts;
  const body = def.color || '#ff7a6b';
  const accent = def.accent || '#ffd166';
  const ink = 'rgba(7,11,20,0.5)';

  ctx.save();
  if (shadow) {
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(0, 26, 17, 4.6, 0, 0, TAU);
    ctx.fill();
  }

  ctx.fillStyle = '#2a3149';
  rr(ctx, -8.2, 8 + bob + legSwing * 0.3, 7.6, 11.5, 3.4);
  ctx.fill();
  rr(ctx, 0.8, 8 + bob - legSwing * 0.3, 7.6, 11.5, 3.4);
  ctx.fill();
  ctx.fillStyle = '#171d2e';
  rr(ctx, -9.2, 16.6 + bob + legSwing * 0.3, 9.4, 4.2, 2.1);
  ctx.fill();
  rr(ctx, 0, 16.6 + bob - legSwing * 0.3, 9.4, 4.2, 2.1);
  ctx.fill();

  const dir = facing >= 0 ? -1 : 1;
  const wave = Math.sin(t * 5) * 2.4;
  ctx.fillStyle = alpha(accent, 0.92);
  ctx.beginPath();
  ctx.moveTo(dir * 7, -8 + bob);
  ctx.quadraticCurveTo(dir * 21, -12 + bob + wave, dir * 29, -3 + bob + wave * 1.4);
  ctx.quadraticCurveTo(dir * 20, 1 + bob + wave, dir * 6, -2 + bob);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = alpha(body, 0.92);
  rr(ctx, -14.2, -4 + bob, 4.6, 11, 2.3);
  ctx.fill();
  rr(ctx, 9.6, -4 + bob, 4.6, 11, 2.3);
  ctx.fill();
  ctx.fillStyle = accent;
  ctx.beginPath();
  ctx.arc(-12, 7.4 + bob, 2.2, 0, TAU);
  ctx.arc(12, 7.4 + bob, 2.2, 0, TAU);
  ctx.fill();

  const g = ctx.createLinearGradient(-12, -10, 12, 14);
  g.addColorStop(0, shade(body, 0.18));
  g.addColorStop(0.55, body);
  g.addColorStop(1, alpha(body, 0.78));
  ctx.fillStyle = g;
  rr(ctx, -11, -9 + bob, 22, 21, 8);
  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.5;
  rr(ctx, -11, -9 + bob, 22, 21, 8);
  ctx.stroke();
  ctx.fillStyle = alpha('#ffffff', 0.16);
  ctx.beginPath();
  ctx.ellipse(0, 3 + bob, 6.8, 5.6, 0, 0, TAU);
  ctx.fill();

  ctx.fillStyle = accent;
  rr(ctx, -10.2, -11.5 + bob, 20.4, 4.6, 2.3);
  ctx.fill();

  ctx.fillStyle = shade(body, 0.06);
  ctx.beginPath();
  ctx.arc(0, -17 + bob, 11.6, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, -17 + bob, 11.6, 0, TAU);
  ctx.stroke();
  ctx.fillStyle = '#f6efe6';
  ctx.beginPath();
  ctx.ellipse(0, -15.4 + bob, 7.9, 6.9, 0, 0, TAU);
  ctx.fill();

  ctx.fillStyle = alpha(accent, 0.4);
  ctx.beginPath();
  ctx.arc(-6.2, -11.4 + bob, 1.9, 0, TAU);
  ctx.arc(6.2, -11.4 + bob, 1.9, 0, TAU);
  ctx.fill();

  const eyeY = -17 + bob;
  const look = facing * 1.1;
  if (blink) {
    ctx.fillStyle = '#202636';
    rr(ctx, -5.4, eyeY - 0.9, 4.2, 1.8, 0.9);
    ctx.fill();
    rr(ctx, 1.2, eyeY - 0.9, 4.2, 1.8, 0.9);
    ctx.fill();
  } else {
    ctx.fillStyle = '#202636';
    ctx.beginPath();
    ctx.arc(-3.3 + look, eyeY, 2.25, 0, TAU);
    ctx.arc(3.3 + look, eyeY, 2.25, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-4 + look, eyeY - 1, 0.85, 0, TAU);
    ctx.arc(2.6 + look, eyeY - 1, 0.85, 0, TAU);
    ctx.fill();
  }

  ctx.strokeStyle = '#202636';
  ctx.lineWidth = 1.3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(look * 0.4, eyeY + 3.6, 2.3, 0.25, Math.PI - 0.25);
  ctx.stroke();

  drawHat(ctx, def, -28, bob);
  ctx.restore();
}

/* ---- js/game/hud.js ---- */
class HUD {
  constructor(game) {
    this.game = game;
  }

  render(ctx) {
    const g = this.game;
    const run = g.run;
    if (!run) return;
    const pal = g.palette;
    const t = g.time;

    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    ctx.fillStyle = 'rgba(6,10,18,0.42)';
    rr(ctx, 18, 18, 190, 118, 16);
    ctx.fill();
    ctx.strokeStyle = alpha(pal.accent, 0.22);
    ctx.lineWidth = 1;
    rr(ctx, 18, 18, 190, 118, 16);
    ctx.stroke();

    for (let i = 0; i < run.maxHearts; i++) {
      g.ui.heart(ctx, 38 + i * 26, 44, 10, i < run.hearts, g._lucky ? '#ffd166' : undefined);
    }

    g.ui.text(ctx, 'DEPTH', 34, 74, { size: 10, weight: 800, color: COLORS.muted });
    g.ui.text(ctx, `${Math.floor(run.depth)}`, 34, 104, { size: 32, weight: 900, color: '#ffffff' });
    const dw = ctx.measureText(`${Math.floor(run.depth)}`).width;
    g.ui.text(ctx, 'm', 40 + dw, 104, { size: 14, weight: 700, color: alpha(pal.accent, 0.9) });

    g.ui.text(ctx, `SCORE ${fmt(run.score)}`, 34, 126, { size: 12, weight: 700, color: COLORS.muted });

    ctx.textAlign = 'right';
    const gemX = VIEW.w - 32;
    g.ui.text(ctx, `${run.gems}`, gemX, 46, { size: 24, weight: 900, color: '#ffffff', align: 'right' });
    g.ui.gem(ctx, gemX - ctx.measureText(`${run.gems}`).width - 22, 38, 9, pal.gem, t);
    g.ui.text(ctx, `DESCENT ${g.world.cycle + 1}`, gemX, 66, {
      size: 9.5, weight: 800, color: COLORS.muted, align: 'right',
    });

    let py = 82;
    for (const key of Object.keys(POWERUPS)) {
      const timer = g.player.powerups[key];
      const active = key === 'shield' ? g.player.shield : timer > 0;
      if (!active) continue;
      const def = POWERUPS[key];
      ctx.fillStyle = 'rgba(8,12,22,0.6)';
      rr(ctx, VIEW.w - 74, py - 16, 42, 32, 10);
      ctx.fill();
      ctx.strokeStyle = alpha(def.color, 0.6);
      ctx.lineWidth = 1.4;
      rr(ctx, VIEW.w - 74, py - 16, 42, 32, 10);
      ctx.stroke();
      g.ui.icon(ctx, key, VIEW.w - 53, py, 9, def.color);
      if (key !== 'shield' && def.duration > 0) {
        ctx.strokeStyle = def.color;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(VIEW.w - 53, py, 13, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(timer / def.duration, 0, 1));
        ctx.stroke();
      }
      py += 38;
    }

    if (run.mult > 1) {
      const cx = VIEW.w / 2;
      const w = 132;
      ctx.fillStyle = 'rgba(8,12,22,0.6)';
      rr(ctx, cx - w / 2, 18, w, 46, 14);
      ctx.fill();
      ctx.strokeStyle = alpha(pal.accent, 0.5);
      ctx.lineWidth = 1.4;
      rr(ctx, cx - w / 2, 18, w, 46, 14);
      ctx.stroke();
      ctx.textAlign = 'center';
      g.ui.text(ctx, `x${run.mult}`, cx, 44, { size: 24, weight: 900, color: pal.accent2, align: 'center', glow: alpha(pal.accent2, 0.7) });
      ctx.textAlign = 'left';
      g.ui.bar(ctx, cx - w / 2 + 16, 54, w - 32, 4, clamp(run.comboTimer / 2.6, 0, 1), { color: pal.accent2 });
    }

    if (run.combo > 0) {
      g.ui.text(ctx, `${run.combo} chain`, VIEW.w / 2, 82, { size: 11, weight: 700, color: COLORS.muted, align: 'center' });
    }

    const dashReady = clamp(1 - g.player.dashCd / 0.85, 0, 1);
    ctx.fillStyle = 'rgba(6,10,18,0.4)';
    rr(ctx, 18, VIEW.h - 40, 120, 20, 10);
    ctx.fill();
    ctx.fillStyle = alpha(pal.accent, dashReady >= 1 ? 0.9 : 0.45);
    rr(ctx, 21, VIEW.h - 37, 114 * dashReady, 14, 7);
    ctx.fill();
    g.ui.text(ctx, dashReady >= 1 ? 'DASH READY' : 'DASH', 24, VIEW.h - 26, {
      size: 9, weight: 800, color: dashReady >= 1 ? '#08101c' : COLORS.muted,
    });

    const warn = g.world.stormWarning(g.player);
    if (warn > 0.02) {
      const bandH = 26 + warn * 46;
      const grad = ctx.createLinearGradient(0, 0, 0, bandH);
      grad.addColorStop(0, `rgba(40,4,30,${0.35 + warn * 0.5})`);
      grad.addColorStop(1, 'rgba(40,4,30,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, VIEW.w, bandH);
      ctx.textAlign = 'center';
      const pulse = 0.6 + 0.4 * Math.sin(t * 9);
      g.ui.text(ctx, warn > 0.65 ? 'THE STORM IS ON YOU' : 'THE STORM IS CLOSING IN', VIEW.w / 2, 32, {
        size: 13, weight: 900, color: `rgba(255,120,150,${pulse})`, align: 'center',
      });
      ctx.textAlign = 'left';
    }

    if (g.biomeBanner && g.biomeBanner.t > 0) {
      const b = g.biomeBanner;
      const k = 1 - b.t / b.max;
      const a = b.t > b.max - 0.5 ? (b.max - b.t) / 0.5 : Math.min(1, b.t / 0.7);
      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.textAlign = 'center';
      g.ui.text(ctx, b.name.toUpperCase(), VIEW.w / 2, 168 - k * 10, { size: 30, weight: 900, color: '#ffffff', align: 'center', glow: alpha(pal.accent, 0.8) });
      g.ui.text(ctx, b.tagline, VIEW.w / 2, 194 - k * 10, { size: 13, weight: 600, color: alpha('#ffffff', 0.75), align: 'center' });
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }

    if (g.toasts.length) {
      let ty = 226;
      for (const toast of g.toasts) {
        const a = clamp(toast.t / 0.4, 0, 1);
        ctx.globalAlpha = a;
        ctx.textAlign = 'center';
        ctx.font = font(14, 800);
        const w = ctx.measureText(toast.text).width + 34;
        ctx.fillStyle = 'rgba(8,12,22,0.78)';
        rr(ctx, VIEW.w / 2 - w / 2, ty - 16, w, 30, 15);
        ctx.fill();
        ctx.strokeStyle = alpha(toast.color || pal.accent, 0.6);
        ctx.lineWidth = 1.2;
        rr(ctx, VIEW.w / 2 - w / 2, ty - 16, w, 30, 15);
        ctx.stroke();
        g.ui.text(ctx, toast.text, VIEW.w / 2, ty + 5, { size: 14, weight: 800, color: '#ffffff', align: 'center' });
        ctx.globalAlpha = 1;
        ty += 38;
      }
      ctx.textAlign = 'left';
    }

    if (g.input.touchMode) this.renderTouch(ctx, pal);
    ctx.restore();
  }

  renderTouch(ctx, pal) {
    const g = this.game;
    const drawPad = (b, label, active) => {
      ctx.fillStyle = active ? alpha(pal.accent, 0.3) : 'rgba(255,255,255,0.08)';
      rr(ctx, b.x, b.y, b.w, b.h, 22);
      ctx.fill();
      ctx.strokeStyle = active ? alpha(pal.accent, 0.75) : 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1.6;
      rr(ctx, b.x, b.y, b.w, b.h, 22);
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      g.ui.text(ctx, label, b.x + b.w / 2, b.y + b.h / 2, {
        size: label.length > 2 ? 13 : 26, weight: 900, color: 'rgba(255,255,255,0.85)', align: 'center',
      });
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';
    };
    drawPad(TOUCH.left, '◀', g.input.touch.left);
    drawPad(TOUCH.right, '▶', g.input.touch.right);
    drawPad(TOUCH.jump, 'JUMP', g.input.touch.jump);
    drawPad(TOUCH.dash, 'DASH', g.input.touch.dash);
  }
}

/* ---- js/game/screens.js ---- */
const BTN = { primary: { variant: 'primary' }, secondary: { variant: 'secondary' } };

class Screens {
  constructor(game) {
    this.game = game;
    this.deleteArm = { id: null, until: 0 };
  }

  render(ctx) {
    const g = this.game;
    switch (g.state) {
      case 'MENU':
        this.menu(ctx);
        break;
      case 'HOWTO':
        this.howTo(ctx);
        break;
      case 'HANGAR':
        this.hangar(ctx);
        break;
      case 'PROFILES':
        this.profiles(ctx);
        break;
      case 'SETTINGS':
        this.settings(ctx);
        break;
      case 'PAUSED':
        this.pause(ctx);
        break;
      case 'GAMEOVER':
        this.results(ctx);
        break;
      default:
        break;
    }
  }

  _scrim(ctx, strength = 0.72) {
    const grad = ctx.createLinearGradient(0, 0, VIEW.w, 0);
    grad.addColorStop(0, `rgba(4,7,14,${strength})`);
    grad.addColorStop(0.62, `rgba(4,7,14,${strength * 0.75})`);
    grad.addColorStop(1, `rgba(4,7,14,${strength * 0.25})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, VIEW.w, VIEW.h);
  }

  menu(ctx) {
    const g = this.game;
    const ui = g.ui;
    const pal = g.palette;
    const t = g.time;
    this._scrim(ctx, 0.7);

    ctx.save();
    ctx.translate(88, 0);
    ctx.textAlign = 'left';
    for (let i = 0; i < 3; i++) {
      const y = 128 + i * 50 + Math.sin(t * 1.3 + i * 0.7) * 3;
      ctx.save();
      ctx.translate(Math.sin(t * 0.9 + i) * 5, y);
      ctx.font = font(52, 900);
      const grad = ctx.createLinearGradient(0, -38, 0, 8);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(1, pal.accent);
      ctx.fillStyle = grad;
      ctx.shadowColor = alpha(pal.accent, 0.55);
      ctx.shadowBlur = 26;
      ctx.fillText('DOWN', 0, 0);
      ctx.restore();
    }
    ctx.restore();

    ui.text(ctx, 'an endless descent', 88, 268, { size: 15, weight: 600, color: COLORS.muted });

    if (ui.button(ctx, 88, 292, 300, 62, 'PLAY', { ...BTN.primary, size: 24, sub: 'Enter / Space', id: 'play' })) {
      g.startRun();
    }
    if (ui.button(ctx, 88, 364, 300, 40, 'HOW TO PLAY', { size: 14, id: 'howto' })) g.setState('HOWTO');
    if (ui.button(ctx, 88, 412, 300, 40, 'HANGAR', { size: 14, id: 'hangar' })) g.setState('HANGAR');
    if (ui.button(ctx, 88, 460, 300, 40, 'PROFILES', { size: 14, id: 'profiles' })) g.setState('PROFILES');
    if (ui.button(ctx, 88, 508, 300, 40, 'SETTINGS', { size: 14, id: 'settings' })) g.setState('SETTINGS');

    const best = g.progress.data.best;
    ctx.textAlign = 'left';
    ui.text(ctx, `BEST ${best}m`, 88, 566, { size: 13, weight: 800, color: 'rgba(255,255,255,0.85)' });
    ui.gem(ctx, 208, 561, 8, pal.gem, t);
    ui.text(ctx, `${fmt(g.progress.data.shards)}`, 224, 566, { size: 13, weight: 800, color: 'rgba(255,255,255,0.85)' });

    ui.text(ctx, 'Press M to mute · Click PLAY or press Enter to start', 88, 590, { size: 11, weight: 600, color: 'rgba(255,255,255,0.35)' });

    if (ui.button(ctx, 700, 22, 232, 34, `PROFILE · ${g.profiles.active.name}`, { size: 11, id: 'profile-chip' })) {
      g.setState('PROFILES');
    }

    const s = g.progress.settings;
    const musicOn = s.music > 0;
    const sfxOn = s.sfx > 0;
    ui.panel(ctx, 700, 64, 232, 84, { radius: 12, fill: 'rgba(8,13,24,0.72)', shadow: false });
    ui.text(ctx, 'AUDIO', 716, 82, { size: 8.5, weight: 800, color: COLORS.muted });
    ui.text(ctx, 'MUSIC', 716, 105, { size: 9, weight: 700, color: 'rgba(238,244,255,0.62)' });
    const musicOnHit = this._radio(ctx, 806, 102, 'ON', musicOn);
    const musicOffHit = this._radio(ctx, 866, 102, 'OFF', !musicOn);
    if (musicOnHit && !musicOn) {
      s.music = 0.45;
      g.audio.setMusic(s.music);
      g.progress.save();
    } else if (musicOffHit && musicOn) {
      s.music = 0;
      g.audio.setMusic(0);
      g.progress.save();
    }
    ui.text(ctx, 'SFX', 716, 127, { size: 9, weight: 700, color: 'rgba(238,244,255,0.62)' });
    const sfxOnHit = this._radio(ctx, 806, 124, 'ON', sfxOn);
    const sfxOffHit = this._radio(ctx, 866, 124, 'OFF', !sfxOn);
    if (sfxOnHit && !sfxOn) {
      s.sfx = 0.7;
      g.audio.setSfx(s.sfx);
      g.audio.sfx('ui');
      g.progress.save();
    } else if (sfxOffHit && sfxOn) {
      s.sfx = 0;
      g.audio.setSfx(0);
      g.progress.save();
    }

    const px = 724;
    const platY = 404 + Math.sin(t * 1.1) * 4;
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = alpha(pal.platformBody, 0.9);
    rr(ctx, px - 128, platY, 256, 16, 8);
    ctx.fill();
    ctx.fillStyle = alpha(pal.platformTop, 0.85);
    rr(ctx, px - 124, platY + 1, 248, 4, 2);
    ctx.fill();
    ctx.restore();
    ui.character(ctx, g.progress.char, px, platY - 22, 2.9, t);

    for (let i = 0; i < 5; i++) {
      const gx = px - 210 + i * 96;
      const gy = 250 + Math.sin(t * 1.6 + i * 1.3) * 16;
      ctx.globalAlpha = 0.75;
      ui.gem(ctx, gx, gy, 7, pal.gem, t + i);
      ctx.globalAlpha = 1;
    }

    const missions = g.progress.data.missions.filter((m) => !m.done).slice(0, 3);
    ui.panel(ctx, 560, 452, 372, 116, { radius: 14, fill: 'rgba(8,13,24,0.72)' });
    if (missions.length) {
      ui.text(ctx, 'MISSIONS', 580, 476, { size: 10, weight: 800, color: COLORS.muted });
      let my = 496;
      for (const m of missions) {
        ui.text(ctx, m.text, 580, my, { size: 11.5, weight: 600, color: 'rgba(238,244,255,0.8)' });
        ui.bar(ctx, 892, my - 7, 26, 4, clamp(m.prog / m.goal, 0, 1), { color: pal.accent });
        my += 24;
      }
    } else {
      ui.text(ctx, 'All missions complete!', 580, 502, { size: 12, weight: 700, color: pal.accent });
      ui.text(ctx, 'New ones unlock as you fall.', 580, 522, { size: 11, weight: 600, color: COLORS.muted });

  }

  howTo(ctx) {

    const ui = g.ui;
    const pal = g.palette;
    ctx.fillStyle = 'rgba(4,7,14,0.85)';
    ctx.fillRect(0, 0, VIEW.w, VIEW.h);
    ui.panel(ctx, 56, 36, 848, 540, { radius: 22 });
    ui.text(ctx, 'HOW TO PLAY', 92, 88, { size: 26, weight: 900 });

      size: 10.5, weight: 500, color: COLORS.muted,
    });

    const rows = [
      ['A / D', 'Move left and right.'],

      ['SHIFT', 'Dash forward, even while falling.'],
      ['S / ↓', 'Tap to drop through a cloud ledge. Do not hold.'],
      ['M', 'Mute or unmute the music.'],
      ['ESC', 'Pause the run.'],
    ];
    let y = 146;
    for (const [key, desc] of rows) {

      ctx.fill();

      ctx.lineWidth = 1;
      rr(ctx, 92, y - 16, 70, 24, 7);

      ui.text(ctx, key, 127, y, { size: 10.5, weight: 800, color: '#ffffff', align: 'center' });

    ui.text(ctx, 'GOOD TO KNOW', 92, 322, { size: 10, weight: 800, color: alpha(pal.accent, 0.9) });
    const tips = [

    let ty = 342;

    ui.text(ctx, 'THE STORY OF THE DOWNWARD KIDS', 480, 146, { size: 14, weight: 900, color: pal.accent });
    const story = [
      ['A VERY SMALL HERO',
        "The sky used to be one big playground, until the clouds piled up so high they started to grumble. The Maker needed somebody small, brave and bouncy to slip down through the world and let the fresh air in. So Pip was doodled first: a round little faller with a flappy scarf, two sturdy boots and a heart full of let's go."],
      [null,
        "Pip's wings are the secret. Hold jump and they open with a fwump, turning a scary drop into a gentle float. The other kids got their own tricks too: Bolt zooms, Nix hops twice, Wisp glides, Nova sparkles and Umbra tiptoes through the dark."],
      ['WHY DOWN?',

    ];
    let sy = 170;
    for (const [head, body] of story) {

    if (ui.button(ctx, 92, 512, 180, 40, 'BACK', { size: 14, id: 'back-howto' })) g.setState('MENU');
  }

  _wrapText(ctx, text, x, y, maxW, lineH, opts = {}) {
    const { size = 11, weight = 500, color = 'rgba(238,244,255,0.75)' } = opts;
    ctx.font = font(size, weight);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = color;
    const words = String(text).split(' ');
    let line = '';
    let yy = y;
    for (const word of words) {
      const test = line ? `${line} ${word}` : word;
      if (line && ctx.measureText(test).width > maxW) {
        ctx.fillText(line, x, yy);
        line = word;
        yy += lineH;
      } else {
        line = test;

    if (line) {
      ctx.fillText(line, x, yy);
      yy += lineH;
    }
    return yy;

      ui.bar(ctx, barX, y + 69, barW, 4, (c.stats.jump - 460) / 100, { color: alpha(pal.accent2, 0.9) });

      ui.text(ctx, c.desc, x + 88, y + 100, { size: 8.8, weight: 500, color: 'rgba(238,244,255,0.6)' });

      const label = equipped ? 'EQUIPPED' : owned ? 'EQUIP' : `${c.cost} SHARDS`;

        variant: equipped ? 'ghost' : 'secondary',

        size: 9.5, weight: 700, color: equipped ? pal.accent : owned ? COLORS.muted : afford ? '#ffffff' : COLORS.bad,
      });
      if (this._over(x, y, 158, 56) && g.input.pointer.clicked) {

        if (owned) {
          g.progress.equipTrail(tr.id);

          g.toast(`${tr.name} trail unlocked`, tr.color);
        } else {
          g.audio.sfx('deny');
        }
      }
    }

    if (ui.button(ctx, 60, 534, 150, 38, 'BACK', { size: 13, id: 'back-hangar' })) g.setState('MENU');
    ui.text(ctx, 'Every run pays shards for depth, gems, score and clean landings.', 232, 557, {
      size: 10.5, weight: 500, color: 'rgba(238,244,255,0.45)',
    });
  }

  profiles(ctx) {
    const g = this.game;
    const ui = g.ui;
    const pal = g.palette;
    const store = g.profiles;
    const locked = !!g.profileEditor;
    ctx.fillStyle = 'rgba(4,7,14,0.88)';
    ctx.fillRect(0, 0, VIEW.w, VIEW.h);

    ui.text(ctx, 'PROFILES', 60, 84, { size: 28, weight: 900 });
    ui.text(ctx, 'Each profile keeps its own shards, bests and gear. Saved in this browser.', 60, 106, {
      size: 12, weight: 500, color: COLORS.muted,
    });
    ui.text(ctx, `${store.list.length} / ${MAX_PROFILES}`, 900, 84, { size: 11, weight: 800, color: COLORS.muted, align: 'right' });

    if (!locked && ui.button(ctx, 800, 96, 100, 30, 'BACK', { size: 11, id: 'back-profiles' })) g.setState('MENU');

    const cardW = 404;
    const cardH = 86;
    for (let i = 0; i < store.list.length; i++) {
      const p = store.list[i];
      const x = 60 + (i % 2) * 420;
      const y = 128 + Math.floor(i / 2) * 96;
      const active = p.id === store.activeId;
      const over = !locked && this._over(x, y, cardW, cardH);
      ctx.fillStyle = active ? alpha(pal.accent, 0.16) : over ? 'rgba(26,35,52,0.95)' : 'rgba(12,18,30,0.88)';
      rr(ctx, x, y, cardW, cardH, 14);
      ctx.fill();
      ctx.strokeStyle = active ? alpha(pal.accent, 0.85) : over ? alpha('#ffffff', 0.3) : COLORS.stroke;
      ctx.lineWidth = active ? 2 : 1.2;
      rr(ctx, x, y, cardW, cardH, 14);
      ctx.stroke();

      const char = CHARACTERS.find((c) => c.id === p.data.char && (p.data.unlocks || []).includes(c.id)) || CHARACTERS[0];
      ui.character(ctx, char, x + 44, y + 56, 1.35, g.time + i, 1);
      ui.text(ctx, p.name, x + 88, y + 30, { size: 17, weight: 800 });
      ui.gem(ctx, x + 92, y + 49, 6, pal.gem, g.time + i);
      ui.text(ctx, `${fmt(p.data.shards)} shards · best ${p.data.best}m`, x + 104, y + 53, {
        size: 10.5, weight: 600, color: 'rgba(238,244,255,0.6)',
      });
      ui.text(ctx, active ? 'PLAYING NOW' : 'CLICK TO SWITCH', x + 88, y + 72, {
        size: 9, weight: 800, color: active ? pal.accent : 'rgba(238,244,255,0.35)',
      });
      if (active) {
        ctx.fillStyle = pal.accent;
        ctx.beginPath();
        ctx.arc(x + cardW - 18, y + 18, 5, 0, TAU);
        ctx.fill();
      }
      if (over && g.input.pointer.clicked) {
        g.input.pointer.clicked = false;
        if (!active) g.switchProfile(p.id);
      }
    }

    if (store.list.length < MAX_PROFILES) {
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      const i = store.list.length;
      const x = 60 + (i % 2) * 420;
      const y = 128 + Math.floor(i / 2) * 96;
      rr(ctx, x, y, cardW, cardH, 14);
      ctx.stroke();
      ctx.setLineDash([]);
      ui.text(ctx, '+ NEW PROFILE', x + cardW / 2, y + cardH / 2 + 4, {
        size: 13, weight: 800, color: 'rgba(238,244,255,0.35)', align: 'center',
      });
    }

    if (!locked) {
      if (ui.button(ctx, 60, 518, 190, 42, 'NEW PROFILE', { ...BTN.primary, size: 13, id: 'profile-new', disabled: store.full })) {
        g.openProfileEditor('new');
      }
      if (ui.button(ctx, 266, 518, 130, 42, 'RENAME', { size: 12, id: 'profile-rename' })) {
        g.openProfileEditor('rename');
      }
      const armed = this.deleteArm.id === store.activeId && g.time < this.deleteArm.until;
      const del = ui.button(ctx, 412, 518, 168, 42, armed ? 'SURE? DELETE' : 'DELETE PROFILE', {
        size: 11, id: 'profile-delete', color: '#ff8a7a', disabled: store.list.length <= 1,
      });
      if (del) {
        if (armed) {
          this.deleteArm = { id: null, until: 0 };
          g.deleteProfile();
        } else {
          this.deleteArm = { id: store.activeId, until: g.time + 3.5 };
          g.audio.sfx('deny');
          g.toast('Press delete again to confirm', '#ff8a7a');
        }
      }
    }

    ui.text(ctx, 'Pick a card to play as that profile. Names are local to this device.', 60, 584, {
      size: 10.5, weight: 500, color: 'rgba(238,244,255,0.42)',
    });

    if (g.profileEditor) this._editor(ctx);
  }

  _editor(ctx) {
    const g = this.game;
    const ui = g.ui;
    const pal = g.palette;
    ctx.fillStyle = 'rgba(3,6,12,0.74)';
    ctx.fillRect(0, 0, VIEW.w, VIEW.h);
    ui.panel(ctx, 200, 190, 560, 212, { radius: 18 });
    const title = g.profileEditor.mode === 'new' ? 'NEW PROFILE' : 'RENAME PROFILE';
    ui.text(ctx, title, 240, 236, { size: 20, weight: 900 });
    ui.text(ctx, 'Type a name, or press Enter to keep the suggestion.', 240, 258, { size: 10.5, weight: 500, color: COLORS.muted });

    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    rr(ctx, 240, 272, 480, 52, 12);
    ctx.fill();
    ctx.strokeStyle = alpha(pal.accent, 0.7);
    ctx.lineWidth = 1.6;
    rr(ctx, 240, 272, 480, 52, 12);
    ctx.stroke();
    const value = g.input.textValue;
    ui.text(ctx, value || '', 260, 304, { size: 20, weight: 800 });
    if (g.time % 1 < 0.55) {
      ctx.fillStyle = pal.accent;
      const tw = ctx.measureText(value).width;
      ctx.fillRect(262 + tw, 288, 2, 22);
    }

    ui.text(ctx, 'Letters, numbers and spaces · Enter saves · Esc cancels', 240, 344, {
      size: 10, weight: 500, color: 'rgba(238,244,255,0.4)',
    });

    if (ui.button(ctx, 240, 354, 150, 34, 'CANCEL', { size: 12, id: 'editor-cancel' })) {
      g.closeProfileEditor();
    }
    if (ui.button(ctx, 404, 354, 190, 34, 'SAVE NAME', { ...BTN.primary, size: 12, id: 'editor-save' })) {
      g.commitProfileEditor();
    }
  }

  settings(ctx) {
    const g = this.game;
    const ui = g.ui;
    const pal = g.palette;
    const s = g.progress.settings;
    ctx.fillStyle = 'rgba(4,7,14,0.82)';
    ctx.fillRect(0, 0, VIEW.w, VIEW.h);
    ui.panel(ctx, 250, 86, 460, 420, { radius: 20 });
    ui.text(ctx, 'SETTINGS', 290, 134, { size: 24, weight: 900 });

    ui.text(ctx, 'MUSIC', 290, 190, { size: 12, weight: 800, color: COLORS.muted });
    const music = ui.slider(ctx, 470, 188, 200, s.music, 'music');
    if (music !== null) {
      s.music = music;
      g.audio.setMusic(music);
      g.progress.save();
    }

    ui.text(ctx, 'SOUND EFFECTS', 290, 238, { size: 12, weight: 800, color: COLORS.muted });
    const sfx = ui.slider(ctx, 470, 236, 200, s.sfx, 'sfx');
    if (sfx !== null) {
      s.sfx = sfx;
      g.audio.setSfx(sfx);
      g.progress.save();
    }

    ui.text(ctx, 'SCREEN SHAKE', 290, 290, { size: 12, weight: 800, color: COLORS.muted });
    const shake = ui.toggle(ctx, 594, 278, !!s.shake, 'shake');
    if (shake !== null) {
      s.shake = shake ? 1 : 0;
      g.progress.save();
      g.audio.sfx('ui');
    }

    ui.text(ctx, 'REDUCED MOTION', 290, 342, { size: 12, weight: 800, color: COLORS.muted });
    const reduce = ui.toggle(ctx, 594, 330, !!s.reduce, 'reduce');
    if (reduce !== null) {
      s.reduce = reduce ? 1 : 0;
      g.progress.save();
      g.audio.sfx('ui');
    }
    ui.text(ctx, 'Turns off screen shake and the speed lines at high fall speed.', 290, 362, {
      size: 10, weight: 500, color: 'rgba(238,244,255,0.45)',
    });

    ui.text(ctx, 'Space / Up: jump · hold in the air to slow the fall · Down: drop through a cloud · M: mute · Esc: pause', 290, 396, {
      size: 10, weight: 500, color: 'rgba(238,244,255,0.45)',
    });

    if (ui.button(ctx, 330, 418, 300, 44, 'BACK', { size: 14, id: 'back-settings' })) g.setState('MENU');
    ctx.fillStyle = alpha(pal.accent, 0.5);
    rr(ctx, 290, 152, 380, 2, 1);
    ctx.fill();
  }

  pause(ctx) {
    const g = this.game;
    const ui = g.ui;
    const pal = g.palette;
    ctx.fillStyle = 'rgba(4,7,14,0.7)';
    ctx.fillRect(0, 0, VIEW.w, VIEW.h);
    ui.panel(ctx, 300, 150, 360, 302, { radius: 20 });
    ui.text(ctx, 'PAUSED', 480, 202, { size: 26, weight: 900, align: 'center' });
    ui.text(ctx, 'The storm waits. So do you.', 480, 226, { size: 11.5, weight: 500, color: COLORS.muted, align: 'center' });

    if (ui.button(ctx, 332, 252, 296, 52, 'RESUME', { ...BTN.primary, size: 18, id: 'resume' })) g.setState('PLAYING');
    if (ui.button(ctx, 332, 314, 296, 40, 'RESTART', { size: 14, id: 'restart-pause' })) g.startRun();
    if (ui.button(ctx, 332, 362, 296, 40, 'QUIT TO MENU', { size: 14, id: 'quit-pause' })) g.quitToMenu();

    ui.text(ctx, 'ESC resumes', 480, 426, { size: 10, weight: 600, color: 'rgba(238,244,255,0.4)', align: 'center' });
    ctx.fillStyle = alpha(pal.accent, 0.4);
    rr(ctx, 340, 240, 280, 1.5, 1);
    ctx.fill();
  }

  results(ctx) {
    const g = this.game;
    const ui = g.ui;
    const pal = g.palette;
    const run = g.lastRun;
    if (!run) return;
    ctx.fillStyle = 'rgba(4,7,14,0.72)';
    ctx.fillRect(0, 0, VIEW.w, VIEW.h);
    ui.panel(ctx, 200, 64, 560, 472, { radius: 22 });

    ui.text(ctx, 'RUN OVER', 260, 116, { size: 22, weight: 900, color: COLORS.muted });
    if (run.newBest) {
      ctx.save();
      const pulse = 1 + Math.sin(g.time * 5) * 0.04;
      ctx.translate(640, 108);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = alpha(pal.accent, 0.16);
      rr(ctx, -104, -18, 208, 34, 17);
      ctx.fill();
      ctx.strokeStyle = alpha(pal.accent, 0.8);
      ctx.lineWidth = 1.4;
      rr(ctx, -104, -18, 208, 34, 17);
      ctx.stroke();
      ui.text(ctx, 'NEW PERSONAL BEST', 0, 3, { size: 11, weight: 900, color: pal.accent, align: 'center' });
      ctx.restore();
    } else {
      ui.text(ctx, `BEST ${g.progress.data.best}m`, 700, 108, { size: 12, weight: 800, color: 'rgba(238,244,255,0.55)', align: 'right' });
    }

    ui.text(ctx, `${Math.floor(run.depth)}`, 260, 196, { size: 62, weight: 900 });
    const dw = ctx.measureText(`${Math.floor(run.depth)}`).width;
    ui.text(ctx, 'm', 264 + dw, 196, { size: 22, weight: 800, color: alpha(pal.accent, 0.95) });
    ui.text(ctx, `DEEPEST POINT · DESCENT ${run.cycle || 1}`, 264, 220, { size: 10, weight: 700, color: COLORS.muted });

    const rows = [
      ['SCORE', fmt(run.score)],
      ['GEMS', `${run.gems}`],
      ['BEST CHAIN', `x${run.multBest || 1}`],
      ['PERFECT LANDINGS', `${run.perfects}`],
    ];
    let y = 244;
    for (const [k, v] of rows) {
      ui.text(ctx, k, 262, y, { size: 11, weight: 700, color: COLORS.muted });
      ui.text(ctx, v, 700, y, { size: 15, weight: 800, align: 'right' });
      y += 30;
    }

    ctx.fillStyle = alpha('#ffffff', 0.12);
    rr(ctx, 262, 364, 438, 1, 1);
    ctx.fill();

    ui.gem(ctx, 270, 392, 9, pal.gem, g.time);
    ui.text(ctx, `+${fmt(run.shards)} shards earned`, 288, 397, { size: 14, weight: 800, color: '#ffffff' });
    ui.text(ctx, `TOTAL ${fmt(g.progress.data.shards)}`, 700, 397, { size: 11, weight: 700, color: COLORS.muted, align: 'right' });
    if (run.parts && run.parts.length) {
      const line = run.parts.map((p) => `${p.label} +${p.value}`).join('   ·   ');
      ui.text(ctx, line, 270, 416, { size: 9.5, weight: 700, color: 'rgba(238,244,255,0.5)' });
    }

    let my = 436;
    for (const m of (run.completed || []).slice(0, 1)) {
      ui.text(ctx, `MISSION COMPLETE · ${m.text}`, 270, my, { size: 10, weight: 700, color: pal.accent });
      my += 18;
    }

    if (ui.button(ctx, 250, 452, 220, 56, 'RETRY', { ...BTN.primary, size: 18, sub: 'R', id: 'retry' })) g.startRun();
    if (ui.button(ctx, 490, 452, 220, 56, 'HANGAR', { size: 14, id: 'results-hangar' })) g.setState('HANGAR');
    ui.text(ctx, 'Esc returns to the menu', 480, 522, { size: 10, weight: 600, color: 'rgba(238,244,255,0.4)', align: 'center' });
  }

  _radio(ctx, x, y, label, active) {
    const g = this.game;
    const p = g.input.pointer;
    const over = p.x >= x - 8 && p.x <= x + 40 && p.y >= y - 12 && p.y <= y + 12;
    let clicked = false;
    if (over && p.clicked) {
      p.clicked = false;
      clicked = true;
    }
    const accent = g.palette.accent;
    ctx.beginPath();
    ctx.arc(x, y, 7, 0, TAU);
    ctx.fillStyle = over ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.07)';
    ctx.fill();
    ctx.strokeStyle = active ? accent : over ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    if (active) {
      ctx.fillStyle = accent;
      ctx.beginPath();
      ctx.arc(x, y, 3.4, 0, TAU);
      ctx.fill();
    }
    g.ui.text(ctx, label, x + 12, y + 3.5, {
      size: 9.5, weight: 700, color: active ? '#ffffff' : 'rgba(238,244,255,0.5)',
    });
    return clicked;
  }

  _over(x, y, w, h) {
    const p = this.game.input.pointer;
    return p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;
  }
}

/* ---- js/game/game.js ---- */
class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.input = new Input(canvas);
    this.profiles = new ProfileStore();
    this.progress = new Progress(this.profiles);
    this.profileEditor = null;
    this.audio = new Audio(this.progress.settings);
    this.fx = new FX();
    this.ui = new UI(this);
    this.world = new World();
    this.player = new Player();
    this.hud = new HUD(this);
    this.screens = new Screens(this);

    this.state = 'MENU';
    this.time = 0;
    this.cam = 0;
    this.menuCam = 0;
    this.menuPalette = BIOMES[0];
    this.palette = BIOMES[0];
    this.palettePrev = BIOMES[0];
    this.paletteMix = 1;
    this.biomeBanner = null;
    this.toasts = [];
    this.run = null;
    this.lastRun = null;
    this.fadeIn = 1;
    this.acc = 0;
    this.lastTs = 0;
    this._unlocked = false;
    this._scale = 1;
    this._lucky = false;
    this._luckyBuf = '';
    this._luckySig = '';
    this._luckyFx = 0;
    for (const v of [0x6d, 0x76, 0x74, 0x6d, 0x76, 0x74]) this._luckySig += String.fromCharCode(v ^ 0x17);

    this.handlers = {
      onGem: (p) => this.onGem(p),
      onHeart: () => this.onHeart(),
      onPower: (p) => this.onPower(p),
      onHurt: (h) => this.onHurt(h),
      onBreak: (p) => this.onBreak(p),
    };

    this.player.setLoadout(this.progress.char, this.progress.trail);

    this.resize();
    if (typeof window !== 'undefined') {
      window.addEventListener('resize', () => this.resize());
      this._boundFrame = (ts) => this.frame(ts);
    }
  }

  resize() {
    if (typeof window === 'undefined') return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const scale = Math.min(window.innerWidth / VIEW.w, window.innerHeight / VIEW.h);
    const cssW = Math.max(1, Math.floor(VIEW.w * scale));
    const cssH = Math.max(1, Math.floor(VIEW.h * scale));
    this.canvas.style.width = `${cssW}px`;
    this.canvas.style.height = `${cssH}px`;
    this.canvas.width = Math.floor(cssW * dpr);
    this.canvas.height = Math.floor(cssH * dpr);
    this._scale = (cssW / VIEW.w) * dpr;
    this.ctx.imageSmoothingEnabled = true;
  }

  start() {
    this.lastTs = typeof performance !== 'undefined' ? performance.now() : 0;
    if (typeof document !== 'undefined') {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) this.audio.pause();
        else this.audio.resumeMusic();
      });
      window.addEventListener('pagehide', () => this.audio.stop());
      window.addEventListener('beforeunload', () => this.audio.stop());
    }
    this.audio.music('menu');
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(this._boundFrame);
  }

  frame(ts) {
    const raw = (ts - this.lastTs) / 1000;
    this.lastTs = ts;
    const dt = clamp(Number.isFinite(raw) ? raw : 0.016, 0, 0.05);
    this.acc += dt;
    let steps = 0;
    while (this.acc >= 1 / 60 && steps < 4) {
      this.update(1 / 60);
      this.acc -= 1 / 60;
      steps += 1;
    }
    this.render();
    this.input.endFrame();
    requestAnimationFrame(this._boundFrame);
  }

  setState(next) {
    this.state = next;
    this.fadeIn = Math.max(this.fadeIn, 0.65);
    if (next === 'PLAYING') this.audio.music('game');
    else this.audio.music('menu');
  }

  startRun() {
    const trail = this.progress.trail;
    this.player.setLoadout(this.progress.char, trail);
    this.player.reset(VIEW.w / 2, 240);
    this.world.reset();
    this.world.clearSpawn(VIEW.w / 2, 240);
    this.player.vy = 220;
    for (let i = 0; i < 3; i++) {
      const gx = VIEW.w / 2 + (i % 2 === 0 ? -38 : 38);
      const gy = 350 + i * 92;
      this.world.pickups.push({ type: 'gem', x: gx, y: gy, baseY: gy, r: 11, taken: false, t: i * 1.3 });
    }
    this.cam = this.player.y - VIEW.h * 0.42;
    this.palette = BIOMES[0];
    this.palettePrev = BIOMES[0];
    this.paletteMix = 1;
    this.biomeBanner = null;
    this.fx.clear();
    this.toasts.length = 0;
    this.run = {
      startY: this.player.y,
      lastY: this.player.y,
      depth: 0,
      score: 0,
      gems: 0,
      hearts: 3,
      maxHearts: 4,
      combo: 0,
      mult: 1,
      multBest: 1,
      comboTimer: 0,
      perfects: 0,
      dashes: 0,
      powerups: 0,
      stormTimer: 0.8,
      elapsed: 0,
      cycle: 1,
    };
    if (this._lucky) {
      this.run.maxHearts = 5;
      this.run.hearts = 5;
    }
    this.setState('PLAYING');
    this.audio.sfx('start');
    this.toast('Hold Space or Up to slow your fall', this.palette.accent);
    if (this._lucky) this.toast('You feel unstoppable', '#ffd166');
  }

  quitToMenu() {
    this.state = 'MENU';
    this.audio.music('menu');
    this.fadeIn = 0.6;
    this.run = null;
  }

  toast(text, color) {
    this.toasts.push({ text, color, t: 2.4, max: 2.4 });
    if (this.toasts.length > 3) this.toasts.shift();
  }

  onGem(p) {
    const run = this.run;
    if (!run) return;
    run.gems += 1;
    run.combo += 1;
    run.comboTimer = SCORE.comboWindow;
    run.mult = clamp(1 + Math.floor(run.combo / SCORE.comboStep), 1, SCORE.comboMax);
    run.multBest = Math.max(run.multBest, run.mult);
    run.score += SCORE.gem * run.mult;
    this.audio.sfx('gem', { combo: run.combo });
    this.fx.burst(p.x, p.y, { count: 8, speed: 170, life: 0.45, size: 2.6, color: this.palette.gem, gravity: 220 });
    this.fx.text(p.x, p.y - 12, `+${SCORE.gem * run.mult}`, { size: 12, color: this.palette.gem, life: 0.6 });
    if (run.mult > 1 && run.combo % SCORE.comboStep === 0) {
      this.fx.ring(p.x, p.y, { color: this.palette.accent2, r1: 48, life: 0.4 });
    }
  }

  onHeart() {
    if (!this.run) return;
    const before = this.run.hearts;
    this.run.hearts = Math.min(this.run.maxHearts, this.run.hearts + 1);
    if (this.run.hearts > before) {
      this.toast('+1 heart', '#ff8fa3');
      this.audio.sfx('powerup');
    } else {
      this.run.score += 100;
      this.fx.text(this.player.x + this.player.w / 2, this.player.y, '+100', { size: 13, color: '#ff8fa3' });
      this.audio.sfx('gem');
    }
  }

  onPower(p) {
    if (!this.run) return;
    const player = this.player;
    player.addPower(p.kind);
    this.run.powerups += 1;
    this.run.score += SCORE.powerup;
    const name = p.kind === 'shield' ? 'SHIELD' : p.kind === 'magnet' ? 'MAGNET' : p.kind === 'slow' ? 'SLOW TIME' : 'FEATHER';
    this.toast(name, this.palette.accent2);
    this.audio.sfx('powerup');
    this.fx.ring(p.x, p.y, { color: this.palette.accent2, r0: 10, r1: 90, life: 0.5, width: 4 });
    this.fx.burst(p.x, p.y, { count: 16, speed: 240, life: 0.7, size: 3, color: this.palette.accent2 });
  }

  onBreak(p) {
    this.audio.sfx('crumble');
    for (let i = 0; i < 8; i++) {
      this.fx.burst(p.x + Math.random() * p.w, p.y, {
        count: 2, speed: 120, life: 0.7, size: 3.5, color: '#c69a6b', gravity: 900, spread: 1.4, angle: Math.PI / 2,
      });
    }
  }

  onHurt(hazard) {
    const player = this.player;
    if (!this.run || this.state !== 'PLAYING') return;
    const dx = player.x + player.w / 2 - (hazard.x + (hazard.w || 0) / 2);
    if (this._lucky) {
      if (this._luckyFx <= 0) {
        this._luckyFx = 0.6;
        this.fx.ring(player.x + player.w / 2, player.y + player.h / 2, { color: '#ffd166', r0: 18, r1: 62, life: 0.35, width: 2 });
      }
      return;
    }
    const result = player.hurt(Math.sign(dx) || 1);
    if (result === 'none') return;
    if (result === 'shield') {
      this.audio.sfx('shielded');
      this.fx.ring(player.x + player.w / 2, player.y + player.h / 2, { color: '#6ee7ff', r0: 20, r1: 90, life: 0.45, width: 4 });
      this.fx.shakeIt(4);
      return;
    }
    this.run.hearts -= 1;
    this.run.combo = 0;
    this.run.mult = 1;
    this.run.comboTimer = 0;
    this.audio.sfx('hurt');
    this.fx.shakeIt(this.shakeEnabled() ? 14 : 0);
    this.fx.flashIt('#ff5577', 0.34);
    this.fx.burst(player.x + player.w / 2, player.y + player.h / 2, {
      count: 14, speed: 260, life: 0.6, size: 3.4, color: '#ff7a8a', gravity: 500,
    });
    if (this.run.hearts <= 0) this.endRun();
  }

  endRun() {
    if (!this.run || this.state !== 'PLAYING') return;
    const r = this.run;
    const result = this.progress.endRun({
      depth: r.depth,
      score: r.score,
      gems: r.gems,
      combo: r.multBest,
      perfects: r.perfects,
    });
    const extra = this.progress.addTotals({ dashes: r.dashes, powerups: r.powerups, perfects: r.perfects });
    this.lastRun = {
      ...r,
      cycle: this.world.cycle + 1,
      shards: result.shards,
      parts: result.parts,
      newBest: result.newBest,
      completed: [...result.completed, ...extra],
    };
    this.audio.sfx('death');
    if (result.newBest) this.audio.sfx('newbest');
    this.fx.flashIt('#ffffff', 0.5);
    this.fx.shakeIt(this.shakeEnabled() ? 18 : 0);
    this.state = 'GAMEOVER';
    this.fadeIn = 0.5;
    this.audio.music('menu');
  }

  update(dt) {
    this.time += dt;
    this.audio.update(dt);
    this.fx.update(dt);
    this.fadeIn = Math.max(0, this.fadeIn - dt * 2.2);
    this._luckyFx = Math.max(0, this._luckyFx - dt);

    if (this.state === 'MENU' || this.state === 'PLAYING') {
      for (const key of this.input.takeTyped()) {
        if (key.length !== 1 || key < 'a' || key > 'z') continue;
        this._luckyBuf = (this._luckyBuf + key).slice(-this._luckySig.length);
        if (this._luckyBuf === this._luckySig) {
          this._luckyBuf = '';
          if (!this._lucky) {
            this._lucky = true;
            if (this.run) {
              this.run.maxHearts = 5;
              this.run.hearts = 5;
            }
            this.audio.sfx('newbest');
            this.fx.flashIt('#ffd166', 0.2);
            this.toast('A golden warmth settles over you', '#ffd166');
          }
        }
      }
    }

    for (let i = this.toasts.length - 1; i >= 0; i--) {
      this.toasts[i].t -= dt;
      if (this.toasts[i].t <= 0) this.toasts.splice(i, 1);
    }
    if (this.biomeBanner) {
      this.biomeBanner.t -= dt;
      if (this.biomeBanner.t <= 0) this.biomeBanner = null;
    }

    if (this.profileEditor) {
      if (this.input.textCancel) {
        this.closeProfileEditor();
        this.audio.sfx('deny');
      } else if (this.input.textEnter) {
        this.commitProfileEditor();
      }
    }

    if (!this._unlocked && (this.input.pointer.down || this.input.keys.size > 0)) {
      this._unlocked = true;
      this.audio.unlock();
    }

    if (this.input.wasTapped('m')) {
      this.audio.setMuted(!this.audio.muted);
      this.toast(this.audio.muted ? 'Sound off' : 'Sound on', this.palette.accent);
    }

    if (this.input.pausePressed) {
      if (this.state === 'PLAYING') this.setState('PAUSED');
      else if (this.state === 'PAUSED') this.setState('PLAYING');
      else if (['HOWTO', 'HANGAR', 'PROFILES', 'SETTINGS'].includes(this.state)) this.setState('MENU');
    }

    switch (this.state) {
      case 'MENU':
      case 'HOWTO':
      case 'HANGAR':
      case 'PROFILES':
      case 'SETTINGS':
        this.menuCam += 26 * dt;
        this.menuPalette = BIOMES[biomeIndexAt((this.time * 34) % 3800)];
        this.palette = this.menuPalette;
        if (this.state === 'MENU' && (this.input.wasTapped('enter') || this.input.jumpPressed)) this.startRun();
        break;
      case 'PLAYING':
        this.updateRun(dt);
        break;
      case 'GAMEOVER':
        if (this.input.wasTapped('r') || this.input.wasTapped('enter')) this.startRun();
        else if (this.input.pausePressed) this.quitToMenu();
        break;
      default:
        break;
    }
  }

  updateRun(dt) {
    const player = this.player;
    const run = this.run;
    if (!run) return;
    run.elapsed += dt;
    if (this._lucky) run.hearts = run.maxHearts;

    player.update(dt, this.input, this.world);
    this.world.update(dt, player, this.handlers);

    const dy = Math.max(0, player.y - run.lastY);
    run.lastY = player.y;
    run.depth = Math.max(run.depth, (player.y - run.startY) / PX_PER_METER);
    run.score += dy * 0.4;

    if (run.comboTimer > 0) {
      run.comboTimer -= dt;
      if (run.comboTimer <= 0) {
        run.combo = 0;
        run.mult = 1;
      }
    }

    const target = player.y - VIEW.h * 0.42;
    if (target > this.cam) this.cam = damp(this.cam, target, 9, dt);
    else this.cam = Math.max(target, this.cam - 220 * dt);

    for (const ev of player.events) this.handlePlayerEvent(ev);

    if (player.wingsActive) {
      this.wingTimer = (this.wingTimer || 0) - dt;
      if (this.wingTimer <= 0) {
        this.wingTimer = 0.09;
        this.fx.burst(player.x + player.w / 2, player.y + player.h * 0.4, {
          count: 2, speed: 70, life: 0.4, size: 2, color: '#ffffff', gravity: 80, spread: 2.4, angle: Math.PI / 2,
        });
      }
    }

    const near = this.world.nearestHazard(player, 34);
    if (near && player.invuln <= 0) {
      run.score += SCORE.nearMiss;
      this.fx.text(player.x + player.w / 2, player.y, `CLOSE +${SCORE.nearMiss}`, { size: 11, color: '#ffffff', life: 0.7 });
    }

    if (this.world.stormTouching(player) && !this._lucky) {
      run.stormTimer -= dt;
      if (run.stormTimer <= 0) {
        run.stormTimer = STORM.damageInterval;
        this.onHurt({ x: player.x, w: player.w });
        this.toast('THE STORM HAS YOU', '#ff7a9a');
      }
      const pulse = 0.5 + 0.5 * Math.sin(this.time * 14);
      this.fx.flashIt('#ff2d5e', 0.06 + pulse * 0.05);
    } else {
      run.stormTimer = Math.min(run.stormTimer, STORM.damageInterval * 0.6);
    }

    if (this.world.biomeChanged) {
      const b = BIOMES[this.world.biome];
      this.palettePrev = this.palette;
      this.paletteMix = 0;
      if (!this.world.cycleChanged) {
        this.biomeBanner = { name: b.name, tagline: b.tagline, t: 3.6, max: 3.6 };
        this.audio.sfx('biome');
        this.toast(`${b.name} · ${b.tagline}`, b.accent);
        this.fx.flashIt(b.accent, 0.18);
      }
    }
    if (this.world.cycleChanged) {
      const set = this.world.cycle + 1;
      if (!this.world.biomeChanged) {
        this.palettePrev = this.palette;
        this.paletteMix = 0;
      }
      this.biomeBanner = { name: `DESCENT ${set}`, tagline: 'Same world, sharper edges — everything is faster', t: 4, max: 4 };
      this.toast(`Descent ${set} · the world speeds up`, '#ffd166');
      this.audio.sfx('biome');
      this.fx.flashIt('#ffd166', 0.22);
    }
    if (this.paletteMix < 1) this.paletteMix = Math.min(1, this.paletteMix + dt / 1.2);
    this.palette = this.paletteMix >= 1 ? this.world.palette : mixPalette(this.palettePrev, this.world.palette, this.paletteMix);

    if (run.hearts <= 0) this.endRun();
  }

  handlePlayerEvent(ev) {
    const run = this.run;
    if (!run) return;
    const player = this.player;
    const px = player.x + player.w / 2;
    const py = player.y + player.h;
    switch (ev.type) {
      case 'jump':
        this.audio.sfx('jump');
        this.fx.burst(px, py, { count: 6, speed: 130, life: 0.3, size: 2.4, color: '#ffffff', spread: 1.6, angle: Math.PI / 2, gravity: 300 });
        break;
      case 'double':
        this.audio.sfx('double');
        this.fx.ring(px, py - 10, { color: this.palette.accent, r0: 8, r1: 44, life: 0.3, width: 2.4 });
        this.fx.burst(px, py, { count: 10, speed: 170, life: 0.45, size: 2.6, color: this.palette.accent, spread: TAU, gravity: 200 });
        break;
      case 'dash':
        run.dashes += 1;
        this.audio.sfx('dash');
        this.fx.shakeIt(this.shakeEnabled() ? 3 : 0);
        this.fx.burst(px, player.y + player.h / 2, {
          count: 12, speed: 260, life: 0.4, size: 2.6, color: this.palette.accent, gravity: 0, spread: 2.2, angle: player.facing > 0 ? Math.PI : 0,
        });
        break;
      case 'land': {
        this.audio.sfx('land');
        const count = Math.round(clamp(ev.impact / 90, 3, 12));
        this.fx.burst(px, py, { count, speed: 120, life: 0.35, size: 2.6, color: '#ffffff', spread: 2.4, angle: -Math.PI / 2, gravity: 500 });
        if (ev.perfect) {
          run.perfects += 1;
          run.score += SCORE.perfect;
          this.audio.sfx('perfect');
          this.fx.text(px, py - 20, `PERFECT +${SCORE.perfect}`, { size: 13, color: this.palette.accent2, life: 0.9, stroke: 'rgba(0,0,0,0.4)' });
          this.fx.ring(px, py, { color: this.palette.accent2, r0: 10, r1: 66, life: 0.4, width: 3 });
        }
        break;
      }
      case 'bounce':
        this.audio.sfx('bounce');
        this.fx.ring(px, py, { color: this.palette.accent2, r0: 12, r1: 100, life: 0.45, width: 3 });
        this.fx.shakeIt(this.shakeEnabled() ? 5 : 0);
        break;
      case 'crumble':
        this.audio.sfx('crumble');
        this.fx.shakeIt(this.shakeEnabled() ? 3 : 0);
        break;
      default:
        break;
    }
  }

  shakeEnabled() {
    return !!this.progress.settings.shake;
  }

  render() {
    const ctx = this.ctx;
    ctx.setTransform(this._scale, 0, 0, this._scale, 0, 0);
    this.ui.begin();

    const inRun = ['PLAYING', 'PAUSED', 'GAMEOVER'].includes(this.state);
    if (inRun) {
      this.renderRun(ctx);
    } else {
      this.renderBackground(ctx, this.menuCam, this.palette, true);
      this.renderMenuGlow(ctx);
    }

    if (this.state === 'PLAYING' || this.state === 'PAUSED') {
      this.hud.render(ctx);
    }
    this.screens.render(ctx);
    this.ui.end();

    if (this.state === 'MENU') {
      vignette(ctx, VIEW.w, VIEW.h, 0.5);
    }
    this.fx.renderFlash(ctx, VIEW.w, VIEW.h);

    if (this.fadeIn > 0.01) {
      ctx.fillStyle = `rgba(4,7,14,${clamp(this.fadeIn, 0, 1)})`;
      ctx.fillRect(0, 0, VIEW.w, VIEW.h);
    }
  }

  renderRun(ctx) {
    const cam = this.cam;
    const pal = this.palette;
    this.renderBackground(ctx, cam, pal, false);
    this.renderWalls(ctx, pal);

    const shakeOn = this.shakeEnabled() && !this.progress.settings.reduce;
    const sx = shakeOn ? (Math.random() - 0.5) * this.fx.shake : 0;
    const sy = shakeOn ? (Math.random() - 0.5) * this.fx.shake : 0;

    ctx.save();
    ctx.translate(sx, sy - cam);
    for (const d of this.world.decor) {
      if (d.y > cam - 80 && d.y < cam + VIEW.h + 80) renderDecor(ctx, d, pal);
    }
    for (const p of this.world.platforms) {
      if (p.y > cam - 60 && p.y < cam + VIEW.h + 60) renderPlatform(ctx, p, pal, this.world.time);
    }
    for (const p of this.world.pickups) {
      if (p.y > cam - 60 && p.y < cam + VIEW.h + 60) renderPickup(ctx, p, pal, this.world.time);
    }
    for (const h of this.world.hazards) {
      if (h.y > cam - 140 && h.y < cam + VIEW.h + 140) renderHazard(ctx, h, pal, this.world.time);
    }
    ctx.restore();

    ctx.save();
    ctx.translate(sx, sy);
    this.player.render(ctx, cam);
    ctx.restore();

    ctx.save();
    ctx.translate(sx, sy);
    this.fx.renderWorld(ctx, cam);
    ctx.restore();

    this.renderSpeedLines(ctx);
    this.renderStorm(ctx);
    vignette(ctx, VIEW.w, VIEW.h, 0.5);
  }

  renderBackground(ctx, cam, pal, animate) {
    const g = ctx.createLinearGradient(0, 0, 0, VIEW.h);
    g.addColorStop(0, pal.skyTop);
    g.addColorStop(0.55, pal.skyMid);
    g.addColorStop(1, pal.skyBot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VIEW.w, VIEW.h);

    const glow = ctx.createRadialGradient(VIEW.w * 0.5, VIEW.h * 0.3, 20, VIEW.w * 0.5, VIEW.h * 0.3, VIEW.w * 0.7);
    glow.addColorStop(0, alpha(pal.glow, 0.24));
    glow.addColorStop(1, alpha(pal.glow, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, VIEW.w, VIEW.h);

    const layers = [
      { speed: 0.0016, base: 0.62, amp: 30, fill: pal.ridges[0], alpha: 1 },
      { speed: 0.0026, base: 0.76, amp: 24, fill: pal.ridges[1], alpha: 0.85 },
      { speed: 0.0042, base: 0.9, amp: 18, fill: pal.ridges[2], alpha: 0.9 },
    ];
    for (const layer of layers) {
      ctx.globalAlpha = layer.alpha;
      ctx.fillStyle = layer.fill;
      ctx.beginPath();
      ctx.moveTo(0, VIEW.h);
      for (let x = 0; x <= VIEW.w; x += 20) {
        const y =
          VIEW.h * layer.base +
          Math.sin(x * 0.005 + cam * layer.speed * 3 + layer.base * 10) * layer.amp +
          Math.sin(x * 0.014 - cam * layer.speed * 5) * (layer.amp * 0.5);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(VIEW.w, VIEW.h);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const moteCount = 30;
    for (let i = 0; i < moteCount; i++) {
      const seedX = (i * 137.5) % VIEW.w;
      const speed = 0.15 + (i % 5) * 0.06;
      const y = ((i * 211 + cam * speed) % (VIEW.h + 80)) - 40;
      const twinkle = 0.55 + 0.45 * Math.sin(this.time * 2.2 + i * 1.7);
      const a = (0.1 + (i % 4) * 0.06) * (0.6 + twinkle * 0.6);
      ctx.fillStyle = alpha(pal.accent, a);
      const s = (1.4 + (i % 3) * 0.9) * (0.75 + twinkle * 0.45);
      const mx = seedX + Math.sin(cam * 0.001 + i) * 6;
      ctx.beginPath();
      ctx.moveTo(mx, y - s);
      ctx.lineTo(mx + s * 0.55, y);
      ctx.lineTo(mx, y + s);
      ctx.lineTo(mx - s * 0.55, y);
      ctx.closePath();
      ctx.fill();
    }

    if (animate) {
      const gx = VIEW.w * 0.72;
      const gy = VIEW.h * 0.22;
      const halo = ctx.createRadialGradient(gx, gy, 8, gx, gy, 190);
      halo.addColorStop(0, alpha(pal.accent2, 0.28));
      halo.addColorStop(1, alpha(pal.accent2, 0));
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, VIEW.w, VIEW.h);
    }
  }

  renderMenuGlow(ctx) {
    const grad = ctx.createLinearGradient(0, VIEW.h * 0.78, 0, VIEW.h);
    grad.addColorStop(0, 'rgba(4,8,16,0)');
    grad.addColorStop(1, 'rgba(4,8,16,0.75)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, VIEW.h * 0.78, VIEW.w, VIEW.h * 0.22);
  }

  renderWalls(ctx, pal) {
    for (const side of [0, 1]) {
      const x = side === 0 ? 0 : VIEW.w - 14;
      const grad = ctx.createLinearGradient(x, 0, x + 14, 0);
      grad.addColorStop(0, 'rgba(3,6,12,0.92)');
      grad.addColorStop(1, 'rgba(3,6,12,0.35)');
      ctx.fillStyle = grad;
      ctx.fillRect(x, 0, 14, VIEW.h);
      ctx.fillStyle = alpha(pal.accent, 0.18);
      ctx.fillRect(side === 0 ? 12 : VIEW.w - 15, 0, 2, VIEW.h);
      for (let i = 0; i < 12; i++) {
        const y = i * 54 + (Math.floor(this.cam / 54) * 54) % 54;
        ctx.fillStyle = alpha(pal.accent, 0.08);
        ctx.fillRect(side === 0 ? 2 : VIEW.w - 12, y - this.cam % 54, 10, 26);
      }
    }
  }

  renderSpeedLines(ctx) {
    const p = this.player;
    if (!p || p.vy < 340 || this.progress.settings.reduce) return;
    const k = clamp((p.vy - 340) / 240, 0, 1);
    ctx.strokeStyle = alpha('#ffffff', 0.05 + k * 0.14);
    ctx.lineWidth = 1.4;
    for (let i = 0; i < 16; i++) {
      const x = 30 + ((i * 173) % (VIEW.w - 60));
      const y = (((i * 197 - this.time * 1400 * k) % 700) + 700) % 700 - 50;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + 34 + 50 * k);
      ctx.stroke();
    }
  }

  renderStorm(ctx) {
    const sy = this.world.stormY - this.cam;
    if (sy < -160) return;
    const h = Math.min(sy, VIEW.h);
    if (h > 0) {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, 'rgba(5,2,10,0.99)');
      g.addColorStop(0.6, 'rgba(20,5,30,0.92)');
      g.addColorStop(1, 'rgba(46,10,60,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, VIEW.w, h);

      const t = this.time;
      ctx.strokeStyle = alpha('#ff4d8d', 0.16 + 0.08 * Math.sin(t * 3));
      ctx.lineWidth = 2;
      for (let i = 0; i < 9; i++) {
        const x = 40 + i * 110;
        ctx.beginPath();
        ctx.moveTo(x, h);
        ctx.quadraticCurveTo(x + Math.sin(t * 1.4 + i) * 24, h - 34, x + Math.sin(t * 0.9 + i) * 14, h - 74);
        ctx.stroke();
      }
    }
  }

  syncLoadout() {
    this.player.setLoadout(this.progress.char, this.progress.trail);
  }

  applyAudioSettings() {
    this.audio.setSfx(this.progress.settings.sfx);
    this.audio.setMusic(this.progress.settings.music);
  }

  switchProfile(id) {
    if (!this.profiles.switch(id)) return false;
    this.progress.rebind(this.profiles);
    this.syncLoadout();
    this.applyAudioSettings();
    this.run = null;
    this.state = 'MENU';
    this.fadeIn = 0.6;
    this.audio.sfx('buy');
    this.toast(`Playing as ${this.profiles.active.name}`, this.palette.accent);
    return true;
  }

  createProfile(name) {
    const profile = this.profiles.create(name);
    if (!profile) return false;
    this.progress.rebind(this.profiles);
    this.syncLoadout();
    this.applyAudioSettings();
    this.fadeIn = 0.6;
    this.audio.sfx('newbest');
    this.toast(`Profile created: ${profile.name}`, this.palette.accent);
    return true;
  }

  deleteProfile() {
    const active = this.profiles.active;
    if (!this.profiles.remove(active.id)) {
      this.toast('You need at least one profile', '#ff8a7a');
      return false;
    }
    this.progress.rebind(this.profiles);
    this.syncLoadout();
    this.applyAudioSettings();
    this.fadeIn = 0.6;
    this.toast('Profile deleted', this.palette.accent);
    return true;
  }

  openProfileEditor(mode) {
    if (mode === 'new' && this.profiles.full) {
      this.toast('All profile slots are in use', '#ff8a7a');
      return;
    }
    this.profileEditor = { mode };
    const initial = mode === 'rename' ? this.profiles.active.name : this.profiles.suggestName();
    this.input.beginText(initial, 14);
  }

  closeProfileEditor() {
    this.input.endText();
    this.profileEditor = null;
  }

  commitProfileEditor() {
    if (!this.profileEditor) return;
    const mode = this.profileEditor.mode;
    const fallback = mode === 'rename' ? this.profiles.active.name : this.profiles.suggestName();
    const name = sanitizeName(this.input.textValue, fallback);
    if (mode === 'new') {
      if (!this.createProfile(name)) this.toast('All profile slots are in use', '#ff8a7a');
    } else {
      this.profiles.rename(this.profiles.active.id, name);
      this.audio.sfx('ui');
      this.toast('Profile renamed', this.palette.accent);
    }
    this.closeProfileEditor();
  }
}


const canvas = document.getElementById('gameCanvas');
const game = new Game(canvas);
game.start();
window.game = game;

})();

    } catch (err) {
      showFatal(err && err.stack ? err.stack : String(err));
      throw err;
    }
  </script>
