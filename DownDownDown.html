  }

  ownsChar(id) {
    return this.data.unlocks.includes(id);
  }

  ownsTrail(id) {
    return this.data.trails.includes(id);
  }

  equipChar(id) {
    if (!this.ownsChar(id)) return false;
    this.data.char = id;
    this.save();
    return true;
  }

  equipTrail(id) {
    if (!this.ownsTrail(id)) return false;
    this.data.trail = id;
    this.save();
    return true;
  }

  buyChar(id) {
    const def = CHARACTERS.find((c) => c.id === id);
    if (!def || this.ownsChar(id) || this.data.shards < def.cost) return false;
    this.data.shards -= def.cost;
    this.data.unlocks.push(id);
    this.data.char = id;
    this.save();
    return true;
  }

  buyTrail(id) {
    const def = TRAILS.find((t) => t.id === id);
    if (!def || this.ownsTrail(id) || this.data.shards < def.cost) return false;
    this.data.shards -= def.cost;
    this.data.trails.push(id);
    this.data.trail = id;
    this.save();
    return true;
  }

  ensureMissions() {
    const active = this.data.missions.filter((m) => !m.done);
    if (active.length >= 3) return;
    const used = new Set(this.data.missions.map((m) => m.id));
    const pool = MISSION_POOL.filter((m) => !used.has(m.id));
    if (pool.length < 3) {
      this.data.missions = [];
      const freshPool = [...MISSION_POOL];
      while (this.data.missions.length < 3 && freshPool.length) {
        const pickIdx = Math.floor(Math.random() * freshPool.length);
        const def = freshPool.splice(pickIdx, 1)[0];
        this.data.missions.push(this._makeMission(def));
      }
    } else {
      while (this.data.missions.filter((m) => !m.done).length < 3 && pool.length) {
        const def = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
        this.data.missions.push(this._makeMission(def));
      }
    }
    this.save();
  }

  _makeMission(def) {
    return { id: def.id, ev: def.ev, mode: def.mode, goal: def.goal, reward: def.reward, text: def.text, prog: 0, done: false };
  }

  record(ev, value, mode = 'add') {
    const completed = [];
    let changed = false;
    for (const m of this.data.missions) {
      if (m.done || m.ev !== ev) continue;
      m.prog = mode === 'max' ? Math.max(m.prog, value) : m.prog + value;
      changed = true;
      if (m.prog >= m.goal) {
        m.done = true;
        this.data.shards += m.reward;
        completed.push(m);
      }
    }
    if (changed) this.save();
    return completed;
  }

  rewardParts({ depth, score, gems, perfects = 0 }) {
    const biome = biomeIndexAt(depth);
    const parts = [
      { label: 'DEPTH', value: Math.floor(depth / ECONOMY.depthDiv) },
      { label: 'GEMS', value: Math.floor(gems / ECONOMY.gemDiv) },
      { label: 'SCORE', value: Math.floor(score / ECONOMY.scoreDiv) },
      { label: 'LANDINGS', value: perfects * ECONOMY.perfectEach },
      { label: 'BIOMES', value: biome * ECONOMY.biomeEach },
    ];
    return parts.filter((p) => p.value > 0);
  }

  endRun({ depth, score, gems, combo, perfects = 0 }) {
    const data = this.data;
    data.runs += 1;
    data.gems += gems;
    const newBest = depth > data.best;
    if (newBest) data.best = Math.floor(depth);
    if (score > data.bestScore) data.bestScore = Math.floor(score);

    const parts = this.rewardParts({ depth, score, gems, perfects });
    const earned = parts.reduce((sum, p) => sum + p.value, 0);
    data.shards += earned;

    const completed = [
      ...this.record('runDepth', Math.floor(depth), 'max'),
      ...this.record('runScore', Math.floor(score), 'max'),
      ...this.record('runGems', gems, 'max'),
      ...this.record('runCombo', combo, 'max'),
      ...this.record('runPerfect', perfects, 'max'),
      ...this.record('gems', gems, 'add'),
      ...this.record('runs', 1, 'add'),
    ];
    this.ensureMissions();
    this.save();
    return { shards: earned, parts, newBest, completed };
  }

  addTotals({ dashes = 0, powerups = 0, perfects = 0 }) {
    const completed = [
      ...this.record('dashes', dashes, 'add'),
      ...this.record('powerups', powerups, 'add'),
      ...this.record('perfect', perfects, 'add'),
    ];
    this.ensureMissions();
    return completed;
  }
}

/* ---- js/game/profiles.js ---- */
const PROFILES_KEY = 'ddd.profiles.v1';
const MAX_PROFILES = 8;
const NAME_MAX = 14;

const uid = () => `p${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;

function sanitizeName(raw, fallback = 'Player') {
  const cleaned = String(raw == null ? '' : raw)
    .replace(/[^\w \-']/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, NAME_MAX);
  return cleaned || fallback;
}

function readJSON(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function mergeData(raw) {
  const base = freshProfileData();
  const data = { ...base, ...(raw || {}) };
  const rawSettings = (raw && raw.settings) || {};
  const settingsVersion = rawSettings.audioVersion || 1;
  data.settings = { ...base.settings, ...rawSettings, audioVersion: 2 };
  // Older saves started music on by default; the new default is silent until asked.
  if (settingsVersion < 2 && data.settings.music === 0.45) data.settings.music = 0;
  if (!Array.isArray(data.unlocks) || !data.unlocks.length) data.unlocks = base.unlocks;
  if (!Array.isArray(data.trails) || !data.trails.length) data.trails = base.trails;
  if (!Array.isArray(data.missions)) data.missions = [];
  return data;
}

class ProfileStore {
  constructor() {
    this.list = [];
    this.activeId = null;
    this.load();
  }

  load() {
    const saved = readJSON(PROFILES_KEY);
    if (saved && Array.isArray(saved.list) && saved.list.length) {
      this.list = saved.list
        .filter((p) => p && p.id && p.data)
        .map((p, i) => ({
          id: String(p.id),
          name: sanitizeName(p.name, `Player ${i + 1}`),
          created: p.created || Date.now(),
          data: mergeData(p.data),
        }));
      if (this.list.length) {
        this.activeId = this.list.some((p) => p.id === saved.active) ? saved.active : this.list[0].id;
        return;
      }
    }
    this.loadLegacy();
  }

  loadLegacy() {
    const legacy = readJSON(SAVE_KEY);
    const profile = {
      id: uid(),
      name: sanitizeName(legacy && legacy.name, 'Player 1'),
      created: Date.now(),
      data: mergeData(legacy),
    };
    this.list = [profile];
    this.activeId = profile.id;
    this.save();
  }

  save() {
    try {
      localStorage.setItem(PROFILES_KEY, JSON.stringify({ active: this.activeId, list: this.list }));
    } catch (e) {}
  }

  get active() {
    return this.list.find((p) => p.id === this.activeId) || this.list[0];
  }

  get full() {
    return this.list.length >= MAX_PROFILES;
  }

  suggestName() {
    const used = new Set(this.list.map((p) => p.name.toLowerCase()));
    for (let n = 1; n <= MAX_PROFILES + 1; n++) {
      if (!used.has(`player ${n}`)) return `Player ${n}`;
    }
    return 'Player';
  }

  create(name) {
    if (this.full) return null;
    const profile = {
      id: uid(),
      name: sanitizeName(name, this.suggestName()),
      created: Date.now(),
      data: freshProfileData(),
    };
    this.list.push(profile);
    this.activeId = profile.id;
    this.save();
    return profile;
  }

  switch(id) {
    if (!this.list.some((p) => p.id === id)) return false;
    this.activeId = id;
    this.save();
    return true;
  }

  rename(id, name) {
    const profile = this.list.find((p) => p.id === id);
    if (!profile) return false;
    profile.name = sanitizeName(name, profile.name);
    this.save();
    return true;
  }

  remove(id) {
    if (this.list.length <= 1) return false;
    const idx = this.list.findIndex((p) => p.id === id);
    if (idx < 0) return false;
    this.list.splice(idx, 1);
    if (this.activeId === id) this.activeId = this.list[Math.max(0, idx - 1)].id;
    this.save();
    return true;
  }
}

/* ---- js/core/input.js ---- */
const JUMP_KEYS = new Set([' ', 'ArrowUp', 'w', 'W']);
const LEFT_KEYS = new Set(['ArrowLeft', 'a', 'A']);
const RIGHT_KEYS = new Set(['ArrowRight', 'd', 'D']);
const DOWN_KEYS = new Set(['ArrowDown', 's', 'S']);
const DASH_KEYS = new Set(['Shift', 'k', 'K', 'x', 'X']);
const PAUSE_KEYS = new Set(['Escape', 'p', 'P']);

class Input {
  constructor(canvas) {
    this.canvas = canvas;
    this.keys = new Set();
    this.tapped = new Set();
    this.typed = [];
    this.left = false;
    this.right = false;
    this.down = false;
    this.downPressed = false;
    this.jumpHeld = false;
    this.jumpPressed = false;
    this.dashPressed = false;
    this.pausePressed = false;
    this.pointer = { x: VIEW.w / 2, y: VIEW.h / 2, down: false, clicked: false };
    this.touchMode = false;
    this.touch = { left: false, right: false, jump: false, dash: false };
    this.touchJumpPressed = false;
    this.touchDashPressed = false;
    this.textField = null;
    this.textEnter = false;
    this.textCancel = false;
    this._pointers = new Map();
    this._jumpPointers = new Set();
    this._dashPointers = new Set();
    this._bind();
  }

  _bind() {
    window.addEventListener('keydown', (e) => {
      const key = e.key;
      if (this.textField) {
        if (key === 'Enter') {
          this.textEnter = true;
          e.preventDefault();
          return;
        }
        if (key === 'Escape') {
          this.textCancel = true;
          e.preventDefault();
          return;
        }
        if (key === 'Backspace') {
          this.textField.value = this.textField.value.slice(0, -1);
          e.preventDefault();
          return;
        }
        if (key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          if (/[\w \-']/.test(key) && this.textField.value.length < this.textField.max) {
            this.textField.value += key;
          }
          e.preventDefault();
        }
        return;
      }
      if (JUMP_KEYS.has(key) || LEFT_KEYS.has(key) || RIGHT_KEYS.has(key) || DOWN_KEYS.has(key)) e.preventDefault();
      if (PAUSE_KEYS.has(key) && !e.repeat) this.pausePressed = true;
      if (key.length === 1) this.tapped.add(key.toLowerCase());
      if (this.keys.has(key) && e.repeat) return;
      this.keys.add(key);
      if (key.length === 1) {
        this.tapped.add(key.toLowerCase());
        this.typed.push(key.toLowerCase());
      } else if (key === 'Enter') {
        this.tapped.add('enter');
      }

      if (JUMP_KEYS.has(key)) {
        if (!e.repeat) this.jumpPressed = true;
        this.jumpHeld = true;
      }
      if (LEFT_KEYS.has(key)) this.left = true;
      if (RIGHT_KEYS.has(key)) this.right = true;
      if (DOWN_KEYS.has(key)) {
        if (!e.repeat) this.downPressed = true;
        this.down = true;
      }
      if (DASH_KEYS.has(key) && !e.repeat) this.dashPressed = true;
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key;
      this.keys.delete(key);
      if (JUMP_KEYS.has(key)) this.jumpHeld = false;
      if (LEFT_KEYS.has(key)) this.left = false;
      if (RIGHT_KEYS.has(key)) this.right = false;
      if (DOWN_KEYS.has(key)) this.down = false;
    });

    window.addEventListener('blur', () => this.reset());

    const toLogical = (clientX, clientY) => {
      const rect = this.canvas.getBoundingClientRect();
      const sx = VIEW.w / (rect.width || 1);
      const sy = VIEW.h / (rect.height || 1);
      return { x: (clientX - rect.left) * sx, y: (clientY - rect.top) * sy };
    };

    this.canvas.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'touch') this.touchMode = true;
      this.canvas.setPointerCapture?.(e.pointerId);
      const p = toLogical(e.clientX, e.clientY);
      this._pointers.set(e.pointerId, p);
      this.pointer.x = p.x;
      this.pointer.y = p.y;
      this.pointer.down = true;
      if (e.button === 0 || e.pointerType !== 'mouse') this.pointer.clicked = true;
      if (this._hit('jump', p)) this._jumpPointers.add(e.pointerId);
      if (this._hit('dash', p)) this._dashPointers.add(e.pointerId);
      this._syncTouch();
      e.preventDefault();
    }, { passive: false });

    this.canvas.addEventListener('pointermove', (e) => {
      const p = toLogical(e.clientX, e.clientY);
      this.pointer.x = p.x;
      this.pointer.y = p.y;
      if (this._pointers.has(e.pointerId)) {
        this._pointers.set(e.pointerId, p);
        this._syncTouch();
      }
    });

    const release = (e) => {
      const wasJump = this._jumpPointers.delete(e.pointerId);
      this._dashPointers.delete(e.pointerId);
      this._pointers.delete(e.pointerId);
      if (this._pointers.size === 0) this.pointer.down = false;
      if (wasJump) this._syncTouch();
      this._syncTouch();
    };
    this.canvas.addEventListener('pointerup', release);
    this.canvas.addEventListener('pointercancel', release);
    this.canvas.addEventListener('pointerleave', (e) => {
      if (e.pointerType === 'mouse') this.pointer.down = false;
    });
    this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  _hit(name, p) {
    const b = TOUCH[name];
    return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
  }

  _syncTouch() {
    let left = false;
    let right = false;
    let jump = false;
    let dash = false;
    for (const p of this._pointers.values()) {
      if (this._hit('left', p)) left = true;
      if (this._hit('right', p)) right = true;
      if (this._hit('jump', p)) jump = true;
      if (this._hit('dash', p)) dash = true;
    }
    const jumpPressed = jump && !this.touch.jump;
    const dashPressed = dash && !this.touch.dash;
    this.touch = { left, right, jump, dash };
    if (jumpPressed) this.touchJumpPressed = true;
    if (dashPressed) this.touchDashPressed = true;
  }

  get axis() {
    let a = 0;
    if (this.left || this.touch.left) a -= 1;
    if (this.right || this.touch.right) a += 1;
    return a;
  }

  get wantsDown() {
    return this.down;
  }

  get downQueued() {
    return this.downPressed;
  }

  consumeDown() {
    this.downPressed = false;
  }

  get wantsJump() {
    return this.jumpHeld || this.touch.jump;
  }

  get jumpQueued() {
    return this.jumpPressed || this.touchJumpPressed;
  }

  get dashQueued() {
    return this.dashPressed || this.touchDashPressed;
  }

  consumeJump() {
    this.jumpPressed = false;
    this.touchJumpPressed = false;
  }

  consumeDash() {
    this.dashPressed = false;
    this.touchDashPressed = false;
  }

  wasTapped(key) {
    return this.tapped.has(key);
  }

  takeTyped() {
    const out = this.typed;
    this.typed = [];
    return out;
  }

  beginText(initial = '', max = 14) {
    this.reset();
    this.textField = { value: String(initial || '').slice(0, max), max };
    this.textEnter = false;
    this.textCancel = false;
  }

  endText() {
    const value = this.textField ? this.textField.value : '';
    this.textField = null;
    this.textEnter = false;
    this.textCancel = false;
    return value;
  }

  get texting() {
    return !!this.textField;
  }

  get textValue() {
    return this.textField ? this.textField.value : '';
  }

  endFrame() {
    this.downPressed = false;
    this.jumpPressed = false;
    this.dashPressed = false;
    this.pausePressed = false;
    this.pointer.clicked = false;
    this.touchJumpPressed = false;
    this.touchDashPressed = false;
    this.textEnter = false;
    this.textCancel = false;
    this.tapped.clear();
    this.typed.length = 0;
  }

  reset() {
    this.keys.clear();
    this.tapped.clear();
    this.typed.length = 0;
    this.left = this.right = this.down = false;
    this.downPressed = false;
    this.jumpHeld = false;
    this.jumpPressed = false;
    this.dashPressed = false;
    this._pointers.clear();
    this._jumpPointers.clear();
    this._dashPointers.clear();
    this.pointer.down = false;
    this.touch = { left: false, right: false, jump: false, dash: false };
  }
}

/* ---- js/core/audio.js ---- */
const TRACKS = {
  menu: ['public/sound/down.mp3'],
  game: [
    'public/sound/downinst.mp3',
    'public/sound/downbeetinst.mp3',
    'public/sound/downstars.mp3',
  ],
};

const VOLUME = 0.85;

class Audio {
  constructor(settings) {
    this.ctx = null;
    this.master = null;
    this.sfxBus = null;
    this.musicBus = null;
    this.sfxVolume = settings?.sfx ?? 0.7;
    this.musicVolume = settings?.music ?? 0.45;
    this.muted = false;
    this.el = null;
    this.kind = null;
    this.index = { menu: -1, game: -1 };
    this.fade = 0;
    this.fadeTarget = 0;
    this._switchTimer = 0;
    this._pendingKind = null;
    this._noise = null;
    this._wanted = null;
  }

  ensure() {
    if (!this.ctx) {
      const AC = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
      if (!AC) return false;
      try {
        this.ctx = new AC();
      } catch (e) {
        return false;
      }
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain();
      this.sfxBus.gain.value = this.muted ? 0 : this.sfxVolume;
      this.sfxBus.connect(this.master);
      this.musicBus = this.ctx.createGain();
      this.musicBus.gain.value = this.muted ? 0 : this.musicVolume;
      this.musicBus.connect(this.master);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return true;
  }

  setSfx(v) {
    this.sfxVolume = Math.max(0, Math.min(1, v));
    if (this.sfxBus) this.sfxBus.gain.value = this.muted ? 0 : this.sfxVolume;
  }

  unlock() {
    this.ensure();
    if (!this._wanted) return;
    if (this.el && !this.el.paused) return;
    this.el = null;
    this.kind = null;
    this._start(this._wanted);
  }

  pause() {
    this.fadeTarget = 0;
    this.fade = 0;
    if (this.el) this.el.pause();
  }

  stop() {
    this.fadeTarget = 0;
    this.fade = 0;
    if (this.el) {
      this.el.pause();
      this.el.removeAttribute('src');
      this.el.load();
      this.el = null;
    }
    this.kind = null;
    this._wanted = null;
    this._pendingKind = null;
    if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {});
  }

  resumeMusic() {
    if (this.el) {
      this.fadeTarget = 1;
      this.el.play().catch(() => {});
    } else {
      this.unlock();
    }
  }

  setMusic(v) {
    const wasOff = this.musicVolume <= 0.001;
    this.musicVolume = Math.max(0, Math.min(1, v));
    if (this.el) {
      this.el.volume = this.muted ? 0 : this.musicVolume * this.fade * VOLUME;
      if (this.musicVolume <= 0.001) this.el.pause();
    }
    if (wasOff && this.musicVolume > 0.001) {
      if (this.el) this.el.play().catch(() => {});
      else this.unlock();
    }
  }

  tone({ freq, to, dur = 0.15, type = 'sine', gain = 0.3, delay = 0, attack = 0.005, bus = null }) {
    if (!this.ensure()) return;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, gain), t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(bus || this.sfxBus);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  noise({ dur = 0.15, gain = 0.15, filter = 1200, delay = 0 }) {
    if (!this.ensure()) return;
    if (!this._noise) {
      const len = Math.floor(this.ctx.sampleRate * 0.4);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this._noise = buf;
    }
    const t0 = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource();
    src.buffer = this._noise;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(filter, t0);
    bp.Q.value = 1.1;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp);
    bp.connect(g);
    g.connect(this.sfxBus);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }

  sfx(name, p = {}) {
    if (this.muted && name !== 'ui') return;
    switch (name) {
      case 'jump':
        this.tone({ freq: 320, to: 620, dur: 0.16, type: 'triangle', gain: 0.16 });
        break;
      case 'double':
        this.tone({ freq: 520, to: 880, dur: 0.18, type: 'triangle', gain: 0.14 });
        this.tone({ freq: 780, to: 1180, dur: 0.14, type: 'sine', gain: 0.08, delay: 0.04 });
        break;
      case 'dash':
        this.noise({ dur: 0.2, gain: 0.12, filter: 2200 });
        this.tone({ freq: 180, to: 90, dur: 0.18, type: 'sawtooth', gain: 0.08 });
        break;
      case 'land':
        this.tone({ freq: 160, to: 90, dur: 0.1, type: 'sine', gain: 0.13 });
        break;
      case 'perfect':
        this.tone({ freq: 880, dur: 0.12, type: 'triangle', gain: 0.1 });
        this.tone({ freq: 1320, dur: 0.18, type: 'triangle', gain: 0.08, delay: 0.07 });
        break;
      case 'gem': {
        const step = Math.min(8, p.combo || 0);
        const base = 660 * Math.pow(1.0595, step * 2);
        this.tone({ freq: base, dur: 0.1, type: 'sine', gain: 0.13 });
        this.tone({ freq: base * 1.5, dur: 0.12, type: 'sine', gain: 0.07, delay: 0.03 });
        break;
      }
      case 'hurt':
        this.tone({ freq: 260, to: 70, dur: 0.34, type: 'square', gain: 0.16 });
        this.noise({ dur: 0.25, gain: 0.16, filter: 500 });
        break;
      case 'shielded':
        this.tone({ freq: 900, to: 420, dur: 0.24, type: 'triangle', gain: 0.16 });
        break;
      case 'powerup':
        [523, 659, 784, 1047].forEach((f, i) => this.tone({ freq: f, dur: 0.22, type: 'triangle', gain: 0.11, delay: i * 0.06 }));
        break;
      case 'bounce':
        this.tone({ freq: 220, to: 900, dur: 0.2, type: 'sine', gain: 0.16 });
        break;
      case 'crumble':
        this.noise({ dur: 0.22, gain: 0.1, filter: 700 });
        break;
      case 'start':
        [392, 523, 659, 880].forEach((f, i) => this.tone({ freq: f, dur: 0.28, type: 'triangle', gain: 0.12, delay: i * 0.08 }));
        break;
      case 'ui':
        this.tone({ freq: p.hover ? 900 : 620, dur: p.hover ? 0.04 : 0.08, type: 'sine', gain: p.hover ? 0.03 : 0.08 });
        break;
      case 'buy':
        [660, 880, 1180].forEach((f, i) => this.tone({ freq: f, dur: 0.16, type: 'triangle', gain: 0.1, delay: i * 0.06 }));
        break;
      case 'deny':
        this.tone({ freq: 180, to: 120, dur: 0.16, type: 'square', gain: 0.1 });
        break;
      case 'mission':
        [784, 988, 1175, 1568].forEach((f, i) => this.tone({ freq: f, dur: 0.2, type: 'sine', gain: 0.1, delay: i * 0.07 }));
        break;
      case 'biome':
        [392, 523, 659, 784].forEach((f, i) => this.tone({ freq: f, dur: 0.5, type: 'sine', gain: 0.09, delay: i * 0.1 }));
        break;
      case 'storm':
        this.tone({ freq: 110, to: 60, dur: 0.5, type: 'sawtooth', gain: 0.08 });
        break;
      case 'death':
        [392, 330, 262, 196].forEach((f, i) => this.tone({ freq: f, dur: 0.35, type: 'triangle', gain: 0.14, delay: i * 0.12 }));
        break;
      case 'newbest':
        [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone({ freq: f, dur: 0.3, type: 'triangle', gain: 0.12, delay: i * 0.09 }));
        break;
      case 'warn':
        this.tone({ freq: 520, to: 520, dur: 0.1, type: 'square', gain: 0.05 });
        break;
      default:
        break;
    }
  }

  music(kind) {
    this._wanted = kind;
    if (this.kind === kind && this.el) return;
    this._pendingKind = null;
    if (this.el) {
      this._pendingKind = kind;
      this.fadeTarget = 0;
    } else {
      this._start(kind);
    }
  }

  _start(kind) {
    if (this.musicVolume <= 0.001) return;
    const AudioCtor = typeof window !== 'undefined' ? window.Audio : null;
    if (!AudioCtor) return;
    const list = TRACKS[kind];
    if (!list) return;
    let idx = this.index[kind];
    idx = idx < 0 ? Math.floor(Math.random() * list.length) : (idx + 1) % list.length;
    this.index[kind] = idx;
    let el;
    try {
      el = new AudioCtor(list[idx]);
    } catch (e) {
      return;
    }
    if (!el || typeof el.addEventListener !== 'function' || typeof el.play !== 'function') return;
    el.loop = false;
    el.preload = 'auto';
    el.volume = 0;
    el.addEventListener('ended', () => {
      if (this.el === el) {
        this.el = null;
        this._start(this.kind);
      }
    });
    el.addEventListener('error', () => {
      if (this.el === el) {
        this.el = null;
        this.kind = null;
      }
    });
    this.el = el;
    this.kind = kind;
    this.fade = 0;
    this.fadeTarget = 1;
    el.play().catch(() => {
      if (this.el === el) {
        this.el = null;
        this.kind = null;
      }
    });
  }

  stopMusic() {
    this.fadeTarget = 0;
    this._pendingKind = null;
  }

  setMuted(on) {
    this.muted = on;
    if (this.sfxBus) this.sfxBus.gain.value = on ? 0 : this.sfxVolume;
    if (this.el) this.el.volume = on ? 0 : this.musicVolume * this.fade * VOLUME;
  }

  update(dt) {
    this.fade = Math.min(1, Math.max(0, this.fade + (this.fadeTarget - this.fade) * Math.min(1, dt * 4)));
    if (this.el) {
      this.el.volume = this.muted ? 0 : Math.max(0, Math.min(1, this.musicVolume * this.fade * VOLUME));
      if (this.fade < 0.02 && this.fadeTarget === 0 && this._pendingKind) {
        const kind = this._pendingKind;
        this._pendingKind = null;
        this.el.pause();
        this.el = null;
        this.kind = null;
        this._start(kind);
      }
    }
  }
}

/* ---- js/core/fx.js ---- */
class FX {
  constructor() {
    this.parts = [];
    this.texts = [];
    this.rings = [];
    this.shake = 0;
    this.shakeMax = 18;
    this.flash = 0;
    this.flashColor = '#ffffff';
  }

  burst(x, y, opts = {}) {
    const {
      count = 10,
      speed = 200,
      life = 0.6,
      size = 3.5,
      color = '#ffe066',
      gravity = 700,
      drag = 1.8,
      spread = TAU,
      angle = -Math.PI / 2,
      glow = true,
    } = opts;
    for (let i = 0; i < count; i++) {
      const a = angle + (Math.random() - 0.5) * spread;
      const sp = speed * (0.35 + Math.random() * 0.85);
      this.parts.push({
        x: x + rand(-4, 4),
        y: y + rand(-4, 4),
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: life * (0.6 + Math.random() * 0.7),
        max: life,
        size: size * (0.5 + Math.random() * 0.8),
        color,
        gravity,
        drag,
        glow,
      });
    }
  }

  spark(x, y, color, opts = {}) {
    this.burst(x, y, { count: 3, speed: 90, life: 0.35, size: 2.2, color, gravity: 200, ...opts });
  }

  ring(x, y, opts = {}) {
    const { color = '#ffe066', r0 = 6, r1 = 70, life = 0.45, width = 3, fill = false } = opts;
    this.rings.push({ x, y, r0, r1, life, max: life, color, width, fill });
  }

  text(x, y, str, opts = {}) {
    const { color = '#ffffff', size = 18, life = 0.9, vy = -70, weight = 800, stroke = null } = opts;
    this.texts.push({ x, y, str, color, size, life, max: life, vy, weight, stroke });
  }

  shakeIt(v) {
    this.shake = Math.min(this.shakeMax, this.shake + v);
  }

  flashIt(color = '#ffffff', v = 0.5) {
    this.flashColor = color;
    this.flash = Math.max(this.flash, v);
  }

  update(dt) {
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.life -= dt;
      if (p.life <= 0) {
        this.parts.splice(i, 1);
        continue;
      }
      p.vy += p.gravity * dt;
      const d = 1 - Math.min(0.9, p.drag * dt);
      p.vx *= d;
      p.vy *= d;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.life -= dt;
      if (r.life <= 0) this.rings.splice(i, 1);
    }
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.life -= dt;
      t.y += t.vy * dt;
      t.vy *= 1 - Math.min(0.9, dt * 2.4);
      if (t.life <= 0) this.texts.splice(i, 1);
    }
    this.shake *= Math.exp(-7 * dt);
    if (this.shake < 0.05) this.shake = 0;
    this.flash *= Math.exp(-6 * dt);
    if (this.flash < 0.01) this.flash = 0;
  }

  renderWorld(ctx, cam) {
    for (const r of this.rings) {
      const t = 1 - r.life / r.max;
      const rad = r.r0 + (r.r1 - r.r0) * t;
      ctx.globalAlpha = (1 - t) * 0.8;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.width * (1 - t * 0.6);
      ctx.beginPath();
      ctx.arc(r.x, r.y - cam, rad, 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const p of this.parts) {
      const a = clamp(p.life / p.max, 0, 1);
      const sy = p.y - cam;
      if (sy < -40 || sy > 660) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      if (p.glow) {
        ctx.shadowColor = p.color;
        ctx.shadowBlur = p.size * 3;
      }
      ctx.beginPath();
      ctx.arc(p.x, sy, Math.max(0.5, p.size * a), 0, TAU);
      ctx.fill();
      if (p.glow) ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const t of this.texts) {
      const a = clamp(t.life / t.max, 0, 1);
      ctx.globalAlpha = Math.min(1, a * 1.6);
      ctx.font = `${t.weight} ${t.size}px "Segoe UI", system-ui, sans-serif`;
      const sy = t.y - cam;
      if (t.stroke) {
        ctx.lineWidth = 4;
        ctx.strokeStyle = t.stroke;
        ctx.strokeText(t.str, t.x, sy);
      }
      ctx.fillStyle = t.color;
      ctx.fillText(t.str, t.x, sy);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  renderFlash(ctx, w, h) {
    if (this.flash <= 0.01) return;
    ctx.globalAlpha = Math.min(0.85, this.flash);
    ctx.fillStyle = this.flashColor;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }

  clear() {
    this.parts.length = 0;
    this.texts.length = 0;
    this.rings.length = 0;
    this.shake = 0;
    this.flash = 0;
  }
}

function vignette(ctx, w, h, strength = 0.55, color = '#000000') {
  const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.35, w / 2, h / 2, h * 0.85);
  g.addColorStop(0, alpha(color, 0));
  g.addColorStop(1, alpha(color, strength));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}

/* ---- js/game/levelgen.js ---- */
const LEFT = 54;
const RIGHT = VIEW.w - 54;

class Builder {
  constructor(seed, index, tier) {
    this.rng = makeRng(seed + index * 7919);
    this.index = index;
    this.tier = tier;
    this.cy = index * CHUNK_H;
    this.platforms = [];
    this.hazards = [];
    this.pickups = [];
    this.decor = [];
  }

  plat(x, y, w, type = 'solid', opts = {}) {
    const rng = this.rng;
    this.platforms.push({
      x: clamp(x, LEFT - 20, RIGHT - w + 20),
      y,
      w: clamp(w, 70, VIEW.w - 100),
      h: 14,
      type,
      broken: false,
      timer: 0,
      shake: 0,
      squash: 0,
      vx: opts.vx || 0,
      originX: x,
      range: opts.range || 0,
      speed: opts.speed || 1,
      phase: opts.phase ?? rng.range(0, TAU),
    });
  }

  spike(x, y, w, dir = 'up') {
    const h = 17;
    this.hazards.push({ type: 'spike', x, y: dir === 'up' ? y - h : y, w, h, dir });
  }

  saw(x, y, r = 20, opts = {}) {
    this.hazards.push({
      type: 'saw',
      x,
      y,
      r,
      baseX: x,
      baseY: y,
      amp: opts.amp || 0,
      axis: opts.axis || 'x',
      speed: opts.speed || 1.3,
      phase: opts.phase ?? this.rng.range(0, TAU),
      angle: 0,
    });
  }

  laser(x, y, w, opts = {}) {
    this.hazards.push({
      type: 'laser',
      x,
      y,
      w,
      h: 12,
      period: opts.period || 3.4,
      onTime: opts.onTime || 1.1,
      warnTime: opts.warnTime || 0.6,
      phase: opts.phase || 0,
      state: 'off',
      timer: 0,
      active: false,
    });
  }

  // A wall-mounted beam. Always short enough to leave a wide walk-through lane.
  beam(y, opts = {}) {
    const w = clamp(opts.w || this.rng.range(160, 220), 130, VIEW.w - 420);
    const fromLeft = opts.side === undefined ? this.rng.chance(0.5) : opts.side === 'left';
    const x = fromLeft ? LEFT - 12 : RIGHT + 12 - w;
    this.laser(x, y, w, opts);
    return { x, w, fromLeft, openX: fromLeft ? VIEW.w - 130 : 130 };
  }

  crusher(x, y, w, h, opts = {}) {
    this.hazards.push({
      type: 'crusher',
      x,
      y,
      w,
      h,
      baseY: y,
      range: opts.range || 150,
      period: opts.period || 3,
      phase: opts.phase || 0,
      offset: 0,
      warn: 0,
    });
  }

  gloom(x, y) {
    this.hazards.push({ type: 'gloom', x, y, w: 30, h: 30, vx: 0, vy: 0, t: rand(0, 6), homeX: x, homeY: y });
  }

  gem(x, y) {
    this.pickups.push({ type: 'gem', x, y, baseY: y, r: 11, taken: false, t: this.rng.range(0, TAU) });
  }

  gemLine(x1, y1, x2, y2, n = 3) {
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0 : i / (n - 1);
      this.gem(clamp(x1 + (x2 - x1) * t, LEFT, RIGHT), y1 + (y2 - y1) * t);
    }
  }

  gemArc(cx, cy, n, spread, height) {
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0.5 : i / (n - 1);
      const x = cx + (t - 0.5) * spread;
      const y = cy - Math.sin(t * Math.PI) * height;
      this.gem(clamp(x, LEFT, RIGHT), y);
    }
  }

  heart(x, y) {
    this.pickups.push({ type: 'heart', x, y, baseY: y, r: 14, taken: false, t: this.rng.range(0, TAU) });
  }

  power(x, y, kind) {
    this.pickups.push({ type: 'power', kind, x, y, baseY: y, r: 16, taken: false, t: this.rng.range(0, TAU) });
  }

  deco(kind, x, y, size = 1) {
    this.decor.push({ kind, x, y, size, seed: this.rng.range(0, 100) });
  }
}

function pickPower(b) {
  const kinds = ['shield', 'magnet', 'slow', 'glide'];
  return b.rng.pick(kinds);
}

function pZigzag(b) {
  const rows = 4 + Math.min(3, Math.floor(b.tier / 2));
  const step = (CHUNK_H - 150) / rows;
  let side = b.rng.sign();
  for (let i = 0; i < rows; i++) {
    const y = b.cy + 90 + i * step;
    const w = b.rng.range(200, 265) - Math.min(50, b.tier * 5);
    const x = side > 0 ? b.rng.range(LEFT, LEFT + 90) : b.rng.range(RIGHT - w - 90, RIGHT - w);
    const type = b.tier > 2 && b.rng.chance(0.14) ? 'crumble' : 'solid';
    const moving = b.tier > 3 && b.rng.chance(0.18);
    b.plat(x, y, w, type, moving ? { range: b.rng.range(18, 46), speed: b.rng.range(0.7, 1.4) } : {});
    if (b.tier > 0 && b.rng.chance(0.3)) b.spike(x + w / 2 - 13, y, 26);
    const laneX = side > 0 ? Math.max(x + w + 60, VIEW.w / 2) : Math.min(x - 60, VIEW.w / 2);
    b.gem(clamp(laneX, LEFT, RIGHT), y + 52);
    b.gem(clamp(laneX, LEFT, RIGHT), y + 96);
    side *= -1;
  }
  b.gemLine(VIEW.w / 2, b.cy + 40, VIEW.w / 2, b.cy + 80, 2);
}

function pShaft(b) {
  const rows = 5;
  const step = (CHUNK_H - 130) / rows;
  for (let i = 0; i < rows; i++) {
    const y = b.cy + 80 + i * step;
    const w = b.rng.range(120, 175);
    const left = i % 2 === 0;
    const x = left ? b.rng.range(LEFT, LEFT + 50) : b.rng.range(RIGHT - w - 50, RIGHT - w);
    b.plat(x, y, w, 'solid');
    b.gem(VIEW.w / 2 + b.rng.range(-40, 40), y + step * 0.5);
    if (b.tier > 0 && i % 2 === 1) {
      b.saw(VIEW.w / 2, y + step * 0.5, 19, { amp: b.rng.range(70, 130), speed: b.rng.range(0.8, 1.5) });
    }
  }
  b.gemLine(VIEW.w / 2, b.cy + 30, VIEW.w / 2, b.cy + 140, 3);
  if (b.tier > 0) b.spike(b.rng.chance(0.5) ? LEFT + 30 : RIGHT - 90, b.cy + CHUNK_H - 110, 60);
}

function pCrumble(b) {
  const rows = 5;
  const step = (CHUNK_H - 140) / rows;
  let side = b.rng.sign();
  for (let i = 0; i < rows; i++) {
    const y = b.cy + 90 + i * step;
    const w = 150 - b.tier * 5;
    const x = side > 0 ? LEFT + b.rng.range(10, 70) : RIGHT - w - b.rng.range(10, 70);
    b.plat(x, y, Math.max(100, w), 'crumble');
    b.gem(x + w / 2, y - 46);
    side *= -1;
  }
  b.heart(VIEW.w / 2, b.cy + CHUNK_H - 130);
  b.gemLine(VIEW.w / 2, b.cy + 40, LEFT + 90, b.cy + 120, 3);
}

function pSawAlley(b) {
  const rows = 3;
  for (let i = 0; i < rows; i++) {
    const y = b.cy + 140 + i * 195;
    const leftW = b.rng.range(210, 290);
    b.plat(LEFT - 10, y, leftW, 'solid');
    b.plat(RIGHT - leftW + 10, y, leftW, 'solid');
    b.saw(VIEW.w / 2, y - 40, 22, { axis: 'x', amp: b.rng.range(90, 150), speed: b.rng.range(0.9, 1.6) });
    b.gem(VIEW.w / 2, y + 34);
    b.gem(VIEW.w / 2 - 40, y + 34);
    b.gem(VIEW.w / 2 + 40, y + 34);
    if (b.tier > 2) b.spike(LEFT + leftW - 60, y, 34);
  }
  b.gemLine(VIEW.w / 2, b.cy + 40, VIEW.w / 2, b.cy + 120, 2);
}

function pGauntlet(b) {
  const rows = 4;
  const step = (CHUNK_H - 150) / rows;
  for (let i = 0; i < rows; i++) {
    const y = b.cy + 100 + i * step;
    const w = b.rng.range(150, 210);
    const left = i % 2 === 0;
    b.plat(left ? LEFT : RIGHT - w, y, w, 'solid');
    if (i < rows - 1) {
      const gateY = y + step * 0.55;
      const gate = b.beam(gateY, {
        side: left ? 'left' : 'right',
        w: b.rng.range(170, 230),
        period: 3.6 - Math.min(1.1, b.tier * 0.1),
      });
      b.gem(gate.openX, gateY);
      b.gem(VIEW.w / 2, gateY - 26);
    }
  }
  b.gemLine(VIEW.w / 2, b.cy + 30, VIEW.w / 2, b.cy + 90, 2);
}

function pBounce(b) {
  const base = b.cy + CHUNK_H - 190;
  b.plat(VIEW.w / 2 - 90, base, 180, 'bounce');
  b.gemArc(VIEW.w / 2, base - 200, 5, 260, 70);
  b.plat(LEFT + 20, b.cy + 130, 190, 'solid');
  b.plat(RIGHT - 210, b.cy + 300, 190, 'solid');
  b.gemLine(LEFT + 110, b.cy + 90, VIEW.w / 2 - 90, base - 40, 3);
  if (b.tier > 1) b.saw(VIEW.w / 2 + 150, b.cy + 420, 20, { axis: 'y', amp: 90, speed: 1.1 });
  b.gem(VIEW.w / 2, base - 60);
}

function pIslands(b) {
  const rng = b.rng;
  const count = 6 + Math.min(3, b.tier);
  const gap = (CHUNK_H - 160) / count;
  for (let i = 0; i < count; i++) {
    const y = b.cy + 90 + i * gap;
    const w = rng.range(105, 165);
    const x = rng.range(LEFT, RIGHT - w);
    b.plat(x, y, w, rng.chance(0.18) ? 'crumble' : 'solid');
    b.gem(x + w / 2, y - 52);
    if (i % 2 === 1 && b.tier > 0) {
      const hx = x + w / 2 + rng.sign() * rng.range(80, 150);
      b.spike(clamp(hx - 15, LEFT, RIGHT - 30), y + 40, 30);
    }
  }
  if (b.tier > 2) b.gloom(rng.range(LEFT + 60, RIGHT - 60), b.cy + 360);
  b.gemLine(VIEW.w / 2, b.cy + 30, VIEW.w / 2, b.cy + 100, 2);
}

function pGemfall(b) {
  const rng = b.rng;
  b.plat(VIEW.w / 2 - 110, b.cy + CHUNK_H - 150, 220, 'solid');
  b.plat(LEFT, b.cy + 120, 150, 'solid');
  b.plat(RIGHT - 150, b.cy + 300, 150, 'solid');
  for (let i = 0; i < 4; i++) {
    b.gemArc(VIEW.w / 2 + rng.range(-140, 140), b.cy + 150 + i * 120, 5, 200, 60);
  }
  if (b.tier > 1) b.saw(VIEW.w / 2, b.cy + 400, 24, { axis: 'x', amp: 200, speed: 0.55 });
  if (b.tier > 3) b.gloom(VIEW.w / 2, b.cy + 240);
  if (b.tier > 2) b.spike(VIEW.w / 2 - 20, b.cy + CHUNK_H - 150, 40);
}

function pSwitchback(b) {
  const rows = 5;
  const step = (CHUNK_H - 160) / rows;
  let side = b.rng.sign();
  for (let i = 0; i < rows; i++) {
    const y = b.cy + 105 + i * step;
    const w = b.rng.range(190, 250);
    const x = side > 0 ? LEFT + b.rng.range(6, 46) : RIGHT - w - b.rng.range(6, 46);
    const type = i === 2 && b.tier > 4 ? 'crumble' : 'solid';
    b.plat(x, y, w, type, i % 2 === 0 && b.tier > 5 ? { range: b.rng.range(20, 40), speed: 0.9 } : {});
    b.gem(x + w * 0.5, y - 48);
    b.gem(x + w * 0.5 + side * 40, y - 86);
    if (b.tier > 2 && b.rng.chance(0.35)) b.spike(x + w * 0.5 - 12, y, 24);
    side *= -1;
  }
  b.gemArc(VIEW.w / 2, b.cy + CHUNK_H - 180, 4, 220, 40);
}

function pFunnel(b) {
  const rows = 6;
  const step = (CHUNK_H - 140) / rows;
  for (let i = 0; i < rows; i++) {
    const y = b.cy + 90 + i * step;
    const w = b.rng.range(120, 175);
    const left = i % 2 === 0;
    b.plat(left ? LEFT : RIGHT - w, y, w, 'solid');
    const innerX = left ? LEFT + w + 40 : RIGHT - w - 40;
    b.gem(clamp(innerX, LEFT, RIGHT), y - 30);
    if (i % 3 === 2 && b.tier > 3) {
      b.saw(VIEW.w / 2 + b.rng.range(-50, 50), y + step * 0.42, 18, { axis: 'x', amp: 80, speed: 1.2 });
    }
  }
  b.gemLine(VIEW.w / 2, b.cy + 36, VIEW.w / 2, b.cy + 96, 2);
}

function pCascade(b) {
  const cols = 7;
  const step = (CHUNK_H - 170) / cols;
  for (let i = 0; i < cols; i++) {
    const y = b.cy + 95 + i * step;
    const t = i / (cols - 1);
    const x = LEFT + 70 + (Math.sin(t * Math.PI * 2) * 0.5 + 0.5) * (RIGHT - LEFT - 220);
    const w = b.rng.range(120, 165);
    const px = clamp(x, LEFT, RIGHT - w);
    b.plat(px, y, w, 'solid');
    b.gem(px + w / 2, y - 44);
  }
  b.gemArc(VIEW.w / 2, b.cy + CHUNK_H - 230, 4, 240, 50);
  if (b.tier > 4) b.saw(VIEW.w / 2, b.cy + CHUNK_H - 320, 20, { amp: 120, speed: 0.9 });
}

function pLaserGate(b) {
  const rows = 4;
  const step = (CHUNK_H - 170) / rows;
  for (let i = 0; i < rows; i++) {
    const y = b.cy + 105 + i * step;
    const w = b.rng.range(160, 210);
    const left = i % 2 === 0;
    b.plat(left ? LEFT : RIGHT - w, y, w, 'solid', b.tier > 5 && i % 2 ? { range: 28, speed: 0.8 } : {});
    const gateY = y + step * 0.5;
    const fromLeft = i % 2 === 1;
    const gate = b.beam(gateY, {
      side: fromLeft ? 'left' : 'right',
      w: b.rng.range(160, 210),
      phase: b.rng.range(0, 2),
      period: 3.2,
    });
    b.gem(gate.openX, gateY + 20);
    b.gem(VIEW.w / 2, gateY - 34);
  }
  b.gemLine(VIEW.w / 2, b.cy + 30, VIEW.w / 2, b.cy + 80, 2);
}

const PATTERNS = [
  { fn: pZigzag, weight: () => 3, min: 0 },
  { fn: pShaft, weight: () => 2.4, min: 0 },
  { fn: pCrumble, weight: (t) => (t > 1 ? 1.6 : 0.5), min: 0 },
  { fn: pSawAlley, weight: (t) => (t > 1 ? 2 : 0.8), min: 1 },
  { fn: pGauntlet, weight: (t) => (t > 2 ? 2 : 0.4), min: 1 },
  { fn: pBounce, weight: () => 0.9, min: 0 },
  { fn: pIslands, weight: () => 2, min: 0 },
  { fn: pGemfall, weight: (t) => (t > 2 ? 1.6 : 0.7), min: 0 },
  { fn: pSwitchback, weight: () => 1.7, min: 2 },
  { fn: pFunnel, weight: () => 1.5, min: 3 },
  { fn: pCascade, weight: () => 1.4, min: 4 },
  { fn: pLaserGate, weight: () => 1.4, min: 5 },
];

function pathExists(platforms, startY, endY) {
  const nodes = platforms.filter((p) => !p.broken && p.y >= startY - 40 && p.y <= endY + 40);
  if (nodes.length < 2) return false;
  const start = nodes.filter((p) => p.y <= startY + 200);
  if (!start.length) return false;
  const seen = new Set(start);
  let frontier = start;
  const goalY = endY - 110;
  while (frontier.length) {
    const next = [];
    for (const a of frontier) {
      if (a.y >= goalY) return true;
      for (const b of nodes) {
        if (seen.has(b)) continue;
        const dy = b.y - a.y;
        if (dy < -70 || dy > 300) continue;
        const gap = Math.max(0, Math.max(a.x - (b.x + b.w), b.x - (a.x + a.w)));
        const reach = 340 + Math.max(0, dy) * 0.55;
        if (gap > reach) continue;
        seen.add(b);
        next.push(b);
      }
    }
    frontier = next;
  }
  return false;
}

function clearHazardsNear(b, x, y, w) {
  b.hazards = b.hazards.filter((h) => {
    const hw = h.w || (h.r ? h.r * 2 : 30);
    const hx = h.x - (h.r || 0);
    const xOverlap = hx < x + w + 24 && hx + hw > x - 24;
    const yOverlap = h.y > y - 90 && h.y < y + 36;
    return !(xOverlap && yOverlap);
  });
}

// Guarantees a physical route down the chunk. Most chunks pass untouched;
// a centre ladder is only added when the generated layout has a real gap.
function ensurePath(b) {
  if (pathExists(b.platforms, b.cy, b.cy + CHUNK_H)) return false;
  const spots = [80, 260, 440, 600];
  const w = 190;
  const x = VIEW.w / 2 - w / 2;
  for (const off of spots) {
    const y = b.cy + off;
    const overlaps = b.platforms.some(
      (p) => Math.abs(p.y - y) < 26 && p.x < x + w && p.x + p.w > x
    );
    if (!overlaps) {
      b.plat(x, y, w, 'solid');
      clearHazardsNear(b, x, y, w);
    }
  }
  return true;
}

function buildChunk(seed, index, tier) {
  const b = new Builder(seed, index, tier);
  const pool = PATTERNS.filter((p) => tier >= p.min);
  let total = 0;
  for (const p of pool) total += p.weight(tier);
  let roll = b.rng.next() * total;
  let chosen = pool[0].fn;
  for (const p of pool) {
    roll -= p.weight(tier);
    if (roll <= 0) {
      chosen = p.fn;
      break;
    }
  }
  chosen(b);

  if (index >= 2 && b.hazards.length === 0) {
    b.saw(VIEW.w / 2, b.cy + b.rng.range(250, CHUNK_H - 250), 20, { amp: 110, speed: 1.1 });
  }

  const catchY = b.cy + CHUNK_H - 96;
  const hasCatch = b.platforms.some((p) => p.y > catchY - 40 && p.y < b.cy + CHUNK_H - 20);
  if (!hasCatch) {
    const w = b.rng.range(170, 240);
    b.plat(b.rng.range(LEFT + 60, RIGHT - 60 - w), catchY, w, 'solid');
  }

  ensurePath(b);

  if (b.rng.chance(0.16)) b.power(b.rng.range(LEFT + 60, RIGHT - 60), b.cy + b.rng.range(120, CHUNK_H - 160), pickPower(b));
  if (b.rng.chance(0.1)) b.heart(b.rng.range(LEFT + 60, RIGHT - 60), b.cy + b.rng.range(140, CHUNK_H - 180));

  for (let i = 0; i < 3; i++) {
    const side = b.rng.chance(0.5) ? 'left' : 'right';
    const kind = b.rng.pick(['crystal', 'vine', 'pipe', 'shard', 'mushroom']);
    b.deco(kind, side === 'left' ? b.rng.range(6, 48) : b.rng.range(VIEW.w - 48, VIEW.w - 6), b.cy + b.rng.range(0, CHUNK_H), b.rng.range(0.7, 1.5));
  }

  return {
    platforms: b.platforms,
    hazards: b.hazards,
    pickups: b.pickups,
    decor: b.decor,
    tier,
  };
}

function tierForDepth(depthM) {
  return clamp(Math.floor(depthM / 110), 0, 14);
}

/* ---- js/game/entities.js ---- */
function updatePlatform(p, dt, time) {
  if (p.range) p.x = p.originX + Math.sin(time * p.speed + p.phase) * p.range;
  p.squash = Math.max(0, p.squash - dt * 3.2);
  if (p.timer > 0) {
    p.timer -= dt;
    p.shake = Math.sin(time * 60) * 2.4;
    if (p.timer <= 0) {
      p.broken = true;
      p.removeIn = 0.55;
      return true;
    }
  }
  if (p.broken) {
    p.removeIn -= dt;
    p.y += 520 * dt;
  }
  return false;
}

function updateHazard(h, dt, time, player, scale = 1) {
  switch (h.type) {
    case 'saw': {
      h.angle = (h.angle || 0) + dt * 7 * scale;
      const off = Math.sin(time * h.speed + h.phase) * h.amp;
      if (h.axis === 'y') {
        h.y = h.baseY + off;
      } else {
        h.x = h.baseX + off;
      }
      break;
    }
    case 'laser': {
      h.timer += dt * scale;
      const cycle = h.period;
      const t = (h.timer + h.phase) % cycle;
      if (t < h.warnTime) {
        h.state = 'warn';
        h.active = false;
      } else if (t < h.warnTime + h.onTime) {
        h.state = 'on';
        h.active = true;
      } else {
        h.state = 'off';
        h.active = false;
      }
      break;
    }
    case 'crusher': {
      h.timer = (h.timer || 0) + dt * scale;
      const t = (h.timer + h.phase) % h.period;
      const norm = t / h.period;
      let k;
      if (norm < 0.45) k = 0;
      else if (norm < 0.55) k = (norm - 0.45) / 0.1;
      else if (norm < 0.7) k = 1;
      else if (norm < 0.85) k = 1 - (norm - 0.7) / 0.15;
      else k = 0;
      h.warn = norm > 0.3 && norm < 0.45 ? 1 : 0;
      h.offset = k * h.range;
      h.y = h.baseY + h.offset;
      break;
    }
    case 'gloom': {
      h.t += dt * scale;
      const dx = player.x + player.w / 2 - (h.x + h.w / 2);
      const dy = player.y + player.h / 2 - (h.y + h.h / 2);
      const d = Math.hypot(dx, dy) || 1;
      if (d < 420) {
        h.vx += (dx / d) * 34 * dt * scale;
        h.vy += (dy / d) * 34 * dt * scale;
      }
      h.vx *= 0.98;
      h.vy *= 0.98;
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      break;
    }
    default:
      break;
  }
}

function hazardRect(h) {
  switch (h.type) {
    case 'saw':
      return { x: h.x - h.r * 0.78, y: h.y - h.r * 0.78, w: h.r * 1.56, h: h.r * 1.56 };
    case 'laser':
      return h.active ? { x: h.x, y: h.y - h.h / 2, w: h.w, h: h.h } : null;
    case 'crusher':
      return { x: h.x, y: h.y, w: h.w, h: h.h };
    default:
      return { x: h.x, y: h.y, w: h.w, h: h.h };
  }
}

function renderPlatform(ctx, p, pal, time) {
  if (p.broken && p.removeIn <= 0) return;
  const y = p.y;
  const shake = p.shake || 0;
  const squash = p.squash || 0;
  ctx.save();
  ctx.globalAlpha = p.broken ? clamp(p.removeIn / 0.55, 0, 1) : 1;
  ctx.translate(shake, 0);
  const h = p.h + squash * 4;
  const top = p.type === 'bounce' ? pal.accent2 : p.type === 'crumble' ? '#e0a870' : pal.platformTop;
  const body = p.type === 'bounce' ? '#b8632e' : p.type === 'crumble' ? '#7a5230' : pal.platformBody;

  const g = ctx.createLinearGradient(0, y, 0, y + h + 10);
  g.addColorStop(0, top);
  g.addColorStop(0.28, body);
  g.addColorStop(1, alpha(body, 0.25));
  ctx.fillStyle = g;
  rr(ctx, p.x, y, p.w, h, 7);
  ctx.fill();

  ctx.fillStyle = alpha('#ffffff', 0.55);
  rr(ctx, p.x + 3, y + 1.5, p.w - 6, 2.6, 2);
  ctx.fill();

  if (p.type === 'crumble') {
    ctx.strokeStyle = alpha('#3b2413', 0.6);
    ctx.lineWidth = 1.6;
    for (let i = 1; i < 4; i++) {
      const cx = p.x + (p.w / 4) * i;
      ctx.beginPath();
      ctx.moveTo(cx, y + 2);
      ctx.lineTo(cx - 5, y + h * 0.6);
      ctx.lineTo(cx + 4, y + h);
      ctx.stroke();
    }
  }
  if (p.type === 'bounce') {
    ctx.strokeStyle = alpha('#ffe6a3', 0.9);
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const bx = p.x + 14 + i * (p.w - 24) / 3;
      ctx.moveTo(bx - 6, y + h + 7);
      ctx.lineTo(bx, y + h + 1);
      ctx.lineTo(bx + 6, y + h + 7);
    }
    ctx.stroke();
  }
  if (p.type === 'cloud') {
    ctx.fillStyle = alpha('#ffffff', 0.16);
    ctx.beginPath();
    ctx.ellipse(p.x + p.w * 0.25, y + h + 4, p.w * 0.3, 10, 0, 0, TAU);
    ctx.ellipse(p.x + p.w * 0.7, y + h + 6, p.w * 0.28, 8, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function renderHazard(ctx, h, pal, time) {
  switch (h.type) {
    case 'spike': {
      const n = Math.max(2, Math.round(h.w / 13));
      const tw = h.w / n;
      const g = ctx.createLinearGradient(0, h.y, 0, h.y + h.h);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.5, pal.hazard);
      g.addColorStop(1, alpha(pal.hazard, 0.55));
      ctx.fillStyle = g;
      ctx.shadowColor = alpha(pal.hazard, 0.65);
      ctx.shadowBlur = 10;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const x = h.x + i * tw;
        if (h.dir === 'up') {
          ctx.moveTo(x, h.y + h.h);
          ctx.lineTo(x + tw / 2, h.y);
          ctx.lineTo(x + tw, h.y + h.h);
        } else {
          ctx.moveTo(x, h.y);
          ctx.lineTo(x + tw / 2, h.y + h.h);
          ctx.lineTo(x + tw, h.y);
        }
      }
      ctx.fill();
      ctx.shadowBlur = 0;
      break;
    }
    case 'saw': {
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.angle || 0);
      ctx.shadowColor = alpha(pal.hazard, 0.7);
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#d8dbe6';
      ctx.beginPath();
      const teeth = 10;
      for (let i = 0; i < teeth * 2; i++) {
        const a = (i * Math.PI) / teeth;
        const rad = i % 2 === 0 ? h.r : h.r * 0.78;
        const px = Math.cos(a) * rad;
        const py = Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = pal.hazard;
      ctx.beginPath();
      ctx.arc(0, 0, h.r * 0.44, 0, TAU);
      ctx.fill();
      ctx.fillStyle = alpha('#ffffff', 0.5);
      ctx.beginPath();
      ctx.arc(-h.r * 0.14, -h.r * 0.14, h.r * 0.16, 0, TAU);
      ctx.fill();
      ctx.restore();
      break;
    }
    case 'laser': {
      const cy = h.y;
      ctx.fillStyle = alpha('#ffffff', 0.18);
      rr(ctx, h.x - 6, cy - 12, 10, 24, 4);
      ctx.fill();
      rr(ctx, h.x + h.w - 4, cy - 12, 10, 24, 4);
      ctx.fill();
      if (h.state === 'warn') {
        const blink = 0.35 + 0.45 * Math.abs(Math.sin(time * 26));
        ctx.strokeStyle = alpha(pal.hazard, blink);
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(h.x, cy);
        ctx.lineTo(h.x + h.w, cy);
        ctx.stroke();
        ctx.setLineDash([]);
      } else if (h.state === 'on') {
        const flicker = 0.75 + 0.25 * Math.sin(time * 40);
        ctx.shadowColor = pal.hazard;
        ctx.shadowBlur = 22;
        const g = ctx.createLinearGradient(0, cy - h.h / 2, 0, cy + h.h / 2);
        g.addColorStop(0, alpha('#ffffff', 0.15));
        g.addColorStop(0.5, alpha(pal.hazard, flicker));
        g.addColorStop(1, alpha('#ffffff', 0.15));
        ctx.fillStyle = g;
        rr(ctx, h.x, cy - h.h / 2, h.w, h.h, 5);
        ctx.fill();
        ctx.fillStyle = alpha('#ffffff', 0.75);
        rr(ctx, h.x + 2, cy - 2, h.w - 4, 4, 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      break;
    }
    case 'crusher': {
      ctx.fillStyle = alpha(pal.hazard, 0.12);
      rr(ctx, h.x - 3, h.baseY - 88, h.w + 6, 90, 6);
      ctx.fill();
      ctx.fillStyle = '#3a3f52';
      const g = ctx.createLinearGradient(0, h.y, 0, h.y + h.h);
      g.addColorStop(0, '#6b7280');
      g.addColorStop(1, '#2f3444');
      ctx.fillStyle = g;
      rr(ctx, h.x, h.y, h.w, h.h, 8);
      ctx.fill();
      ctx.fillStyle = alpha(pal.hazard, h.warn ? 0.8 : 0.5);
      for (let i = 0; i < 5; i++) {
        const x = h.x + 8 + i * ((h.w - 16) / 5);
        ctx.beginPath();
        ctx.moveTo(x, h.y + h.h);
        ctx.lineTo(x + (h.w - 16) / 10, h.y + h.h + 12);
        ctx.lineTo(x + (h.w - 16) / 5, h.y + h.h);
        ctx.fill();
      }
      break;
    }
    case 'gloom': {
      const bob = Math.sin(time * 3 + h.t) * 3;
      const cx = h.x + h.w / 2;
      const cy = h.y + h.h / 2 + bob;
      ctx.shadowColor = alpha(pal.hazard, 0.6);
      ctx.shadowBlur = 18;
      const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, h.w * 0.75);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.4, pal.hazard);
      g.addColorStop(1, alpha(pal.hazard, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, h.w * 0.75, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#1b1226';
      ctx.beginPath();
      ctx.ellipse(cx - 6, cy - 2, 3.4, 4.6, 0, 0, TAU);
      ctx.ellipse(cx + 6, cy - 2, 3.4, 4.6, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = alpha('#ffffff', 0.9);
      ctx.beginPath();
      ctx.arc(cx - 6 + 1, cy - 3, 1.3, 0, TAU);
      ctx.arc(cx + 6 + 1, cy - 3, 1.3, 0, TAU);
      ctx.fill();
      break;
    }
    default:
      break;
  }
}

function updatePickup(p, dt, time, player, magnet) {
  p.t += dt;
  if (p.taken) return false;
  if (p.type === 'gem' && magnet) {
    const dx = player.x + player.w / 2 - p.x;
    const dy = player.y + player.h / 2 - p.y;
    const d = Math.hypot(dx, dy);
    if (d < 230 && d > 1) {
      const pull = 640 * dt;
      p.x += (dx / d) * pull;
      p.y += (dy / d) * pull;
      p.baseY = p.y;
    }
  }
  return true;
}

function renderPickup(ctx, p, pal, time) {
  const bob = Math.sin(time * 3.2 + p.t) * 4;
  const x = p.x;
  const y = p.y + bob;
  ctx.save();
  if (p.type === 'gem') {
    const s = p.r;
    const w = s * 0.8;
    ctx.shadowColor = pal.gem;
    ctx.shadowBlur = 18;
    ctx.translate(x, y);
    ctx.rotate(Math.sin(time * 1.6 + p.t) * 0.18);
    const g = ctx.createLinearGradient(0, -s, 0, s);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.4, shade(pal.gem, 0.15));
    g.addColorStop(1, alpha(pal.gem, 0.55));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(w, 0);
    ctx.lineTo(0, s);
    ctx.lineTo(-w, 0);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = alpha('#ffffff', 0.55);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-w, 0);
    ctx.lineTo(0, -s);
    ctx.lineTo(w, 0);
    ctx.lineTo(0, s);
    ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = alpha('#ffffff', 0.7);
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.7);
    ctx.lineTo(w * 0.36, 0);
    ctx.lineTo(0, s * 0.18);
    ctx.closePath();
    ctx.fill();
  } else if (p.type === 'heart') {
    const s = p.r;
    ctx.shadowColor = '#ff6b8b';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#ff6b8b';
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.75);
    ctx.bezierCurveTo(x - s * 1.2, y - s * 0.1, x - s * 0.45, y - s * 0.95, x, y - s * 0.3);
    ctx.bezierCurveTo(x + s * 0.45, y - s * 0.95, x + s * 1.2, y - s * 0.1, x, y + s * 0.75);
    ctx.fill();
    ctx.shadowBlur = 0;
  } else if (p.type === 'power') {
    const def = POWERUPS[p.kind];
    const s = p.r;
    ctx.shadowColor = def.color;
    ctx.shadowBlur = 20;
    ctx.translate(x, y);
    ctx.rotate(Math.sin(time * 2 + p.t) * 0.15);
    const g = ctx.createLinearGradient(-s, -s, s, s);
    g.addColorStop(0, alpha('#ffffff', 0.95));
    g.addColorStop(1, alpha(def.color, 0.75));
    ctx.fillStyle = g;
    rr(ctx, -s, -s, s * 2, s * 2, 8);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#101322';
    drawIcon(ctx, p.kind, 0, 0, s * 0.55);
  }
  ctx.restore();
}

function drawIcon(ctx, kind, x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#101322';
  ctx.strokeStyle = '#101322';
  ctx.lineWidth = Math.max(1.6, s * 0.16);
  if (kind === 'shield') {
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(s * 0.8, -s * 0.55);
    ctx.quadraticCurveTo(s * 0.8, s * 0.6, 0, s);
    ctx.quadraticCurveTo(-s * 0.8, s * 0.6, -s * 0.8, -s * 0.55);
    ctx.closePath();
    ctx.fill();
  } else if (kind === 'magnet') {
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.72, Math.PI, 0);
    ctx.lineWidth = s * 0.4;
    ctx.stroke();
    ctx.fillRect(-s * 0.92, 0, s * 0.4, s * 0.62);
    ctx.fillRect(s * 0.52, 0, s * 0.4, s * 0.62);
  } else if (kind === 'slow') {
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.8, 0, TAU);
    ctx.lineWidth = s * 0.22;
    ctx.stroke();
    ctx.lineWidth = s * 0.16;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -s * 0.45);
    ctx.moveTo(0, 0);
    ctx.lineTo(s * 0.35, s * 0.2);
    ctx.stroke();
  } else if (kind === 'glide') {
    ctx.beginPath();
    ctx.moveTo(-s * 0.85, s * 0.2);
    ctx.quadraticCurveTo(0, -s * 1.05, s * 0.85, s * 0.2);
    ctx.quadraticCurveTo(0, s * 0.5, -s * 0.85, s * 0.2);
    ctx.fill();
  }
  ctx.restore();
}

function renderDecor(ctx, d, pal) {
  const x = d.x;
  const y = d.y;
  const s = d.size;
  ctx.save();
  ctx.globalAlpha = 0.55;
  if (d.kind === 'crystal') {
    ctx.fillStyle = alpha(pal.accent, 0.7);
    ctx.beginPath();
    ctx.moveTo(x, y - 28 * s);
    ctx.lineTo(x + 11 * s, y);
    ctx.lineTo(x, y + 16 * s);
    ctx.lineTo(x - 11 * s, y);
    ctx.closePath();
    ctx.fill();
  } else if (d.kind === 'vine') {
    ctx.strokeStyle = alpha(pal.accent2, 0.5);
    ctx.lineWidth = 3 * s;
    ctx.beginPath();
    ctx.moveTo(x, y - 40 * s);
    ctx.bezierCurveTo(x + 18 * s, y - 18 * s, x - 16 * s, y + 4 * s, x + 4 * s, y + 26 * s);
    ctx.stroke();
  } else if (d.kind === 'pipe') {
    ctx.fillStyle = '#1c2334';
    rr(ctx, x - 10 * s, y - 30 * s, 20 * s, 60 * s, 6 * s);
    ctx.fill();
    ctx.fillStyle = alpha(pal.accent, 0.35);
    rr(ctx, x - 5 * s, y - 26 * s, 6 * s, 50 * s, 3 * s);
    ctx.fill();
  } else if (d.kind === 'shard') {
    ctx.fillStyle = alpha(pal.accent2, 0.5);
    ctx.beginPath();
    ctx.moveTo(x - 8 * s, y);
    ctx.lineTo(x, y - 14 * s);
    ctx.lineTo(x + 8 * s, y);
    ctx.lineTo(x, y + 10 * s);
    ctx.fill();
  } else {
    ctx.fillStyle = alpha(pal.accent, 0.4);
    ctx.beginPath();
    ctx.ellipse(x, y, 14 * s, 7 * s, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(x - 2 * s, y - 2, 4 * s, 10 * s);
  }
  ctx.restore();
}

const WORLD_WIDTH = VIEW.w;

/* ---- js/game/world.js ---- */
class World {
  constructor() {
    this.seed = 1;
    this.reset(1);
  }

  reset(seed = Math.floor(Math.random() * 1e9)) {
    this.seed = seed;
    this.platforms = [];
    this.hazards = [];
    this.pickups = [];
    this.decor = [];
    this.time = 0;
    this.chunkIndex = 0;
    this.generatedTo = 0;
    this.depthM = 0;
    this.bestY = 0;
    this.stormY = -STORM.startAhead;
    this.stormSpeed = STORM.baseSpeed;
    this.biome = 0;
    this.palette = BIOMES[0];
    this.biomeChanged = false;
    this.cycle = 0;
    this.cycleChanged = false;
    this.localDepth = 0;
    this.hazardScale = 1;
    this.maxFall = PHYS.maxFall;
    this._nearCooldown = new Map();
    this.ensureGenerated(VIEW.h * 4);
  }

  clearSpawn(cx, y) {
    const left = cx - 110;
    const right = cx + 110;
    this.platforms = this.platforms.filter(
      (p) => !(p.y > y + 4 && p.y < y + 360 && p.x < right && p.x + p.w > left)
    );
    this.hazards = this.hazards.filter(
      (h) => !(h.y > y - 90 && h.y < y + 380 && h.x < right + 40 && h.x + (h.w || 40) > left - 40)
    );
  }

  ensureGenerated(untilY) {
    let guard = 0;
    while (this.generatedTo < untilY && guard < 40) {
      const depthOfChunk = (this.chunkIndex * CHUNK_H) / PX_PER_METER;
      const cycle = Math.floor(depthOfChunk / CYCLE.depth);
      const tier = tierForDepth(depthOfChunk - cycle * CYCLE.depth);
      const chunk = buildChunk(this.seed + cycle * 104729, this.chunkIndex, tier);
      this.platforms.push(...chunk.platforms);
      this.hazards.push(...chunk.hazards);
      this.pickups.push(...chunk.pickups);
      this.decor.push(...chunk.decor);
      this.generatedTo += CHUNK_H;
      this.chunkIndex += 1;
      guard += 1;
    }
  }

  update(dt, player, handlers) {
    this.time += dt;
    this.bestY = Math.max(this.bestY, player.y);
    this.depthM = this.bestY / PX_PER_METER;
    const prevCycle = this.cycle;
    this.cycle = Math.floor(this.depthM / CYCLE.depth);
    this.cycleChanged = this.cycle !== prevCycle;
    this.localDepth = this.depthM - this.cycle * CYCLE.depth;
    const hazardBoost = 1 + Math.min(0.8, this.cycle * CYCLE.hazardStep);
    this.hazardScale = Math.min(CYCLE.maxHazard, (player.powerups.slow > 0 ? 0.42 : 1) * hazardBoost);
    this.maxFall = PHYS.maxFall + Math.min(90, this.depthM * 0.08);
    const setSpeed = (STORM.baseSpeed + this.localDepth * STORM.speedPerMeter) * (1 + this.cycle * CYCLE.speedStep);
    this.stormSpeed = Math.min(CYCLE.maxStorm, Math.max(STORM.baseSpeed, setSpeed));
    this.stormY += this.stormSpeed * dt;

    const idx = biomeIndexAt(this.localDepth);
    this.biomeChanged = idx !== this.biome;
    if (this.biomeChanged) this.biome = idx;
    this.palette = BIOMES[this.biome];

    this.ensureGenerated(player.y + VIEW.h * 2);

    for (let i = this.platforms.length - 1; i >= 0; i--) {
      const p = this.platforms[i];
      if (updatePlatform(p, dt, this.time)) handlers.onBreak?.(p);
      if (p.broken && p.removeIn <= 0) this.platforms.splice(i, 1);
      else if (p.y < player.y - VIEW.h * 1.6) this.platforms.splice(i, 1);
    }

    for (const h of this.hazards) updateHazard(h, dt, this.time, player, this.hazardScale);

    const hb = player.hitbox();
    for (let i = this.hazards.length - 1; i >= 0; i--) {
      const h = this.hazards[i];
      if (h.y < player.y - VIEW.h * 1.7) {
        this.hazards.splice(i, 1);
        continue;
      }
      if (player.invuln > 0) continue;
      const r = hazardRect(h);
      if (r && aabb(hb.x, hb.y, hb.w, hb.h, r.x, r.y, r.w, r.h)) {
        handlers.onHurt?.(h);
        break;
      }
    }

    const magnet = player.powerups.magnet > 0;
    for (let i = this.pickups.length - 1; i >= 0; i--) {
      const p = this.pickups[i];
      if (p.y < player.y - VIEW.h * 1.7) {
        this.pickups.splice(i, 1);
        continue;
      }
      updatePickup(p, dt, this.time, player, magnet);
      if (p.taken) {
        this.pickups.splice(i, 1);
        continue;
      }
      const cx = player.x + player.w / 2;
      const cy = player.y + player.h / 2;
      const dx = p.x - cx;
      const dy = p.y - cy;
      const reach = p.type === 'gem' ? 26 : 30;
      if (dx * dx + dy * dy < reach * reach) {
        p.taken = true;
        this.pickups.splice(i, 1);
        if (p.type === 'gem') handlers.onGem?.(p);
        else if (p.type === 'heart') handlers.onHeart?.(p);
        else handlers.onPower?.(p);
      }
    }

    for (let i = this.decor.length - 1; i >= 0; i--) {
      if (this.decor[i].y < player.y - VIEW.h * 1.7) this.decor.splice(i, 1);
    }
  }

  platformsNear(y) {
    const out = [];
    for (const p of this.platforms) {
      if (p.broken) continue;
      if (p.y > y - 90 && p.y < y + 90) out.push(p);
    }
    return out;
  }

  stormTouching(player) {
    return player.y + 12 < this.stormY;
  }

  stormWarning(player) {
    return clamp(1 - (player.y - this.stormY) / STORM.warnRange, 0, 1);
  }

  nearestHazard(player, radius = 30) {
    const cx = player.x + player.w / 2;
    const cy = player.y + player.h / 2;
    for (const h of this.hazards) {
      const key = h;
      if ((this._nearCooldown.get(key) || 0) > this.time) continue;
      const r = hazardRect(h);
      if (!r) continue;
      const nx = clamp(cx, r.x, r.x + r.w);
      const ny = clamp(cy, r.y, r.y + r.h);
      const d = Math.hypot(cx - nx, cy - ny);
      if (d < radius && d > 1) {
        this._nearCooldown.set(key, this.time + 1.2);
        return h;
      }
    }
    return null;
  }

  clearNearMissCooldowns() {
    this._nearCooldown.clear();
  }
}

/* ---- js/game/player.js ---- */
const INSET = PHYS.hitInset;

class Player {
  constructor() {
    this.def = null;
    this.trailDef = null;
    this.reset(VIEW.w / 2, 200);
  }

  reset(x, y) {
    this.x = x - PHYS.w / 2;
    this.y = y;
    this.w = PHYS.w;
    this.h = PHYS.h;
    this.vx = 0;
    this.vy = 0;
    this.onGround = false;
    this.groundRef = null;
    this.coyote = 0;
    this.buffer = 0;
    this.airJumps = this.maxAirJumps();
    this.jumpsUsed = 0;
    this.dashTimer = 0;
    this.dashCd = 0;
    this.dashDir = 1;
    this.invuln = 0;
    this.shield = false;
    this.powerups = { magnet: 0, slow: 0, glide: 0 };
    this.facing = 1;
    this.squashX = 1;
    this.squashY = 1;
    this.trail = [];
    this.trailTimer = 0;
    this.anim = 0;
    this.blink = 0;
    this.dropTimer = 0;
    this.jumpHeldLast = false;
    this.airTime = 0;
    this.fallTime = 0;
    this.wingsActive = false;
    this.landImpact = 0;
    this.events = [];
    this.alive = true;
  }

  maxAirJumps() {
    return this.def?.stats?.air ?? PHYS.airJumps;
  }

  setLoadout(charDef, trailDef) {
    this.def = charDef;
    this.trailDef = trailDef;
    this.airJumps = Math.min(this.airJumps, this.maxAirJumps());
  }

  hitbox() {
    return { x: this.x + INSET, y: this.y + INSET, w: this.w - INSET * 2, h: this.h - INSET * 2 };
  }

  glideActive() {
    return this.powerups.glide > 0 || !!this.def?.stats?.glide;
  }

  addPower(kind) {
    if (kind === 'shield') {
      this.shield = true;
      return;
    }
    this.powerups[kind] = Math.max(this.powerups[kind] || 0, 0) + (kind === 'magnet' ? 7 : kind === 'slow' ? 5 : 7);
  }

  hurt(dir = 0) {
    if (this.invuln > 0) return 'none';
    if (this.shield) {
      this.shield = false;
      this.invuln = 0.9;
      this.vx = dir * 260;
      this.vy = -180;
      return 'shield';
    }
    this.invuln = 1.4;
    this.vx = dir * 300;
    this.vy = -260;
    this.squashX = 0.7;
    this.squashY = 1.3;
    return 'hit';
  }

  update(dt, input, world) {
    this.events.length = 0;
    this.wingsActive = false;
    const stats = this.def?.stats || { speed: PHYS.speed, jump: PHYS.jump, gravity: PHYS.gravity, air: 1 };

    this.invuln = Math.max(0, this.invuln - dt);
    this.dashCd = Math.max(0, this.dashCd - dt);
    this.dropTimer = Math.max(0, this.dropTimer - dt);
    this.anim += dt * (this.onGround ? Math.min(1.4, 0.3 + Math.abs(this.vx) / 320) : 0.6);
    this.blink -= dt;
    if (this.blink < -0.2 - Math.random() * 2.6) this.blink = 0.12;
    for (const k of Object.keys(this.powerups)) this.powerups[k] = Math.max(0, this.powerups[k] - dt);

    const axis = input.axis;
    if (input.jumpQueued) {
      this.buffer = PHYS.buffer;
      input.consumeJump();
    }
    if (input.dashQueued) {
      input.consumeDash();
      if (this.dashCd <= 0 && this.dashTimer <= 0) {
        this.dashTimer = PHYS.dashTime;
        this.dashCd = PHYS.dashCooldown;
        this.dashDir = axis !== 0 ? axis : this.facing;
        this.facing = this.dashDir;
        this.onGround = false;
        this.vy = 0;
        this.events.push({ type: 'dash' });
      }
    }

    if (this.dashTimer > 0) {
      this.dashTimer -= dt;
      this.vx = this.dashDir * PHYS.dashSpeed;
      this.vy = 0;
    } else {
      const accel = this.onGround ? PHYS.accelGround : PHYS.accelAir;
      if (axis !== 0) {
        this.vx = approach(this.vx, axis * stats.speed, accel * dt);
        this.facing = axis;
      } else {
        const fr = this.onGround ? PHYS.frictionGround : PHYS.frictionAir;
        this.vx = approach(this.vx, 0, fr * dt);
      }
      const wings = !this.onGround && input.wantsJump && this.vy > 0;
      this.wingsActive = wings;
      if (wings) {
        const cap = this.glideActive() ? PHYS.glideFall : PHYS.wingFall;
        this.vy = approach(this.vy, cap, PHYS.wingDrag * dt);
        this.fallTime = 0;
      } else {
        const gMul = this.vy > 0 ? 1.1 : PHYS.riseGravity;
        this.vy += stats.gravity * gMul * dt;
        if (this.vy > 0) this.fallTime += dt;
        else this.fallTime = 0;
        const boost = Math.min(PHYS.fallBoost, this.fallTime * PHYS.fallBoostRate);
        const cap = world.maxFall + boost;
        if (this.vy > cap) this.vy = cap;
      }
      if (this.jumpHeldLast && !input.wantsJump && this.vy < -160) this.vy *= PHYS.jumpCut;
    }
    this.jumpHeldLast = input.wantsJump;

    this.buffer = Math.max(0, this.buffer - dt);
    this.coyote = Math.max(0, this.coyote - dt);

    if (this.buffer > 0 && this.dashTimer <= 0) {
      if (this.onGround || this.coyote > 0) {
        this.vy = -stats.jump;
        this.onGround = false;
        this.groundRef = null;
        this.buffer = 0;
        this.coyote = 0;
        this.fallTime = 0;
        this.jumpsUsed = 1;
        this.squashX = 0.78;
        this.squashY = 1.24;
        this.events.push({ type: 'jump' });
      } else if (this.airJumps > 0) {
        this.airJumps -= 1;
        this.jumpsUsed += 1;
        this.fallTime = 0;
        this.vy = -stats.jump * 0.92;
        this.buffer = 0;
        this.squashX = 0.8;
        this.squashY = 1.22;
        this.events.push({ type: 'double' });
        for (let i = 0; i < 8; i++) this.events.push({ type: 'airburst' });
      }
    }

    if (input.downQueued && this.onGround && this.groundRef && this.groundRef.type === 'cloud') {
      this.onGround = false;
      this.groundRef = null;
      this.y += 8;
      this.dropTimer = 0.26;
      input.consumeDown?.();
    }

    this.x += this.vx * dt;
    const minX = 14;
    const maxX = VIEW.w - 14 - this.w;
    if (this.x < minX) {
      this.x = minX;
      if (this.vx < 0) this.vx = 0;
    } else if (this.x > maxX) {
      this.x = maxX;
      if (this.vx > 0) this.vx = 0;
    }

    const prevBottom = this.y + this.h;
    this.y += this.vy * dt;

    if (this.vy >= 0) {
      const candidates = world.platformsNear(this.y + this.h);
      for (const p of candidates) {
        if (this.x + this.w <= p.x + 3 || this.x >= p.x + p.w - 3) continue;
        if (this.dropTimer > 0 && p.type === 'cloud') continue;
        if (prevBottom <= p.y + 2 && this.y + this.h >= p.y) {
          const impact = this.vy;
          this.y = p.y - this.h;
          this.vy = 0;
          this.onGround = true;
          this.groundRef = p;
          this.coyote = PHYS.coyote;
          this.airJumps = this.maxAirJumps();
          this.fallTime = 0;
          p.squash = Math.min(1, impact / 700);
          if (p.type === 'bounce') {
            this.vy = -640;
            this.onGround = false;
            this.groundRef = null;
            this.events.push({ type: 'bounce' });
          } else {
            const wasAir = this.airTime > 0.12;
            if (wasAir) {
              const perfect = this.jumpsUsed === 0 && Math.abs(this.vx) < 150 && impact > 420;
              this.events.push({ type: 'land', impact, perfect, platform: p });
            }
            if (p.type === 'crumble' && p.timer <= 0) {
              p.timer = 0.55;
              this.events.push({ type: 'crumble' });
            }
            this.airTime = 0;
            this.jumpsUsed = 0;
          }
          break;
        }
      }
    }

    if (this.onGround) {
      const p = this.groundRef;
      if (!p || p.broken || this.x + this.w < p.x + 4 || this.x > p.x + p.w - 4) {
        this.onGround = false;
        this.groundRef = null;
        this.coyote = PHYS.coyote;
      } else {
        this.y = p.y - this.h;
        if (p.range) this.x = clamp(this.x + (p.x - (p.lastX ?? p.x)), 14, VIEW.w - 14 - this.w);
        p.lastX = p.x;
      }
    }

    if (!this.onGround) this.airTime += dt;

    this.squashX = damp(this.squashX, 1, 12, dt);
    this.squashY = damp(this.squashY, 1, 12, dt);

    this.trailTimer -= dt;
    const speed = Math.hypot(this.vx, this.vy);
    if (this.trailTimer <= 0 && speed > 40) {
      this.trailTimer = 0.024;
      this.trail.push({ x: this.x + this.w / 2, y: this.y + this.h / 2, life: 0.4, max: 0.4 });
      if (this.trail.length > 26) this.trail.shift();
    }
    for (const t of this.trail) t.life -= dt;
    this.trail = this.trail.filter((t) => t.life > 0);
  }

  render(ctx, cam) {
    const def = this.def || { color: '#ff7a6b', accent: '#ffd166', hat: 'tuft' };
    const trailDef = this.trailDef || { color: '#ffd166', style: 'dot' };
    const cx = this.x + this.w / 2;
    const sy = this.y - cam;
    const cy = sy + this.h / 2;

    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const a = (t.life / t.max) * 0.5 * (i / this.trail.length + 0.25);
      const ty = t.y - cam;
      if (ty < -30 || ty > 640) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = trailDef.color;
      if (trailDef.style === 'streak') {
        ctx.fillRect(t.x - 3, ty - 8, 6, 16);
      } else if (trailDef.style === 'petal') {
        ctx.beginPath();
        ctx.ellipse(t.x, ty, 5, 3, i * 0.6, 0, TAU);
        ctx.fill();
      } else if (trailDef.style === 'ribbon') {
        ctx.fillRect(t.x - 2, ty - 4, 4, 8);
      } else {
        ctx.beginPath();
        ctx.arc(t.x, ty, 3.4, 0, TAU);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    if (this.onGround && this.groundRef) {
      ctx.fillStyle = alpha('#000000', 0.28);
      ctx.beginPath();
      ctx.ellipse(cx, this.groundRef.y + 2, 18, 5, 0, 0, TAU);
      ctx.fill();
    }

    if (this.invuln > 0 && Math.floor(this.invuln * 14) % 2 === 0) return;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(this.squashX, this.squashY);
    const tilt = clamp(this.vx / 1400, -0.22, 0.22);
    ctx.rotate(tilt);

    const bob = this.onGround ? Math.sin(this.anim * 8) * 1.6 : Math.sin(this.anim * 3) * 1.2;
    const legSwing = this.onGround ? Math.sin(this.anim * 12) * 7 : 4;

    if (this.wingsActive) {
      const flap = 0.5 + 0.5 * Math.sin(this.anim * 26);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = def.accent;
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(
          side * 15,
          -2 + bob,
          10,
          4 + flap * 6,
          side * (0.55 - flap * 0.45),
          0,
          TAU
        );
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    drawFaller(ctx, def, {
      bob,
      legSwing,
      facing: this.facing > 0 ? 1 : -1,
      blink: this.blink > 0,
      t: this.anim,
    });

    if (this.shield) {
      ctx.strokeStyle = alpha('#6ee7ff', 0.75 + Math.sin(this.anim * 6) * 0.2);
      ctx.lineWidth = 2.4;
      ctx.shadowColor = '#6ee7ff';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(0, -4, 26, 0, TAU);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

}

/* ---- js/game/ui.js ---- */
const COLORS = {
  ink: '#070a14',
  panel: '#101725',
  panelLight: '#1a2334',
  stroke: 'rgba(255,255,255,0.14)',
  text: '#eef4ff',
  muted: 'rgba(238,244,255,0.6)',
  good: '#6ee7b7',
  bad: '#ff8a7a',
};

function font(size, weight = 700) {
  return `${weight} ${size}px "Segoe UI", system-ui, -apple-system, sans-serif`;
}

class UI {
  constructor(game) {
    this.game = game;
    this.dragging = null;
    this._hoverId = null;
    this._hoverNow = null;
  }

  begin() {
    this._hoverNow = null;
  }

  end() {
    if (this._hoverNow !== this._hoverId) {
      if (this._hoverNow) this.game.audio.sfx('ui', { hover: true });
      this._hoverId = this._hoverNow;
    }
  }

  get accent() {
    return this.game.palette.accent;
  }

  clicked(x, y, w, h) {
    const p = this.game.input.pointer;
    return p.clicked && p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;
  }

  button(ctx, x, y, w, h, label, opts = {}) {
    const { input } = this.game;
    const p = input.pointer;
    const id = opts.id || label;
    const disabled = !!opts.disabled;
    const over = p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;
    let clicked = false;
    if (over && p.clicked) {
      p.clicked = false;
      if (disabled) this.game.audio.sfx('deny');
      else clicked = true;
    }
    if (over && !disabled) this._hoverNow = id;

    const variant = opts.variant || 'secondary';
    const press = over && p.down ? 1 : 0;
    const scale = 1 + (over && !disabled ? 0.012 : 0);
    const accent = opts.color || this.accent;
    const offsetY = press * 1.5;

    ctx.save();
    ctx.translate(x + w / 2, y + h / 2 + offsetY);
    ctx.scale(scale, scale);
    const bx = -w / 2;
    const by = -h / 2;

    if (variant === 'primary') {
      const g = ctx.createLinearGradient(0, by, 0, by + h);
      g.addColorStop(0, shade(accent, 0.28));
      g.addColorStop(1, accent);
      ctx.fillStyle = disabled ? alpha(accent, 0.3) : g;
      rr(ctx, bx, by, w, h, Math.min(16, h / 2));
      ctx.fill();
      ctx.fillStyle = alpha('#ffffff', 0.32);
      rr(ctx, bx + 4, by + 3, w - 8, Math.min(10, h * 0.22), 6);
      ctx.fill();
      ctx.strokeStyle = alpha('#ffffff', 0.28);
      ctx.lineWidth = 1.2;
      rr(ctx, bx, by, w, h, Math.min(16, h / 2));
      ctx.stroke();
    } else if (variant === 'ghost') {
      if (over) {
        ctx.fillStyle = alpha('#ffffff', 0.07);
        rr(ctx, bx, by, w, h, 12);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = disabled ? 'rgba(20,26,40,0.4)' : over ? 'rgba(30,40,62,0.92)' : 'rgba(16,23,37,0.82)';
      rr(ctx, bx, by, w, h, 12);
      ctx.fill();
      ctx.strokeStyle = over && !disabled ? alpha(accent, 0.65) : COLORS.stroke;
      ctx.lineWidth = 1.4;
      rr(ctx, bx, by, w, h, 12);
      ctx.stroke();
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const sub = opts.sub;
    const labelSize = opts.size || 18;
    ctx.fillStyle = variant === 'primary' ? '#0a1020' : disabled ? 'rgba(238,244,255,0.32)' : COLORS.text;
    ctx.font = font(labelSize, 800);
    const labelY = sub ? -h * 0.12 : 0;
    ctx.fillText(label, 0, labelY);
    if (sub) {
      ctx.font = font(11, 700);
      ctx.fillStyle = variant === 'primary' ? 'rgba(10,16,32,0.62)' : COLORS.muted;
      ctx.fillText(sub, 0, h * 0.24);
    }
    ctx.restore();
    return clicked;
  }

  panel(ctx, x, y, w, h, opts = {}) {
